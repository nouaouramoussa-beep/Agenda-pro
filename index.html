/* ============================================================================
   3. ÉTAT & PERSISTANCE
   ============================================================================ */
/* ===========================================================================
   SECTIONS ET CATEGORIES DEFINIES PAR L'UTILISATEUR
   Les deux sections d'origine restent des « builtin » : les taches deja
   classees en 'ent' / 'perso' gardent donc exactement leur place, et rien
   n'est perdu a la mise a jour. Les ajouts vivent dans store.sections et
   store.subs, donc dans le localStorage, a cote des statuts et des notes.
   =========================================================================== */
const SEC_BUILTIN = [
  {id:'ent', ic:'🏢', c:'#5b8cff', builtin:1,
   ar:'قسم المؤسسة',  fr:'Pôle Entreprise',
   sAr:'ضرائب • هيئات اجتماعية • بنك • محاسبة', sFr:'Impôts • organismes • banque • comptabilité'},
  {id:'perso', ic:'👤', c:'#22c55e', builtin:1,
   ar:'القسم الشخصي', fr:'Pôle Personnel',
   sAr:'وثائق • صحة • عائلة • روتين', sFr:'Documents • santé • famille • routine'}
];
/* La section « مهام Google Tasks » : les taches de Google Tasks s'y rangent
   d'office (gtasks.js, tacheDe), a cote de l'Entreprise et du Personnel, au
   lieu de se perdre dans le Personnel. Elle est « auto » : elle n'existe
   que si elle a quelque chose a montrer (une tache Google Tasks, ou une tache
   rangee sous 'gtasks'), pour que l'artisan sans Google Tasks ne voie jamais
   un cadre vide. On ne la supprime pas (builtin), on peut la renommer
   (store.secLabels, comme les deux autres). Seules les taches Google Tasks y
   entrent : une tache creee ici n'est pas dans Google Tasks, la mettre la
   ferait croire le contraire (secsPour). */
const SEC_GTASKS = {id:'gtasks', ic:'✅', c:'#1a73e8', builtin:1, auto:1,
   ar:'مهام Google Tasks', fr:'Tâches Google Tasks',
   sAr:'قوائمك في Google Tasks • بدون تاريخ • متأخرة • منجزة', sFr:'Vos listes Google Tasks • sans date • en retard • faites'};
let SEC_GT_ON = false;
/* Recalcule la presence de la section Google Tasks d'apres TASKS. Appelee au
   debut de chaque render() : si elle apparait ou disparait, les cadres sont
   reconstruits AVANT d'etre remplis. Rend vrai si la liste a change. */
function majSecGt(){
  const on = TASKS.some(it=>it.gtache || (store.cat[it.id]||it.cat)==='gtasks');
  if(on===SEC_GT_ON) return false;
  SEC_GT_ON = on;
  /* PAS applyI18n() entier : il refait aussi le formulaire « إضافة » (jours
     coches, cle Gemini) pendant que l'artisan le remplit peut-etre. Seuls
     les cadres et leurs libelles changent. */
  buildBoardsDOM(); majLibellesSections(); remplirSectionsAjout(); applyPanels();
  return true;
}
function majLibellesSections(){
  document.querySelectorAll('#boardsWrap [data-t]').forEach(e=>{ e.textContent = t(e.dataset.t); });
  document.querySelectorAll('[data-sec-name]').forEach(e=>{ e.textContent = secName(secById(e.dataset.secName)); });
  document.querySelectorAll('[data-sec-sub]').forEach(e=>{ e.textContent = secSub(secById(e.dataset.secSub)); });
}
/* store.secLabels{id:{ar,fr,ic,c}} surcharge le NOM (et l'icone/la couleur)
   d'une section EXISTANTE — d'origine ('ent'/'perso') ou ajoutee — sans
   jamais toucher a son identifiant : tout ce qui range une tache sous cet
   id (catOf, EN_DUR, le classement Drive du bureau…) continue de la
   retrouver exactement pareil. Renommer n'est donc jamais une migration. */
function allSections(){
  return SEC_BUILTIN.concat(SEC_GT_ON ? [SEC_GTASKS] : [], store.sections||[]).map(s=>{
    const r=(store.secLabels||{})[s.id];
    return r ? Object.assign({}, s, {ar:r.ar||s.ar, fr:r.fr||s.fr, ic:r.ic||s.ic, c:r.c||s.c, sAr:r.sAr||s.sAr, sFr:r.sFr||s.sFr}) : s;
  });
}
function secById(id){ const s=allSections().filter(x=>x.id===id)[0]; return s||SEC_BUILTIN[1]; }
/* Les sections ou une tache peut aller : toutes, sauf « مهام Google Tasks »
   pour ce qui n'est pas une tache Google Tasks. */
function secsPour(it){ return allSections().filter(s=>s.id!=='gtasks' || (it && it.gtache)); }
function secName(s){ return (state.lang==='ar'? s.ar : s.fr) || s.id; }
function secSub(s){ return (state.lang==='ar'? s.sAr : s.sFr) || ''; }
/* Les categories ajoutees sont fusionnees dans SUBS : tout le code existant
   qui lit SUBS[...] continue de fonctionner sans modification. Le meme
   store.subLabels{id:{ar,fr,ic,c}} que pour les sections surcharge ensuite
   le nom (d'une categorie d'origine ou ajoutee), toujours par-dessus l'id. */
function mergeSubs(){
  (store.subs||[]).forEach(s=>{ SUBS[s.id]={ic:s.ic||'🏷️', c:s.c||'#64748b', ar:s.ar, fr:s.fr, custom:1}; });
  Object.keys(store.subLabels||{}).forEach(id=>{
    if(!SUBS[id]) return;
    const r=store.subLabels[id];
    if(r.ar) SUBS[id].ar=r.ar; if(r.fr) SUBS[id].fr=r.fr;
    if(r.ic) SUBS[id].ic=r.ic; if(r.c) SUBS[id].c=r.c;
  });
}
function nextId(prefix, taken){
  let i=1; while(taken.indexOf(prefix+i)>=0) i++; return prefix+i;
}
/* L'icone et la couleur sont bornees A L'ENREGISTREMENT, pas seulement a
   l'affichage : ce qui part dans le localStorage est deja propre. L'icone est
   coupee a 4 caracteres reels (Array.from, pour ne pas casser un emoji en
   deux), la couleur n'est gardee que si c'est un #rrggbb, sinon repli. */
function okIc(v, fb){
  v = String(v==null?'':v).trim();
  return v ? Array.from(v).slice(0,4).join('') : fb;
}
function okColor(v, fb){
  v = String(v==null?'':v).trim();
  return /^#[0-9a-f]{6}$/i.test(v) ? v : fb;
}
function addSection(ar, fr, ic, c, sAr, sFr){
  ar=(ar||'').trim(); if(!ar) return;
  store.sections = store.sections||[];
  const id = nextId('sec', allSections().map(s=>s.id).concat(store.idsPris||[]));
  store.sections.push({id:id, ar:ar, fr:(fr||'').trim()||ar, ic:okIc(ic,'📁'), c:okColor(c,'#a855f7'),
                        sAr:(sAr||'').trim(), sFr:(sFr||'').trim()});
  state.boards[id]=0; state.group[id]='date';
  lsSet(); prefSet(); buildBoardsDOM(); applyI18n(); applyPanels(); render();
}
function addSub(ar, fr, ic, c){
  ar=(ar||'').trim(); if(!ar) return;
  store.subs = store.subs||[];
  const id = nextId('cat', Object.keys(SUBS).concat(store.idsPris||[]));
  store.subs.push({id:id, ar:ar, fr:(fr||'').trim()||ar, ic:okIc(ic,'🏷️'), c:okColor(c,'#64748b')});
  mergeSubs(); lsSet(); applyI18n(); render();
}
/* Renommer une section EXISTANTE (d'origine ou ajoutee), sans jamais changer
   son id : une section ajoutee est modifiee directement dans store.sections
   (c'est deja sa propre donnee) ; une section d'origine passe par la
   surcharge store.secLabels, puisque SEC_BUILTIN est du code, pas une
   donnee de l'artisan. */
function renSection(id, ar, fr, ic, c, sAr, sFr){
  ar=(ar||'').trim(); if(!ar) return;
  fr=(fr||'').trim()||ar;
  const custom=(store.sections||[]).find(s=>s.id===id);
  if(custom){
    custom.ar=ar; custom.fr=fr;
    if(ic) custom.ic=okIc(ic, custom.ic);
    if(c)  custom.c=okColor(c, custom.c);
    if(sAr!==undefined) custom.sAr=(sAr||'').trim();
    if(sFr!==undefined) custom.sFr=(sFr||'').trim();
  } else {
    store.secLabels = store.secLabels||{};
    const prev = store.secLabels[id]||{};
    store.secLabels[id] = {
      ar, fr, ic: ic?okIc(ic, prev.ic):prev.ic, c: c?okColor(c, prev.c):prev.c,
      sAr: sAr?(sAr||'').trim():prev.sAr, sFr: sFr?(sFr||'').trim():prev.sFr
    };
  }
  lsSet(); buildBoardsDOM(); applyI18n(); applyPanels(); render();
}
function renSub(id, ar, fr, ic, c){
  ar=(ar||'').trim(); if(!ar) return;
  fr=(fr||'').trim()||ar;
  const custom=(store.subs||[]).find(s=>s.id===id);
  if(custom){
    custom.ar=ar; custom.fr=fr;
    if(ic) custom.ic=okIc(ic, custom.ic);
    if(c)  custom.c=okColor(c, custom.c);
  } else {
    store.subLabels = store.subLabels||{};
    const prev = store.subLabels[id]||{};
    store.subLabels[id] = { ar, fr, ic: ic?okIc(ic, prev.ic):prev.ic, c: c?okColor(c, prev.c):prev.c };
  }
  mergeSubs(); lsSet(); applyI18n(); render();
}
/* Suppression : jamais d'orphelin. Les taches de la section supprimee sont
   deplacees vers la premiere section, celles d'une categorie supprimee vers
   « شخصي / Personnel ». */
function delSection(id){
  const s=secById(id); if(!s || s.builtin) return;
  /* Par moveCat (et non store.cat directement) : les briques enveloppent
     moveCat et mettent a jour leur ombre et le casier Google — sinon le geste
     suivant remettait la section supprimee. Une repetition Google : une
     seule ecriture sur son maitre (sectionSerie). */
  const series={};
  TASKS.forEach(it=>{
    if(catOf(it)!==id) return;
    if(it.src==='google' && !it.gtache && it.gRec && !it.gRO && window.AP && AP.gsync && AP.gsync.sectionSerie){
      store.cat[it.id]='ent'; series[it.sk]=series[it.sk]||it.id; return;
    }
    moveCat(it.id,'ent',true);
  });
  /* « ancien » = id : seules les occurrences (et le maitre) qui etaient
     dans cette section la quittent — jamais toute la serie. */
  ecrireSeriesApres(Object.keys(series).map(sk=>({sk:sk, id:series[sk], champ:'sc', v:'ent', ancien:id})));
  store.idsPris=(store.idsPris||[]).concat([id]);
  /* Aussi les choix des taches absentes en ce moment (une tache Google Tasks
     pas encore relue, par exemple) : sinon elles reviendraient vers une
     section qui n'existe plus, invisibles mais comptees partout. */
  Object.keys(store.cat||{}).forEach(k=>{ if(store.cat[k]===id) store.cat[k]='ent'; });
  Object.keys(store.catSk||{}).forEach(k=>{ if(store.catSk[k]===id) store.catSk[k]='ent'; });
  (store.custom||[]).forEach(c=>{ if(c.cat===id) c.cat='ent'; });
  store.sections=(store.sections||[]).filter(x=>x.id!==id);
  delete state.boards[id];
  const el=document.getElementById('pan_b_'+id); if(el) el.remove();
  lsSet(); prefSet(); buildBoardsDOM(); applyI18n(); applyPanels(); render();
}
/* Les ecritures de serie demandees par une suppression : apres la permission
   (demandee une fois), l'une apres l'autre, et un echec se DIT (au lieu d'une
   ligne dans la console) — l'ecran montre deja le changement, Google non. */
function ecrireSeriesApres(entrees){
  if(!entrees.length) return;
  /* Gardees dans store AVANT d'essayer : si elles ne partent pas maintenant
     (liaison, permission, reseau), elles repartiront apres la prochaine
     lecture Google — au lieu d'etre annulees en silence par le casier. */
  store.seriesAFaire=(store.seriesAFaire||[]).filter(x=>!entrees.some(y=>y.sk===x.sk && y.champ===x.champ)).concat(entrees);
  lsSet(); brancherRejeu();
  (async()=>{
    await null;   // apres le « تم الحفظ » de l'appelant : un echec reste visible
    if(!liaisonPrete()){ toast(t('serieAttente')); return; }
    if(!(await permisAgenda())){ toast(t('serieAttente')); return; }
    await rejouerSeries(true);
  })();
}
let REJEU_EN_COURS=false;
async function rejouerSeries(dire){
  const l=store.seriesAFaire||[];
  if(!l.length || REJEU_EN_COURS || !(window.AP&&AP.gsync&&AP.gsync.sectionSerie)) return;
  try{ const g0=AP.gauth&&AP.gauth.etat&&AP.gauth.etat(); if(g0 && (!g0.peutEcrire || g0.besoinReconnexion)) return; }catch(x){}
  REJEU_EN_COURS=true;
  try{
    for(const x of l.slice()){
      const it = TID(x.id) || TASKS.find(z=>z.sk===x.sk && z.gRec);
      if(!it) continue;                                  // pas chargee maintenant : plus tard
      try{
        await (x.champ==='sc' ? AP.gsync.sectionSerie(it.id, x.v, x.ancien) : AP.gsync.sousCatSerie(it.id, x.v, x.ancien));
        store.seriesAFaire=(store.seriesAFaire||[]).filter(y=>y!==x); lsSet();
      }catch(e){ if(dire) toast(t('serieAttente')); break; }
    }
  } finally { REJEU_EN_COURS=false; }
}
/* Apres chaque lecture Google reussie : ce qui attendait repart. */
function brancherRejeu(){
  if(window.__apRejeu || !(window.AP&&AP.gsync&&typeof AP.gsync.on==='function')) return;
  window.__apRejeu=1;
  AP.gsync.on('lecture', d=>{ if(d && d.fin && (store.seriesAFaire||[]).length) setTimeout(()=>rejouerSeries(false), 500); });
}
/* Un texte tape pour une tache Google Tasks qui n'existe plus (supprimee sur
   le telephone, liste supprimee) : il devient une tache du programme, dans
   le Personnel, visible — au lieu d'etre range la ou personne ne regarde. */
function garderTexteOrphelin(titre, texte){
  store.custom.push({ id:'m|'+Date.now()+'|'+Math.floor(Math.random()*1e6), title:t('orphelinTitre').replace('%1', titre||'—'),
    cat:'perso', sub:'perso', date:iso(today()), time:'', notes:String(texte||''), subs:[] });
  lsSet(); buildTasks();
  if(typeof renderFond==='function') renderFond(); else render();
  toast(t('orphelinToast'));
}
function delSub(id){
  if(!SUBS[id] || !SUBS[id].custom) return;
  (store.custom||[]).forEach(c=>{ if(c.sub===id) c.sub='perso'; });
  /* les choix faits sur les cartes (par tache, par serie) aussi — par setSub,
     que gsync enveloppe : sinon le casier Google remettrait la categorie
     supprimee au geste suivant. Une repetition Google : une ecriture sur son
     maitre. */
  const series={};
  Object.keys(store.subOf||{}).forEach(k=>{
    if(store.subOf[k]!==id) return;
    const it=TID(k);
    if(it && it.src==='google' && !it.gtache && it.gRec && !it.gRO && window.AP && AP.gsync && AP.gsync.sousCatSerie){
      delete store.subOf[k]; series[it.sk]=series[it.sk]||k; return;
    }
    setSub(k,'',true);
  });
  ecrireSeriesApres(Object.keys(series).map(sk=>({sk:sk, id:series[sk], champ:'sb', v:'', ancien:id})));
  store.idsPris=(store.idsPris||[]).concat([id]);
  Object.keys(store.subSk||{}).forEach(k=>{ if(store.subSk[k]===id) delete store.subSk[k]; });
  store.subs=(store.subs||[]).filter(x=>x.id!==id);
  delete SUBS[id];
  if(state.sub===id) state.sub='all';
  lsSet(); applyI18n(); render();
}

const LS_KEY = 'agendapro_v1';
let store = {status:{}, checks:{}, notes:{}, cat:{}, custom:[], contact:{}, place:{}, sections:[], subs:[],
  /* choix de l'artisan sur les taches EXISTANTES : categorie par tache et par
     serie, section par serie, nom garde dans le programme (par tache et par
     serie) — voir catOf/subOf/appliquerNoms */
  subOf:{}, catSk:{}, subSk:{}, titleOf:{}, titleSk:{}};
/* Les periodes proposees, dans l'ordre des puces. Calendrier pur : mois
   passe / en cours / prochain, semaines 1 a 4 du mois en cours, date precise. */
const WINS = ['mp','mc','mn','s1','s2','s3','s4','custom'];
let state = {lang:'ar', theme:'light', win:'mc', from:null, to:null, q:'', sub:'all', status:'all', routine:true, routineChoisi:false, open:{}, selDay:null,
  pan:{brief:0,kpi:0,filters:0,alerts:0,foot:0}, boards:{ent:0,perso:0}, group:{ent:'date',perso:'date'}, gopen:{},
  /* combien de cartes on montre par rubrique ; augmente par « voir la suite ».
     Jamais enregistre : a chaque ouverture on repart leger. */
  more:{}};

function lsGet(){ try{ const r=localStorage.getItem(LS_KEY); if(r) store=Object.assign(store,JSON.parse(r)); }catch(e){} }
/* Chaque geste reecrivait le magasin ENTIER — et, verrou pose, le
   rechiffrait entierement. On regroupe : une ecriture au plus tous les
   300 ms, et une ecriture immediate des que la page se cache ou se ferme. */
let lsT=null;
function lsFlush(){ clearTimeout(lsT); lsT=null; try{ localStorage.setItem(LS_KEY,JSON.stringify(store)); }catch(e){} }
function lsSet(){ if(lsT) return; lsT=setTimeout(lsFlush,300); }
window.addEventListener('pagehide', lsFlush);
window.addEventListener('beforeunload', lsFlush);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) lsFlush(); });
function prefGet(){
  try{
    const p=JSON.parse(localStorage.getItem(LS_KEY+'_pref2')||'{}');
    /* Champ par champ, et jamais une clef inconnue : un vieux reglage
       enregistre ne doit ni ecraser une valeur par defaut nouvelle, ni faire
       entrer dans l'etat des objets que le programme ne connait plus. */
    ['lang','theme','win','routine','routineChoisi'].forEach(k=>{ if(p[k]!==undefined) state[k]=p[k]; });
    /* Un reglage « routines cachees » herite de l'ancien defaut, que l'artisan
       n'a jamais choisi, ne doit pas survivre : on ne respecte le « cache »
       que s'il a lui-meme touche l'interrupteur. */
    if(!state.routineChoisi) state.routine = true;
    const dateOk = v => typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
    if(dateOk(p.from)) state.from=p.from;
    if(dateOk(p.to))   state.to=p.to;
    if(p.pan)    Object.keys(state.pan).forEach(k=>{ if(p.pan[k]!==undefined) state.pan[k]=p.pan[k]?1:0; });
    /* seules les sections qui existent encore : une section supprimee
       ailleurs ne doit pas laisser un cadre « ouvert » fantome qui empeche
       l'anneau d'accueil de revenir */
    /* 'gtasks' en plus : au demarrage les taches Google Tasks ne sont pas
       encore la (SEC_GT_ON faux), mais son cadre ouvert doit etre retrouve.
       Tant qu'il n'existe pas, syncRing ne le compte pas. */
    if(p.boards){ const ok=new Set(allSections().map(s=>s.id).concat(['gtasks'])); Object.keys(p.boards).forEach(k=>{ if(ok.has(k)) state.boards[k]=p.boards[k]?1:0; }); }
    if(p.group)  Object.keys(p.group).forEach(k=>{ if(p.group[k]==='cat'||p.group[k]==='date') state.group[k]=p.group[k]; });
    /* Les anciens noms (« 1 semaine », « 6 mois », « tout »…) n'existent
       plus : on les ramene au mois qui leur ressemble le plus. */
    const ANC = { p3:'mp', p1:'mp', w1:'mc', w2:'mc', w3:'mc', m1:'mc', m2:'mn', m6:'mc', a1:'mc', all:'mc' };
    if(ANC[state.win]) state.win = ANC[state.win];
    if(WINS.indexOf(state.win)<0) state.win='mc';
    /* « date precise » sans ses deux dates n'a pas de sens : on revient au mois */
    if(state.win==='custom' && !(state.from && state.to)) state.win='mc';
  }catch(e){}
}
function prefSet(){ try{ localStorage.setItem(LS_KEY+'_pref2',JSON.stringify({lang:state.lang,theme:state.theme,win:state.win,from:state.from,to:state.to,routine:state.routine,routineChoisi:state.routineChoisi,pan:state.pan,boards:state.boards,group:state.group})); }catch(e){} }

/* ============================================================================
   4. OUTILS DATE
   ============================================================================ */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
/* --- La memoire des dates -------------------------------------------------
   Quelques centaines de dates distinctes portent cinq mille rendez-vous : il
   serait absurde de refaire le meme calcul cinq mille fois par affichage.
   Rien ici ne change le resultat, seulement le nombre de fois qu'on le
   calcule. Voir la note « vitesse » plus bas. */
const _tsParDate = new Map();     /* 'AAAA-MM-JJ'  ->  minuit de ce jour, en ms */
const _ecartParDate = new Map();  /* 'AAAA-MM-JJ'  ->  nombre de jours d'ici la */
let _jourCourant = '';            /* la date d'aujourd'hui, pour savoir quand oublier */
let _tsAujourdhui = 0;

/* Rend minuit d'aujourd'hui, en millisecondes. Si le jour a tourne depuis le
   dernier appel — application laissee ouverte la nuit — on oublie tous les
   ecarts calcules la veille : « demain » doit devenir « aujourd'hui ». */
function _minuitAujourdhui(){
  const d = new Date(); d.setHours(0,0,0,0);
  const cle = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  if(cle !== _jourCourant){ _jourCourant = cle; _tsAujourdhui = d.getTime(); _ecartParDate.clear(); }
  return _tsAujourdhui;
}

/* Minuit du jour ecrit 'AAAA-MM-JJ', en millisecondes. Meme decoupage qu'avant. */
function _minuitDe(s){
  let t = _tsParDate.get(s);
  if(t === undefined){
    const p = String(s).split('-');
    t = new Date(Number(p[0]), Number(p[1])-1, Number(p[2])).getTime();
    _tsParDate.set(s, t);
  }
  return t;
}

/* Un objet NEUF a chaque appel, comme avant : ce que l'appelant en fait ne
   regarde que lui. Seul le calcul est mis en reserve, jamais l'objet. */
const parse = s => new Date(_minuitDe(s));
const today = () => new Date(_minuitAujourdhui());
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
/* Un mois = le meme jour du mois suivant (22 septembre -> 22 octobre), pas
   « 31 jours » qui donnait un mois et un jour. Si ce jour n'existe pas (31
   -> fevrier), on s'arrete au dernier jour du mois vise. */
const addMonths = (d,n) => {
  const x=new Date(d); const jour=x.getDate();
  x.setDate(1); x.setMonth(x.getMonth()+n);
  const dernier=new Date(x.getFullYear(), x.getMonth()+1, 0).getDate();
  x.setDate(Math.min(jour, dernier)); return x;
};
const diffDays = s => {
  let n = _ecartParDate.get(s);
  if(n === undefined){
    n = Math.round((_minuitDe(s) - _minuitAujourdhui())/86400000);
    _ecartParDate.set(s, n);
  }
  return n;
};
function fmtDate(s){ const d=parse(s); const L=T[state.lang]; return d.getDate()+' '+L.months[d.getMonth()]+' '+d.getFullYear(); }
function fmtDayName(s){ return T[state.lang].days[parse(s).getDay()]; }

/* ----------------------------------------------------------------------------
   L'IDENTIFIANT ET LE LIEN D'UN RENDEZ-VOUS CHEZ GOOGLE
   ----------------------------------------------------------------------------
   Google nomme chaque occurrence d'une série « cléDeSérie_horodatageUTC ».
   Alger vit à UTC+1 toute l'année, sans heure d'été : l'horodatage se
   recalcule donc exactement, et on ne stocke ces identifiants que dans le
   cas où le calcul ne tomberait pas juste — un rendez-vous déplacé, dont
   l'identifiant garde l'heure d'origine. D'où « gid || idOcc(...) ».

   Le lien, lui, est « eid=base64(identifiant + espace + agenda raccourci) ».
   Google raccourcit l'adresse de l'agenda à sa partie locale suivie de la
   première lettre du domaine. Rien d'inventé ici : les trois valeurs
   ci-dessous ont été relevées sur les liens que Google a réellement
   renvoyés, et vérifiées sur les 5018 rendez-vous.
   -------------------------------------------------------------------------- */
const p2n = n => (n<10?'0':'')+n;
function idOcc(k,d,t,ad){
  if(!k) return '';
  if(ad || !t) return k+'_'+String(d).replace(/-/g,'');
  const p = String(d).split('-').map(Number), q = String(t).split(':').map(Number);
  const u = new Date(Date.UTC(p[0],p[1]-1,p[2],q[0],q[1],0) - 60*60*1000);   /* Alger = UTC+1 */
  return k+'_'+u.getUTCFullYear()+p2n(u.getUTCMonth()+1)+p2n(u.getUTCDate())+
         'T'+p2n(u.getUTCHours())+p2n(u.getUTCMinutes())+p2n(u.getUTCSeconds())+'Z';
}
function lienGoogle(oid,cal){
  /* Les adresses d'agenda vivent dans les donnees, jamais dans le programme :
     la version publiee n'en a aucune, et ne fabrique donc aucun lien. Elle
     n'a de toute facon aucun rendez-vous a ouvrir. */
  const C = (typeof FAM!=='undefined' && FAM && FAM.cals) ? FAM.cals : null;
  const court = C ? (C[cal] || C.moi) : null;
  if(!court || !oid) return 'https://calendar.google.com/calendar/u/0/r';
  try{
    const b = btoa(unescape(encodeURIComponent(oid+' '+court))).replace(/=+$/,'');
    return (FAM.lb||'')+b+'&ctz=Africa/Algiers';
  }catch(e){ return 'https://calendar.google.com/calendar/u/0/r'; }
}

/* Les rappels, tels que Google les donne : [{method:'popup',minutes:10}].
   « 0 minute » veut dire « à l'heure dite », et c'est ce qu'il faut écrire. */
function fmtRappels(rap){
  if(!rap || !rap.length) return '';
  return rap.map(r=>{
    const m = Number(r && r.minutes);
    const voie = (r && r.method==='email') ? t('rapMail') : t('rapPopup');
    if(!isFinite(m)) return voie;
    /* un rappel a heure fixe le jour meme (journee entiere) arrive en minutes
       NEGATIVES : -540 = a 09:00 */
    if(m<0){ const hh=String(Math.floor(-m/60)).padStart(2,'0'), mm=String((-m)%60).padStart(2,'0'); return voie+' — '+t('rapJourA')+' '+hh+':'+mm; }
    if(m===0) return voie+' — '+t('rapPile');
    if(m%1440===0) return voie+' — '+t('rapAvant').replace('%1', duree(m/1440,'j'));
    if(m%60===0)   return voie+' — '+t('rapAvant').replace('%1', duree(m/60,'h'));
    return voie+' — '+t('rapAvant').replace('%1', duree(m,'min'));
  }).join(' • ');
}

/* Le nombre et son nom, ecrits comme on les dit. En arabe le nom change de
   forme selon le compte — un, deux, de trois a dix, puis onze et au-dela —
   et le chiffre disparait pour « une heure » et « deux heures ». */
function duree(n,u){
  const f = (T[state.lang].rapU||{})[u] || ['','',''];
  if(state.lang!=='ar') return n+' '+(n>1?f[1]:f[0]);
  if(n===1) return f[0];
  if(n===2) return f[1];
  if(n>=3 && n<=10) return n+' '+f[2];
  return n+' '+(f[3]||f[0]);   /* 11 et plus : singulier a l'accusatif (يوماً) */
}

function gcalLink(d){ const [y,m,dd]=d.split('-'); return 'https://calendar.google.com/calendar/u/0/r/day/'+y+'/'+Number(m)+'/'+Number(dd); }

/* --- catégorie effective (avec surcharge utilisateur) -------------------- */
/* Trois niveaux, du plus precis au plus general : le choix fait sur CETTE
   tache (store.cat), celui fait pour toute sa serie de repetitions
   (store.catSk, par it.sk), puis ce que dit la source. Des FONCTIONS et non
   des constantes : elles existent ainsi sur window, et les briques
   (gbridge : le classement partage) voient la meme section que l'ecran. */
function catOf(it){
  const c = store.cat[it.id] || (it.sk && store.catSk && store.catSk[it.sk]) || it.cat;
  /* FILET : une section qui n'existe plus (supprimee ici, ou remise par un
     autre appareil) ne doit jamais rendre une tache invisible — elle serait
     comptee partout sans apparaitre nulle part. Elle va dans la premiere
     section, comme delSection() le fait. */
  if(secOk(c)) return c;
  return secOk(it.cat) ? it.cat : 'ent';
}
/* L'ensemble des sections existantes, garde en memoire (catOf est appele des
   milliers de fois par dessin) et refait quand la liste change. */
let SEC_OK_SET=null, SEC_OK_REF=null, SEC_OK_LEN=-1, SEC_OK_GT=null;
function secOk(id){
  if(!id) return false;
  const ss=store.sections||null, n=ss?ss.length:0;
  if(!SEC_OK_SET || SEC_OK_REF!==ss || SEC_OK_LEN!==n || SEC_OK_GT!==SEC_GT_ON){
    SEC_OK_SET=new Set(allSections().map(s=>s.id)); SEC_OK_REF=ss; SEC_OK_LEN=n; SEC_OK_GT=SEC_GT_ON;
  }
  return SEC_OK_SET.has(id);
}
/* La categorie (SUBS) choisie sur la carte : meme logique, store.subOf puis
   store.subSk. */
function subOf(it){
  const v=(store.subOf && store.subOf[it.id]) || (it.sk && store.subSk && store.subSk[it.sk]) || it.sub;
  /* une categorie inconnue ici (supprimee, ou creee sur un autre appareil)
     ne doit pas faire afficher la premiere de la liste (ضرائب) */
  return SUBS[v] ? v : (SUBS[it.sub] ? it.sub : 'perso');
}
/* --- statut ------------------------------------------------------------- */
/* Le statut pose ici par l'artisan passe toujours en premier. Sinon, une
   tache que sa source dit achevee (Google Tasks : it.gFait) est achevee, et
   une tache SANS DATE n'est jamais « en retard » : sa date n'est qu'un repli
   technique (aujourd'hui), elle ne dit rien d'une echeance. */
function statusOf(it){
  const u = store.status[it.id];
  if(u) return u;
  if(it.gFait) return 'done';
  if(it.sansDate) return 'pending';
  const dd = diffDays(it.date);
  if(dd < 0) return it.routine ? 'passed' : 'overdue';
  return 'pending';
}
/* --- check-list --------------------------------------------------------- */
/* Une fois une case cochee, la liste etait figee dans la langue du moment :
   on passait en francais et les documents restaient en arabe. On retraduit
   par la position : le libelle n° i en arabe devient le libelle n° i en
   francais. Les lignes ajoutees a la main (absentes des deux tableaux)
   gardent leur texte. */
function traduireCL(it, arr){
  const base = CL[it.sk]; if(!base || !arr) return arr||[];
  const autre = state.lang==='ar' ? base.fr : base.ar, mienne = base[state.lang];
  if(!autre || !mienne) return arr;
  return arr.map(l=>{ const i = autre.indexOf(l); return (i>=0 && mienne[i]!==undefined) ? mienne[i] : l; });
}
function clOf(it){
  if(store.checks[it.id] && store.checks[it.id].list) return traduireCL(it, store.checks[it.id].list);
  const base = CL[it.sk];
  let list = base ? base[state.lang].slice() : [];
  if(it.manual){ const c = store.custom.find(x=>x.id===it.id); if(c && c.subs) list = c.subs.slice(); }
  return list;
}
const clDone = it => traduireCL(it, (store.checks[it.id] && store.checks[it.id].done) || []);
function setCheck(it,i,on){
  const list = clOf(it);
  const cur = store.checks[it.id] || {};
  const done = (cur.done||[]).slice();
  const k = list[i];
  const p = done.indexOf(k);
  if(on && p<0) done.push(k); if(!on && p>=0) done.splice(p,1);
  store.checks[it.id] = {list:list, done:done};
  lsSet(); render();
  if(window.AP&&AP.sync&&AP.sync.setChecklist) AP.sync.setChecklist(it.id, list, done);
}
function addCheck(it,txt){
  if(!txt.trim()) return;
  const list = clOf(it).slice(); list.push(txt.trim());
  const cur = store.checks[it.id]||{};
  store.checks[it.id] = {list:list, done:cur.done||[]};
  lsSet(); render(); toast(t('toastSaved'));
}
function delCheck(it,i){
  const list = clOf(it).slice(); const k=list[i]; list.splice(i,1);
  const cur = store.checks[it.id]||{};
  store.checks[it.id] = {list:list, done:(cur.done||[]).filter(x=>x!==k)};
  lsSet(); render();
}

/* ============================================================================
   6. FILTRES
   ============================================================================ */
function winRange(sansJour){
  const T0 = today();
  if(state.win==='custom' && state.from && state.to) return [parse(state.from), parse(state.to)];
  /* sansJour : la bande des jours veut TOUTE la periode, meme quand un jour
     est choisi — sinon elle se reduisait a ce seul jour et on ne pouvait plus
     en choisir un autre sans le deselectionner d'abord. */
  if(state.selDay && !sansJour) return [parse(state.selDay), parse(state.selDay)];
  /* Des periodes de CALENDRIER, aux bornes que tout le monde connait : le
     mois passe va du 1er au dernier jour du mois passe, le mois en cours du
     1er au dernier jour de ce mois-ci, le mois prochain de meme. Les
     semaines sont celles du mois en cours : 1-7, 8-14, 15-21, 22-fin. Les
     deux bornes sont dans la liste (visible() teste d>=A && d<=B). Rien ne
     part « d'aujourd'hui » : le mois prochain, c'est le mois prochain. */
  const y = T0.getFullYear(), m = T0.getMonth();
  const mois = k => [new Date(y, m+k, 1), new Date(y, m+k+1, 0)];
  if(state.win==='mp') return mois(-1);
  if(state.win==='mn') return mois(1);
  const S = { s1:1, s2:2, s3:3, s4:4 };
  if(S[state.win]){
    const k = S[state.win];
    return [new Date(y, m, (k-1)*7+1), k===4 ? new Date(y, m+1, 0) : new Date(y, m, k*7)];
  }
  return mois(0);
}
function visible(){
  const [A,B] = winRange();
  const T0v = today();
  const q = state.q.trim().toLowerCase();
  return TASKS.filter(it=>{
    const st = statusOf(it);
    const d = parse(it.date);
    /* Une tache sans date et pas encore faite n'a pas de periode : elle reste
       visible quelle que soit la fenetre, dans sa propre rubrique. Faite, elle
       retombe sur son jour d'achevement comme n'importe quelle tache close. */
    /* Une tache Google Tasks encore ouverte et en retard reste du travail a
       faire : elle se montre dans toute vue qui va jusqu'a aujourd'hui (sa
       rubrique « متأخر »), meme si son echeance est vieille de plusieurs mois
       — sauf un jour choisi, ou une periode precise choisie a la main (a
       moins de chercher justement les retards). */
    const gOuverte = it.gtache && st==='overdue' && !state.selDay && B>=T0v &&
      (state.win==='custom' ? state.status==='overdue' : A<=T0v);
    const inWin = (d>=A && d<=B) || (it.sansDate && st!=='done') || gOuverte;
    /* Quand on cherche, on cherche PARTOUT. Enfermer la recherche dans la
       fenetre de temps revenait a cacher a l'artisan des rendez-vous qu'il
       sait pourtant exister : sur deux ans de donnees, la plupart. */
    const enRecherche = q.length >= 2;   /* une lettre seule ne ramene pas deux ans de donnees */
    /* La fenetre est la fenetre : un retard de juillet n'a rien a faire dans
       « le mois prochain ». Les retards se retrouvent par leur mois, par une
       date precise, ou par le filtre « en retard ». */
    if(!enRecherche && !inWin) return false;
    if(!state.routine && it.routine && st!=='overdue') return false;
    if(state.sub!=='all' && subOf(it)!==state.sub) return false;
    if(state.status!=='all' && st!==state.status) return false;
    if(q){
      const hay = (it.title.ar+' '+it.title.fr+' '+it.raw+' '+it.desc+' '+(SUBS[subOf(it)]?SUBS[subOf(it)].ar+' '+SUBS[subOf(it)].fr:'')+' '+(it.org?(it.org.ar||'')+' '+(it.org.fr||''):'')+' '+(it.srch||'')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}

/* ============================================================================
   7. RENDU
   ============================================================================ */
function render(){
  majSecGt();
  appliquerNoms();
  brancherRejeu();
  const vis = visible();
  /* Aucune tache du tout : on montre l'ecran d'accueil vide plutot qu'un
     tableau de bord rempli de zeros. Cas normal de la version publiee, tant
     que l'artisan ne s'est pas connecte a son compte. */
  const nd = document.getElementById('noData');
  if(nd) nd.classList.toggle('show', TASKS.length === 0);
  renderKPI();
  renderBrief(vis);
  renderAlerts();
  renderStrip();
  allSections().forEach(s=>{ renderBoard(s.id, vis.filter(i=>catOf(i)===s.id)); });
  /* Mesurer sur la ligne suivante donnerait encore la mise en page d'AVANT :
     le navigateur n'a pas encore replie les textes ni pose les images.
     requestAnimationFrame attend qu'il l'ait fait. C'est la cause du vide
     blanc et de l'anneau qui chevauchait les cartes. */
  requestAnimationFrame(function(){ syncMains(); syncBarre(); });
}

/* Un redessin demande par l'ARRIERE-PLAN (une relecture Google, un autre
   onglet) attend que l'artisan ait quitte le champ ou il ecrit : le texte est
   d'abord enregistre (son « change »), puis la page se redessine. Sans cela,
   la carte etait reconstruite sous ses doigts et ce qu'il tapait disparaissait.
   Ses propres gestes (clics, filtres) continuent d'appeler render() direct. */
/* A la sortie du champ, on ne redessine pas tout de suite : si l'artisan
   passe a un AUTRE champ d'une carte (Tab, clic), renderFond attend encore ;
   et pendant un clic (bouton de la souris enfonce), on attend qu'il soit
   relache, sinon le bouton vise disparaissait sous son doigt. */
let AP_PTR_BAS=false;
['pointerdown','pointerup','pointercancel'].forEach(t=>document.addEventListener(t,e=>{ AP_PTR_BAS=(e.type==='pointerdown'); },true));
function renderFond(){
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest && a.closest('.card')){
    if(!a.__apRenduEnAttente){
      a.__apRenduEnAttente=true;
      a.addEventListener('blur', function(){
        a.__apRenduEnAttente=false;
        const suite=()=>setTimeout(renderFond,0);
        if(AP_PTR_BAS) document.addEventListener('pointerup', suite, {once:true, capture:true});
        else suite();
      }, {once:true});
    }
    return;
  }
  render();
}

/* --- KPI ---------------------------------------------------------------- */
function renderKPI(){
  const T0=today(), W=addDays(T0,7);
  const notDone = s => s!=='done' && s!=='passed';
  let k1=0,k2=0,k3=0,k4=0,k5=0,k6=0;
  const curM = iso(T0).slice(0,7);
  TASKS.forEach(it=>{
    const s = statusOf(it), c = catOf(it), d = parse(it.date);
    if(s==='overdue' && (it.gtache || d>=addDays(T0,-60))) k1++;
    if(c==='ent' && !it.routine && !it.sansDate && d>=T0 && d<=W && notDone(s)) k2++;
    if(c==='perso' && !it.routine && !it.sansDate && d>=T0 && d<=addDays(T0,31) && notDone(s)) k3++;
    if(s==='waiting') k4++;
    if(s==='done' && !(it.sansDate && !it.gFait && !it.gFaitIci) && it.date.slice(0,7)===curM) k5++;
    if(it.routine && it.date===iso(T0)) k6++;
  });
  const K=[['k1',k1,'k1'],['k2',k2,'k2'],['k3',k3,'k3'],['k4',k4,'k4'],['k5',k5,'k5'],['k6',k6,'k6']];
  /* Chaque indicateur ouvre le cadre qu'il compte et cale la periode sur
     celle de son calcul ; setWin() enregistre et redessine. */
  const j = d => "'" + iso(d) + "'";
  const acts = {k1:"state.status='overdue';setCustom("+j(addDays(T0,-60))+","+j(T0)+")",
                k2:"state.sub='all';state.status='all';state.boards.ent=1;applyPanels();setCustom("+j(T0)+","+j(W)+")",
                k3:"state.status='all';state.boards.perso=1;applyPanels();setCustom("+j(T0)+","+j(addDays(T0,31))+")",
                k4:"state.status='waiting';syncUI();render()",
                k5:"state.status='done';setCustom("+j(new Date(T0.getFullYear(),T0.getMonth(),1))+","+j(new Date(T0.getFullYear(),T0.getMonth()+1,0))+")",
                k6:"state.routine=true;setCustom("+j(T0)+","+j(T0)+")"};
  document.getElementById('kpis').innerHTML = K.map(([cls,v,key])=>
    '<button class="kpi '+cls+'" onclick="'+acts[key]+'"><span class="bar"></span><div class="v">'+v+'</div><div class="l">'+t('kpi.'+key)+'</div></button>'
  ).join('');
}

/* --- Briefing ----------------------------------------------------------- */
function arCnt(n,one,two,few,many,none){
  if(n===0) return none;

  if(n===2) return two;
  return '<b>'+n+'</b> '+(n<=10?few:many);
}
function renderBrief(vis){

  const L = state.lang==='ar';

  const by={}; act.forEach(i=>{ const u=subOf(i); by[u]=(by[u]||0)+1; });

  document.getElementById('loadLeg').innerHTML = tot

  const busy = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b))[0];
  let free=null;
  for(let i=0;i<30;i++){ const s=iso(addDays(today(),i)); if(!cnt[s]){ free=s; break; } }
  const late = TASKS.filter(i=>statusOf(i)==='overdue' && (i.gtache || parse(i.date)>=addDays(today(),-60))).length;

      '<span class="ttl">'+S.ic+' '+esc(it.title[state.lang])+'</span>'+

function pickSub(k){ state.sub = state.sub===k ? 'all' : k; syncUI(); render(); }
function pickStatus(s){ state.status = state.status===s ? 'all' : s; syncUI(); render(); }
function montrerFiltres(){ state.status='all'; state.sub='all'; state.selDay=null; syncUI(); render(); }

/* --- Alertes ------------------------------------------------------------ */
function renderAlerts(){
  const A=[], T0=today();
  TASKS.forEach(it=>{
    if(it.routine) return;
    /* Sans date = sans echeance : rien a annoncer « pour aujourd'hui ». Mais
       un drapeau pose A LA MAIN (urgent, en attente) ne depend d'aucune date :
       il merite son alerte, sans le « en retard de N jours » qui n'a pas de sens. */
    if(it.sansDate){
      const s0=statusOf(it), nm0=esc(it.title[state.lang]);
      if(s0==='overdue') A.push({p:0,k:'a-bad',ic:'🔴',h:state.lang==='ar'
        ? '<b>'+nm0+'</b> معلّمة كعاجلة (بدون تاريخ) — أنجزها أو حدّد لها موعداً.'
        : '<b>'+nm0+'</b> marquée urgente (sans date) — terminez-la ou fixez-lui une date.'});
      else if(s0==='waiting') A.push({p:3,k:'a-info',ic:'⏳',h:state.lang==='ar'
        ? '<b>'+nm0+'</b> تحت المتابعة — تحقق من الرد.'
        : '<b>'+nm0+'</b> en suivi — vérifiez la réponse.'});
      return;
    }
    const s=statusOf(it), d=parse(it.date), dd=diffDays(it.date);
    const nm = esc(it.title[state.lang]);
    const list = clOf(it), done = clDone(it);
    if(s==='overdue' && (it.gtache || d>=addDays(T0,-60))){
      A.push({p:0,k:'a-bad',ic:'🔴',h:state.lang==='ar'
        ? '<b>'+nm+'</b> متأخرة منذ '+duree(Math.abs(dd),'j')+' — سجّلها كمكتملة أو أعد برمجتها.'
        : '<b>'+nm+'</b> en retard de '+duree(Math.abs(dd),'j')+' — marquez-la terminée ou reprogrammez-la.'});
    } else if(dd>=0 && dd<=2 && s!=='done'){
      A.push({p:1,k:'a-warn',ic:'⏰',h:state.lang==='ar'
        ? '<b>'+nm+'</b> '+T.ar.inDays(dd)+' ('+fmtDate(it.date)+')'+(list.length? ' — الوثائق الجاهزة: '+done.length+'/'+list.length:'')
        : '<b>'+nm+'</b> '+T.fr.inDays(dd)+' ('+fmtDate(it.date)+')'+(list.length? ' — documents prêts : '+done.length+'/'+list.length:'')});
    } else if(catOf(it)==='ent' && dd>2 && dd<=7 && s!=='done' && list.length && done.length<list.length){
      A.push({p:2,k:'a-info',ic:'📂',h:state.lang==='ar'
        ? 'موعد <b>'+nm+'</b> بعد '+duree(dd,'j')+' — هل جهّزت الأوراق؟ ('+done.length+'/'+list.length+')'
        : '<b>'+nm+'</b> dans '+duree(dd,'j')+' — les pièces sont-elles prêtes ? ('+done.length+'/'+list.length+')'});
    } else if(s==='waiting'){
      A.push({p:3,k:'a-info',ic:'⏳',h:state.lang==='ar'
        ? '<b>'+nm+'</b> تحت المتابعة — تحقق من الرد.'
        : '<b>'+nm+'</b> en suivi — vérifiez la réponse.'});
    }
  });
  A.sort((a,b)=>a.p-b.p);
  const urgent = A.filter(a=>a.p<=1).length;
  const cntEl = document.getElementById('alertCnt');
  cntEl.textContent = urgent || A.length;
  cntEl.classList.toggle('zero', !A.length);
  document.getElementById('pan_alerts').classList.toggle('lit', A.length>0 && !!state.pan.alerts);
  const box = document.getElementById('alertList');
  box.innerHTML = A.length
    ? A.slice(0,7).map(a=>'<div class="alert '+a.k+'"><span class="ic">'+a.ic+'</span><div>'+a.h+'</div></div>').join('')
    : '<div class="alert a-ok"><span class="ic">✅</span><div>'+t('noAlerts')+'</div></div>';
}

/* --- Bande agenda 14 jours --------------------------------------------- */
/* La bande des jours suit EXACTEMENT la periode choisie — y compris vers le
   passe — au lieu d'une table figee qui partait toujours d'aujourd'hui.
   Plafond de 92 jours : au-dela, une bande n'est plus lisible. */
function stripDays(){
  const [A,B] = winRange(true);
  const n = Math.round((B - A)/86400000) + 1;
  return {from:A, n:Math.max(1,Math.min(n,92)), total:n};
}
function renderStrip(){
  const {from,n,total} = stripDays(); let out='';
  const T0s = iso(today()), L=T[state.lang];
  let curMo = -1;
  for(let i=0;i<n;i++){
    const d = addDays(from,i), s = iso(d);
    if(n>14 && d.getMonth()!==curMo){
      curMo = d.getMonth();
      out += '<div class="strip-mo">'+L.months[curMo]+' '+d.getFullYear()+'</div>';
    }
    const items = TASKS.filter(x=>x.date===s && !x.sansDate && (state.routine || !x.routine) && statusOf(x)!=='done');
    const ent = items.filter(x=>catOf(x)==='ent').length;
    const per = items.length - ent;
    const kls = !items.length ? 'none' : (per===0 ? 'ent' : ent===0 ? 'per' : 'mix');
    out += '<button class="day'+(s===T0s?' today':'')+(state.selDay===s?' sel':'')+(items.length?'':' empty-d')+'" onclick="pickDay(\''+s+'\')" title="'+items.length+'">'+
      '<div class="dw">'+L.daysS[d.getDay()]+'</div>'+
      '<div class="dn">'+d.getDate()+'</div>'+
      (n<=14 ? '<span class="dm">'+L.months[d.getMonth()].slice(0,4)+'</span>' : '')+
      '<span class="dq '+kls+'">'+(items.length||'·')+'</span></button>';
  }
  document.getElementById('strip').innerHTML = out;
  const lbl = t(state.win) + ' · ' + duree(n,'j') + (total>n ? (state.lang==='ar' ? ' (الأولى)' : ' (premiers)') : '');
  document.getElementById('stripRange').textContent = lbl;
  const o = document.getElementById('stripRangeOrb'); if(o) o.textContent = lbl;
}
function pickDay(s){ state.selDay = (state.selDay===s ? null : s); syncUI(); render(); }

/* --- Colonnes ----------------------------------------------------------- */
function bucketOf(it){
  const s = statusOf(it), dd = diffDays(it.date);
  if(s==='done'||s==='passed') return 'closed';
  if(it.sansDate) return 'nodate';
  if(dd<0) return 'overdue';
  if(dd===0) return 'today';
  if(dd===1) return 'tomorrow';
  if(dd<=7) return 'week';
  if(dd<=14) return 'next';
  return 'later';
}
const BK_ORDER = ['overdue','today','tomorrow','week','next','later','nodate','closed'];
let PRINTING = false;
/* Construit une carte de tableau par section. Appelee au demarrage et apres
   toute modification de la liste des sections. */
function buildBoardsDOM(){
  const wrap=document.getElementById('boardsWrap'); if(!wrap) return;
  wrap.innerHTML = allSections().map(s=>{
    /* « custom-sec » = porte sa propre couleur (--secC). La section Google
       Tasks, d'origine mais sans regle CSS dediee, la prend aussi. */
    const teinte = !s.builtin || s.auto;
    const cl = teinte ? ' custom-sec' : '';
    /* L'icone d'une section ajoutee par l'utilisateur est du TEXTE LIBRE relu
       depuis localStorage : le maxlength="4" du champ de saisie est une regle
       d'affichage, la page ne l'applique jamais a la relecture. Sans esc(),
       une section nommee avec <img src=x onerror=...> executerait son code au
       prochain chargement — et le jour ou les sections seront synchronisees
       dans l'organisation, ce serait le code d'un employe s'executant chez le
       proprietaire, avec sa session en prime (XSS stocke multi-utilisateurs). */
    const ic = esc(s.ic);
    /* La couleur, elle, part dans un ATTRIBUT style : l'echapper ne suffirait
       pas, une valeur echappee reste une valeur CSS arbitraire. On valide donc
       le FORMAT, et toute valeur douteuse retombe sur la couleur par defaut
       des sections ajoutees. */
    const sc = /^#[0-9a-fA-F]{3,8}$/.test(String(s.c == null ? '' : s.c)) ? s.c : '#a855f7';
    const st = teinte ? ' style="--secC:'+sc+'"' : '';
    return '<div class="board closed main-node'+cl+'" data-cat="'+s.id+'" id="pan_b_'+s.id+'"'+st+'>'+
      '<button class="board-orb" onclick="togBoard(\''+s.id+'\')">'+
        '<span class="bo-ic">'+ic+'</span>'+
        '<span class="bo-n" id="orb_'+s.id+'">0</span>'+
        '<span class="bo-l" data-sec-name="'+s.id+'"></span>'+
      '</button>'+
      '<div class="board-head">'+
        '<div class="bi">'+ic+'</div>'+
        '<div><h3 data-sec-name="'+s.id+'"></h3><div class="bs" data-sec-sub="'+s.id+'"></div></div>'+
        '<div class="cnt" id="cnt_'+s.id+'">0</div>'+
        '<div class="gsw">'+
          '<button class="gs on" id="gs_'+s.id+'_date" onclick="setGroup(\''+s.id+'\',\'date\')" data-t="byDate"></button>'+
          '<button class="gs" id="gs_'+s.id+'_cat" onclick="setGroup(\''+s.id+'\',\'cat\')" data-t="byCat"></button>'+
        '</div>'+
        '<button class="p-tog" onclick="openAdd(\''+s.id+'\')">＋</button>'+
        (s.builtin? '' : '<button class="p-tog" title="—" onclick="uiDelSection(\''+s.id+'\')">🗑</button>')+
        '<button class="p-tog" onclick="togBoard(\''+s.id+'\')">✕</button>'+
      '</div>'+
      '<div class="board-body" id="board_'+s.id+'"></div>'+
    '</div>';
  }).join('');
  allSections().forEach(s=>{ if(state.boards[s.id]===undefined) state.boards[s.id]=0; });
}
function renderBoard(cat, items){
  const el = document.getElementById('board_'+cat);
  const cn = document.getElementById('cnt_'+cat), on = document.getElementById('orb_'+cat);
  if(!el) return;
  if(cn) cn.textContent = items.length;
  if(on) on.textContent = items.length;
  if(!state.boards[cat] && !PRINTING){ el.innerHTML=''; return; }
  if(!items.length){
    /* Rien a montrer — mais y a-t-il des routines cachees pour ce cadre et
       cette periode ? Si oui, on le dit et on offre de les afficher. */
    let caches = 0;
    if(!state.routine){ state.routine = true; try{ caches = visible().filter(i=>catOf(i)===cat).length; } finally { state.routine = false; } }
    /* Meme regle pour les autres filtres (etat, categorie, jour choisi) : une
       liste vide doit dire ce qu'elle cache, et offrir de le montrer. */
    let filtres = 0;
    if(state.status!=='all' || state.sub!=='all' || state.selDay){
      const sv = [state.status, state.sub, state.selDay];
      state.status='all'; state.sub='all'; state.selDay=null;
      try{ filtres = visible().filter(i=>catOf(i)===cat).length; } finally { state.status=sv[0]; state.sub=sv[1]; state.selDay=sv[2]; }
    }
    el.innerHTML = '<div class="empty"><span class="e-ic">🗂️</span>'+t('empty')+'<br><small style="opacity:.7">'+t('emptyHint')+'</small>'+
      (caches ? '<br><button class="plus" style="margin-top:12px" onclick="toggleRoutine()">'+t('routinesCachees').replace('%1',caches)+'</button>' : '')+
      (filtres ? '<br><button class="plus" style="margin-top:12px" onclick="montrerFiltres()">'+t('cachesFiltres').replace('%1',filtres)+'</button>' : '')+'</div>';
    return;
  }
  if((state.group[cat]||'date')==='cat'){ el.innerHTML = groupByCat(cat, items); return; }
  const g = {}; items.forEach(i=>{ const b=bucketOf(i); (g[b]=g[b]||[]).push(i); });
  el.innerHTML = BK_ORDER.filter(b=>g[b]).map(b=>
    '<div class="bucket"><div class="bucket-t'+(b==='overdue'?' b-over':b==='today'?' b-today':'')+'">'+
    t('bk.'+b)+' <span style="font-family:var(--ff-fr)">('+g[b].length+')</span></div>'+
    tranche(g[b], cat+':'+b)+'</div>'
  ).join('');
}

/* Une rubrique n'affiche que ses premieres cartes. Le reste attend derriere
   « voir la suite » : c'est ce qui empeche la page de peser vingt megaoctets
   et de figer le telephone a chaque clic. */
const PAGE = 30;
function tranche(list, key){
  /* A l'impression on veut tout, une fois ; a l'ecran on pagine. */
  const n = PRINTING ? list.length : Math.min(list.length, PAGE * (1 + (state.more[key]||0)));
  let s = list.slice(0, n).map(card).join('');
  if(!PRINTING && n < list.length){
    s += '<button class="plus" onclick="plusDe(\''+key+'\')">'+
         t('plusDe').replace('%1', list.length - n)+'</button>';
  }
  return s;
}
function plusDe(key){ state.more[key] = (state.more[key]||0) + 1; render(); }
function groupByCat(cat, items){
  const g={}; items.forEach(i=>{ const u=subOf(i); (g[u]=g[u]||[]).push(i); });
  const keys = Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
  return keys.map(k=>{
    const S = SUBS[k]||SUBS.perso;
    const list = g[k].slice().sort((a,b)=>((a.sansDate?1:0)-(b.sansDate?1:0)) || a.date.localeCompare(b.date));
    const key = cat+':'+k;
    const isOpen = !!state.gopen[key];
    const late = list.filter(i=>statusOf(i)==='overdue').length;
    const next = list.find(i=>!i.sansDate && statusOf(i)!=='done' && diffDays(i.date)>=0);
    const sub = (next ? T[state.lang].inDays(diffDays(next.date))+' · '+esc(next.title[state.lang]) : '')
              + (late ? ' · ⚠️ '+late+' '+t('lateLbl') : '');
    return '<div class="cgroup'+(isOpen?' open':'')+'">'+
      '<button class="cg-h" onclick="togGroup(\''+key+'\')">'+
        '<span class="cg-ic" style="background:'+hex(S.c,.14)+'">'+esc(S.ic)+'</span>'+
        '<span class="cg-n">'+esc(S[state.lang])+'<div class="cg-sub">'+sub+'</div></span>'+
        '<span class="cg-c">'+list.length+'</span><span class="cg-ch">▼</span>'+
      '</button>'+
      '<div class="cg-b">'+(isOpen ? tranche(list, key) : '')+'</div></div>';
  }).join('');
}
function togGroup(key){ state.gopen[key]=!state.gopen[key]; render(); }
function setGroup(cat,mode){
  state.group[cat]=mode;
  ['date','cat'].forEach(m=>{
    const b=document.getElementById('gs_'+cat+'_'+m);
    if(b) b.classList.toggle('on', m===mode);
  });
  prefSet(); render();
}

/* --- Carte -------------------------------------------------------------- */
function card(it){
  const st = statusOf(it), dd = diffDays(it.date), d = parse(it.date);
  const S = SUBS[subOf(it)] || SUBS.perso;
  const list = clOf(it), done = clDone(it);
  const pct = list.length ? Math.round(done.length/list.length*100) : 0;
  const isOpen = !!state.open[it.id];
  /* Sans date : la date de l'objet n'est qu'un repli (aujourd'hui, ou le jour
     d'achevement). La carte ne doit jamais la presenter comme une echeance. */
  const nd = !!it.sansDate, ndOuvert = nd && (st!=='done' || (!it.gFait && !it.gFaitIci));
  const relCls = nd ? '' : dd<0?'neg':dd===0?'now':'';
  let h = '<article class="card s-'+st+(dd===0 && !nd?' is-today':'')+(isOpen?' open':'')+'" id="c_'+cssId(it.id)+'">';
  h += '<button class="card-head" onclick="tog(\''+it.id+'\')">';
  h += ndOuvert
    ? '<div class="dchip"><div class="d">—</div><div class="m">'+t('sansDateLbl')+'</div></div>'
    : '<div class="dchip"><div class="d">'+d.getDate()+'</div><div class="m">'+T[state.lang].months[d.getMonth()].slice(0,4)+'</div></div>';
  h += '<div class="c-main"><h4>'+S.ic+' '+esc(it.title[state.lang])+'</h4><div class="c-meta">';
  h += '<span class="tag" style="background:'+hex(S.c,.14)+';color:color-mix(in srgb,'+S.c+',var(--ink) 42%)">'+esc(S[state.lang])+'</span>';
  if(!it.gtache) h += '<span class="tag time">'+(it.allDay? t('allDay') : it.start+(it.end?'–'+it.end:''))+'</span>';

  /* Une carte fermee s'arrete ici : pas de champs, pas de zone de notes, pas

  /* --- LE TRI D'UNE TACHE EXISTANTE : section et categorie, choisies

     d'un coup). La case « toutes les repetitions » vient AVANT les listes :

  const k = cssId(it.id), nSerie = (it.sk && !it.gtache && !it.manual) ? serieDe(it).length : 1;

         Object.keys(SUBS).map(s=>'<option value="'+esc(s)+'"'+(s===cSub?' selected':'')+'>'+esc(SUBS[s].ic)+' '+esc(SUBS[s][state.lang]||SUBS[s].fr||s)+'</option>').join('')+
       '</select></label></div>'+
       '</div>';
  /* --- LE NOM --------------------------------------------------------------

     dans le programme. */
  const gWritable = it.src==='google' && !it.gtache && it.gev && !it.gRO && it.gOrg!==false && window.AP && AP.gsync && AP.gsync.modifierTache;
  if(it.peutEcrireSource){

           (it.gDue ? '<button class="act" onclick="setSrcDue(\''+it.id+'\',\'\')">✕ '+t('gtSansDateBtn')+'</button>' : '')+
         '</div></div>';
  } else if(it.gtache){
    h += '<div class="sec"><div class="note-line">✏️ '+t('gtAllumer')+'</div></div>';
  } else if(it.manual){
    h += '<div class="sec"><div class="sec-t">✏️ '+t('nomTitle')+'</div>'+

  } else if(!gWritable){
    const aNom = !!((store.titleOf||{})[it.id] || (it.sk && (store.titleSk||{})[it.sk]));

         '<input class="mini" style="width:100%" value="'+esc(it.title[state.lang])+'" onchange="setNomLocal(\''+it.id+'\',this.value)">'+

    const tout = dr.tout!==undefined ? !!dr.tout : !!it.allDay, ht=tout?' style="display:none"':'';
    const qi='\''+it.id+'\'';
    h += '<div class="sec gedit"><div class="sec-t">✏️ '+t('gEditTitle')+' <span class="orgv">('+t('gEditHint')+')</span></div>'+
         '<label class="rang wide"><span>'+t('nomTitle')+'</span><input class="mini" id="get_'+k+'" value="'+val('titre', it.raw||it.title[state.lang])+'" oninput="gDraft('+qi+',\'titre\',this.value)"></label>'+
         '<label class="chk chk-in"><input type="checkbox" id="gea_'+k+'"'+(tout?' checked':'')+' onchange="gDraft('+qi+',\'tout\',this.checked);geJour(\''+k+'\',this.checked)"><span>'+t('fAllDay')+'</span></label>'+
         '<div class="row2c">'+
           '<label class="rang"><span>'+t('fStart')+'</span><span class="pair"><input type="date" class="mini" id="ged_'+k+'" value="'+val('date', it.date)+'" onchange="gDraft('+qi+',\'date\',this.value);geDebut('+qi+',\''+k+'\',this.value)"><input type="time" class="mini tm" id="geh_'+k+'" value="'+val('heure', it.start||'')+'"'+ht+' oninput="gDraft('+qi+',\'heure\',this.value)"></span></label>'+

         '<div class="acts"><button class="act a-done" id="gesv_'+k+'"'+(GESV_EN_COURS[it.id]?' disabled':'')+' onclick="saveEditG('+qi+')">'+(GESV_EN_COURS[it.id]?t('enCours'):t('gEditSave'))+'</button>'+
         '<button class="act" onclick="togEditG('+qi+')">'+t('cancel')+'</button></div>'+
