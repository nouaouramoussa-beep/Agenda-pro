<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Pro — لوحة قيادة المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AGENDA PRO — habillage clair, simple et moderne
   ============================================================ */
:root{
  --bg:#f5f7fa; --bg2:#eef2f7; --surface:#ffffff; --surface2:#f8fafc;
  --line:#e3e9f0; --line2:#cfd8e4;
  --txt:#101a2b; --txt2:#54637c; --txt3:#5f6d82;
  --brand:#0ea5e9; --brand2:#0284c7; --brandSoft:#e6f5fe;
  --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --info:#06b6d4; --wait:#8b5cf6;
  --ink:#000; --shadow:0 1px 2px rgba(16,26,43,.04), 0 8px 24px -16px rgba(16,26,43,.18);
  --r:18px; --r2:14px;
  --ff-ar:'Cairo','Segoe UI',Tahoma,sans-serif;
  --ff-fr:'DM Sans','Segoe UI',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f1520; --bg2:#151d2b; --surface:#151d2b; --surface2:#1b2534;
  --line:#25303f; --line2:#33405221;
  --line2:#334052;
  --txt:#eef3fa; --txt2:#a3b0c2; --txt3:#76859a;
  --brandSoft:#0c2b3d; --ink:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ff-ar); background:var(--bg); color:var(--txt);
  min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.5;
}
html[lang="fr"] body{font-family:var(--ff-fr)}
a{color:var(--brand2);text-decoration:none}
a:hover{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

.wrap{max-width:1480px;margin:0 auto;padding:22px 24px 268px;position:relative;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.hero,.boards{display:contents}
.wrap > .pan,.wrap > .panel,.wrap > .foot{margin:0;transition:flex-basis .28s ease,background .2s,border-color .2s}
.pan,.panel.brief{flex:1 1 100%}
.panel.brief{flex:1 1 520px}
.panel.alerts{flex:1 1 360px}
.pan.collapsed,.panel.collapsed,.board.closed,.foot.collapsed{flex:0 0 auto!important}
.p-in{animation:grow .26s ease}
/* --- disposition en anneau (toutes les bulles fermées) --- */
/* --n = nombre de satellites. L'angle se calcule, il n'est plus figé à
   51,43deg (=360/7) : retirer ou ajouter une bulle réajuste l'anneau tout
   seul. --mainsH est mesuré en JS (syncMains) : c'est la hauteur réelle de
   la rangée « sections principales » posée au-dessus de l'anneau, et le
   centre de l'anneau est décalé d'autant au lieu d'être à 50%. */
.wrap.ring{--rr:clamp(196px,25vw,290px);--n:5;--mainsH:0px;
  display:block;position:relative;
  /* min-height et non height : si le contenu depasse la formule, la page
     s allonge au lieu de le rogner. C etait la source du grand vide blanc
     ET des bulles coupees. */
  min-height:calc(var(--mainsH) + var(--rr)*2 + 200px);
  padding-bottom:0}
.wrap.ring .ring-node{position:absolute;
  top:calc(var(--mainsH) + var(--rr) + 100px);left:50%;
  transform:translate(-50%,-50%) rotate(calc(var(--i) * (360deg / var(--n)))) translateY(calc(-1 * var(--rr))) rotate(calc(var(--i) * (-360deg / var(--n))));
  transition:transform .35s cubic-bezier(.4,.1,.2,1)}
.wrap.ring #pan_brief{position:absolute;top:calc(var(--mainsH) + var(--rr) + 100px);left:50%;transform:translate(-50%,-50%);z-index:2}
.wrap.ring::before{content:"";position:absolute;top:calc(var(--mainsH) + var(--rr) + 100px);left:50%;
  width:calc(var(--rr)*2);height:calc(var(--rr)*2);margin:calc(-1 * var(--rr)) 0 0 calc(-1 * var(--rr));
  border-radius:50%;border:1px dashed var(--line);opacity:.75;pointer-events:none}

/* --- SECTIONS PRINCIPALES : Entreprise et Personnel, en haut de page --- */
/* top:26px et non 0 : en position:absolute le calage se fait sur la boite de
   remplissage, donc top:0 collait les cartes SOUS la barre du haut, sans le
   moindre espace — elles semblaient fusionner avec elle. */
.wrap.ring .boards{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;
  position:absolute;top:26px;left:0;right:0;padding:0 24px}
.wrap.ring .board.closed.main-node{flex:1 1 300px;max-width:360px}
/* Forme organique « goutte » plutôt qu'un rectangle : quatre rayons
   différents par axe, animés lentement pour un effet ondulant. */
.wrap.ring .board.closed .board-orb{
  width:100%;height:auto;min-height:118px;
  border-radius:42% 58% 54% 46% / 56% 44% 56% 44%;
  flex-direction:row;justify-content:flex-start;gap:16px;padding:22px 34px;
  box-shadow:0 18px 38px -24px rgba(16,26,43,.5);
  animation:blobWave 16s ease-in-out infinite}
.wrap.ring .board[data-cat="perso"] .board-orb{animation-delay:-5.5s}
@keyframes blobWave{
  0%,100%{border-radius:42% 58% 54% 46% / 56% 44% 56% 44%}
  33%{border-radius:58% 42% 44% 56% / 44% 58% 42% 56%}
  66%{border-radius:48% 52% 60% 40% / 52% 40% 60% 48%}
}
@media(prefers-reduced-motion:reduce){
  .wrap.ring .board.closed .board-orb{animation:none}
}
.wrap.ring .board.closed .board-orb .bo-ic{font-size:38px;flex:0 0 auto}
.wrap.ring .board.closed .board-orb .bo-n{font-size:34px;flex:0 0 auto;min-width:46px;text-align:center}
.wrap.ring .board.closed .board-orb .bo-l{font-size:14px;max-width:none;text-align:start;flex:1;line-height:1.35}
.wrap.ring .board.closed .board-orb::after{content:"›";font-size:26px;color:var(--txt3);line-height:1}
html[dir="rtl"] .wrap.ring .board.closed .board-orb::after{content:"‹"}
.wrap.ring .board.closed .board-orb:hover{transform:translateY(-3px);border-color:var(--brand)}
/* Hauteur figee = texte tranche net par le bord rond des que la salutation,
   la meteo et le conseil du jour depassent. Elle suit desormais son contenu,
   et retrecit avec l ecran. */
.pan-orb.ctr{width:min(284px,78vw);height:auto;min-height:min(284px,78vw);aspect-ratio:1;
             gap:4px;padding:30px 34px;background:radial-gradient(circle at 50% 22%,var(--brandSoft),var(--surface) 62%)}
.pan-orb.ctr .po-ic{font-size:26px}
.pan-orb.ctr .po-g{font-size:13.5px;font-weight:700;color:var(--txt);line-height:1.3}
.pan-orb.ctr .po-w{font-size:11.8px;font-weight:700;color:var(--txt2);font-family:var(--ff-fr);white-space:nowrap}
.pan-orb.ctr .po-k{font-size:9.5px;font-weight:700;letter-spacing:.6px;color:#075985;margin-top:4px;white-space:nowrap}
:root[data-theme="dark"] .pan-orb.ctr .po-k{color:#7dd3fc}
.pan-orb.ctr .po-q{font-size:11px;line-height:1.55;color:var(--txt2);max-width:184px;text-align:center;flex:0 0 auto;min-height:fit-content;display:block;overflow:visible;text-wrap:pretty}
.wxrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ins.q{white-space:normal;max-width:520px;line-height:1.65}
/* L'anneau N'EST PLUS désactivé sur petit écran : voir « ANNEAU MINIATURE »
   plus bas dans cette feuille (l'anneau est réduit, pas supprimé). */
@keyframes grow{from{opacity:0;transform:translateY(-7px)}}

/* ---------- TOPBAR ---------- */
/* Quand le programme fait defiler vers une carte, le navigateur amene son
   haut a zero — c est-a-dire DERRIERE la barre collante. D ou « la moitie
   disparait ». --tbH porte la hauteur reelle de la barre, mesuree en JS. */
html{scroll-padding-top:calc(var(--tbH,150px) + 16px)}
.topbar{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1480px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto}
.logo{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;
  background:var(--brandSoft);border:1px solid color-mix(in srgb,var(--brand) 28%,transparent);
}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--txt3);font-weight:500}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Sur un telephone, ces treize boutons se repliaient sur sept lignes : la
   barre du haut occupait 335 px, soit 41 % de l ecran, EN PERMANENCE puisque
   elle est collante. On les met sur une seule rangee que l on fait glisser du
   doigt : la barre retombe a 127 px et rend 208 px au contenu. */
@media(max-width:700px){
  .tools{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
         scroll-snap-type:x proximity;padding-bottom:2px;
         -webkit-mask-image:linear-gradient(to left,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
  .tools::-webkit-scrollbar{display:none}
  .tools>*{flex:0 0 auto;scroll-snap-align:start}
}
.tbtn{
  height:38px;padding:0 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--txt2);font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.tbtn:hover{color:var(--txt);border-color:var(--line2);background:var(--surface2)}
.langsw{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;height:38px}
.langsw button{padding:0 13px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--txt3);transition:.15s}
.langsw button.on{background:var(--surface);color:var(--brand2);box-shadow:0 1px 2px rgba(16,26,43,.08)}
.datepill{
  height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--txt2);
}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- HERO ---------- */
.hero{display:contents}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.brief{padding:24px 26px;position:relative;overflow:hidden}
.brief h2{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.3px}
.brief .sub{margin:0 0 18px;color:var(--txt2);font-size:13.5px;line-height:1.75}
.brief .sub b{color:var(--txt);font-weight:700}
.nextup{display:flex;flex-direction:column;gap:8px}
.nextup-item{
  display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:12px;
  background:var(--surface2);border:1px solid var(--line);
  font-size:13px;transition:.15s;cursor:pointer;text-align:start;
}
.nextup-item:hover{background:var(--brandSoft);border-color:color-mix(in srgb,var(--brand) 35%,transparent)}
.nextup-item .when{font-size:11px;font-weight:700;color:var(--txt3);min-width:78px;font-family:var(--ff-fr)}
.nextup-item .ttl{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alerts{padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.alerts h3{margin:0 0 4px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.alert{
  display:flex;gap:11px;padding:12px 14px;border-radius:12px;font-size:12.8px;line-height:1.6;
  border:1px solid var(--line);background:var(--surface2);
}
.alert .ic{font-size:16px;flex-shrink:0}
.alert b{font-weight:700}
.alert.a-bad{border-color:color-mix(in srgb,var(--bad) 30%,transparent);background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.alert.a-warn{border-color:color-mix(in srgb,var(--warn) 32%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.alert.a-info{border-color:color-mix(in srgb,var(--info) 30%,transparent);background:color-mix(in srgb,var(--info) 7%,var(--surface))}
.alert.a-ok{border-color:color-mix(in srgb,var(--ok) 30%,transparent);background:color-mix(in srgb,var(--ok) 7%,var(--surface))}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.kpi{
  padding:18px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface);
  position:relative;overflow:hidden;transition:.15s;cursor:pointer;text-align:start;
}
.kpi:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.kpi .v{font-size:32px;font-weight:700;line-height:1;font-family:var(--ff-fr);letter-spacing:-1px}
.kpi .l{margin-top:8px;font-size:11.8px;color:var(--txt2);font-weight:600;line-height:1.45}
.kpi .bar{position:absolute;inset-block-start:0;inset-inline-start:0;width:100%;height:3px;opacity:.9}
.k1 .bar{background:var(--bad)} .k1 .v{color:var(--bad)}
.k2 .bar{background:var(--warn)} .k2 .v{color:#b45309}
.k3 .bar{background:var(--brand)} .k3 .v{color:var(--brand2)}
.k4 .bar{background:var(--wait)} .k4 .v{color:var(--wait)}
.k5 .bar{background:var(--ok)} .k5 .v{color:#047857}
.k6 .bar{background:var(--info)} .k6 .v{color:#0e7490}
:root[data-theme="dark"] .k2 .v{color:var(--warn)}
:root[data-theme="dark"] .k5 .v{color:var(--ok)}
:root[data-theme="dark"] .k6 .v{color:var(--info)}
:root[data-theme="dark"] .k3 .v{color:var(--brand)}

/* ---------- TOOLBAR ---------- */
.toolbar{
  position:sticky;top:68px;z-index:50;padding:12px 14px;border-radius:var(--r2);margin-bottom:18px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.chips{display:flex;gap:4px;background:var(--bg2);padding:4px;border-radius:12px}
.chip{padding:7px 13px;border-radius:9px;font-size:12.2px;font-weight:600;color:var(--txt2);transition:.15s;white-space:nowrap}
.chip:hover{color:var(--txt)}
.chip.on{background:var(--surface);color:var(--brand2);box-shadow:0 1px 2px rgba(16,26,43,.1)}
.search{position:relative;flex:1;min-width:210px}
.search input{
  width:100%;height:40px;padding-inline:38px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface2);font-size:13px;transition:.15s;
}
.search input:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
.search .si{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:14px;pointer-events:none}
select.fsel,input.fdate{
  height:40px;padding:0 11px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);
  font-size:12.5px;font-weight:600;color:var(--txt2);
}
select.fsel:focus,input.fdate:focus{outline:none;border-color:var(--brand)}
.switch{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:12.3px;font-weight:600;color:var(--txt2);cursor:pointer}
.switch .track{width:34px;height:19px;border-radius:20px;background:var(--line2);position:relative;transition:.2s}
.switch .track::after{content:"";position:absolute;top:2.5px;inset-inline-start:2.5px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on .track{background:var(--ok)}
.switch.on .track::after{inset-inline-start:17.5px}
.range-box{display:none;gap:7px;align-items:center}
.range-box.show{display:flex}
.btn-add{
  height:40px;padding:0 17px;border-radius:12px;font-size:12.6px;font-weight:700;color:#fff;
  background:var(--brand2);transition:.15s;
}
.btn-add:hover{background:var(--brand)}

/* ---------- AGENDA STRIP ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-bottom:18px}
.day{
  padding:8px 4px 7px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  text-align:center;transition:.15s;min-width:0;position:relative;
}
.day.empty-d{background:var(--bg2);border-color:transparent;opacity:.75}
.day:hover{border-color:var(--line2);opacity:1}
.day.today{border-color:color-mix(in srgb,var(--brand) 45%,transparent);background:var(--brandSoft);opacity:1}
.day.sel{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent);opacity:1}
.day .dw{font-size:9.5px;font-weight:700;color:var(--txt3)}
.day .dn{font-size:17px;font-weight:700;font-family:var(--ff-fr);line-height:1.25}
.day .dm{font-size:9px;color:var(--txt3);font-weight:600;display:block}
.day .dq{display:inline-flex;align-items:center;justify-content:center;gap:3px;margin-top:5px;min-height:16px;
  font-family:var(--ff-fr);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:7px;line-height:1.5}
.day .dq.ent{background:var(--brandSoft);color:var(--brand2)}
.day .dq.per{background:color-mix(in srgb,var(--ok) 13%,var(--surface));color:#047857}
.day .dq.mix{background:var(--bg2);color:var(--txt2)}
.day .dq.none{background:transparent;color:transparent}
:root[data-theme="dark"] .day .dq.per{color:var(--ok)}
:root[data-theme="dark"] .day .dq.ent{color:#7dd3fc}
.strip-mo{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--txt3);letter-spacing:.4px;padding:8px 2px 0;display:flex;align-items:center;gap:8px}
.strip-mo::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- BOARDS ---------- */
.boards{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
/* overflow:clip rogne les coins arrondis SANS faire du cadre un conteneur de
   defilement — ce que faisait overflow:hidden, et qui empechait son en-tete
   de rester colle pendant qu on parcourt la liste. */
.board{border-radius:var(--r);border:1px solid var(--line);background:var(--surface);overflow:clip;box-shadow:var(--shadow)}
.board-head{
  padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
  background:var(--surface);position:sticky;top:0;z-index:5;
}
.board-head .bi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.board[data-cat="ent"] .bi{background:var(--brandSoft)}
.board[data-cat="perso"] .bi{background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.board-head h3{margin:0;font-size:15.5px;font-weight:700}
.board-head .bs{font-size:11.5px;color:var(--txt3);margin-top:2px}
.board-head .cnt{
  margin-inline-start:auto;padding:5px 12px;border-radius:9px;background:var(--bg2);
  font-size:12.5px;font-weight:700;font-family:var(--ff-fr);color:var(--txt2);
}
/* Plus de plafond : la liste s allonge et c est la page qui defile. Avant,
   au-dela de 1100 px le reste etait injoignable sur ordinateur. */
.board-body{padding:14px;display:flex;flex-direction:column;gap:9px}
.bucket{margin-top:8px}
.bucket:first-child{margin-top:0}
.bucket-t{
  display:flex;align-items:center;gap:9px;padding:3px 4px 10px;font-size:11.5px;font-weight:700;
  color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;
}
.bucket-t::after{content:"";flex:1;height:1px;background:var(--line)}
.bucket-t.b-over{color:var(--bad)}
.bucket-t.b-today{color:#b45309}

/* ---------- CARD ---------- */
.card{
  border-radius:var(--r2);border:1px solid var(--line);background:var(--surface);overflow:hidden;
  transition:.15s;border-inline-start:3px solid var(--line2);
}
.card:hover{border-color:var(--line2);box-shadow:0 1px 2px rgba(16,26,43,.05),0 10px 22px -18px rgba(16,26,43,.5)}
.card.s-overdue{border-inline-start-color:var(--bad)}
.card.s-pending{border-inline-start-color:var(--brand)}
.card.s-done{border-inline-start-color:var(--ok);opacity:.6}
.card.s-waiting{border-inline-start-color:var(--wait)}
.card.s-postponed{border-inline-start-color:var(--warn)}
.card.s-passed{border-inline-start-color:var(--txt3);opacity:.5}
.card.is-today{background:color-mix(in srgb,var(--warn) 5%,var(--surface))}
.card-head{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:start}
.dchip{
  min-width:50px;padding:6px 4px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);
  text-align:center;flex-shrink:0;
}
.dchip .d{font-size:16px;font-weight:700;font-family:var(--ff-fr);line-height:1.1}
.dchip .m{font-size:9.5px;color:var(--txt3);font-weight:600;text-transform:uppercase}
.c-main{flex:1;min-width:0}
.c-main h4{margin:0;font-size:13.8px;font-weight:600;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{padding:3px 9px;border-radius:8px;font-size:10.3px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.tag.time{background:var(--surface2);border-color:var(--line);color:var(--txt3);font-family:var(--ff-fr)}
.tag.rel{background:var(--brandSoft);color:var(--brand2)}
.tag.rel.neg{background:color-mix(in srgb,var(--bad) 10%,var(--surface));color:#b91c1c}
:root[data-theme="dark"] .tag.rel.neg{color:#fca5a5}
.tag.rel.now{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:#b45309}
.pill{padding:5px 11px;border-radius:9px;font-size:10.8px;font-weight:700;white-space:nowrap;flex-shrink:0}
.p-pending{background:var(--brandSoft);color:var(--brand2)}
.p-overdue{background:color-mix(in srgb,var(--bad) 11%,var(--surface));color:var(--bad)}
.p-done{background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:#047857}
.p-waiting{background:color-mix(in srgb,var(--wait) 12%,var(--surface));color:var(--wait)}
.p-postponed{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:#b45309}
.p-passed{background:var(--bg2);color:var(--txt3)}
:root[data-theme="dark"] .p-done{color:var(--ok)}
:root[data-theme="dark"] .p-postponed,:root[data-theme="dark"] .tag.rel.now,:root[data-theme="dark"] .bucket-t.b-today{color:var(--warn)}
:root[data-theme="dark"] .tag.rel,:root[data-theme="dark"] .p-pending,:root[data-theme="dark"] .chip.on,:root[data-theme="dark"] .langsw button.on{color:#7dd3fc}
.chev{color:var(--txt3);font-size:11px;transition:.2s;flex-shrink:0}
.card.open .chev{transform:rotate(180deg)}
.card-body{display:none;padding:2px 15px 15px;border-top:1px solid var(--line);margin-top:2px}
.card.open .card-body{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}}
.sec{margin-top:14px}
.sec-t{font-size:11.2px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.checklist{display:flex;flex-direction:column;gap:5px}
.chk{display:flex;align-items:flex-start;gap:9px;padding:8px 11px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;transition:.15s;cursor:pointer}
.chk:hover{border-color:var(--line2)}
.chk input{width:16px;height:16px;accent-color:var(--ok);margin-top:1px;flex-shrink:0;cursor:pointer}
.chk.done span{text-decoration:line-through;color:var(--txt3)}
.chk .del{margin-inline-start:auto;color:var(--txt3);font-size:14px;opacity:0;transition:.15s;padding:0 3px}
.chk:hover .del{opacity:.7}
.chk .del:hover{color:var(--bad);opacity:1}
.progress{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-bottom:10px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .3s}
.addsub{display:flex;gap:6px;margin-top:7px}
.addsub input{flex:1;height:34px;padding:0 12px;border-radius:10px;border:1px dashed var(--line2);background:transparent;font-size:12.3px}
.addsub input:focus{outline:none;border-color:var(--brand);border-style:solid}
.addsub button{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--txt2);font-size:16px}
.addsub button:hover{border-color:var(--ok);color:var(--ok)}
.row2c{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mini{height:34px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:12.2px;width:100%}
.mini:focus{outline:none;border-color:var(--brand)}
.orgv{text-transform:none;color:var(--txt2);font-weight:600}
/* Le temoin du jour choisi : assez visible pour qu'on comprenne pourquoi la
   liste a fondu, assez discret pour ne pas encombrer. */
.chip.seljour{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.chip.seljour:hover{filter:brightness(1.08)}
.chip.seljour[hidden]{display:none}
.ginfo{display:flex;flex-direction:column;gap:6px}
.grow{display:flex;align-items:flex-start;gap:9px;padding:7px 11px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px}
.gic{flex-shrink:0;font-size:13px;line-height:1.35}
.glbl{flex-shrink:0;color:var(--txt3);font-weight:700;font-size:11.2px;text-transform:uppercase;letter-spacing:.4px;line-height:1.5;min-width:74px}
.gval{color:var(--txt2);font-weight:600;word-break:break-word;line-height:1.45}
@media(max-width:560px){.grow{flex-wrap:wrap}.glbl{min-width:0}.gval{flex-basis:100%}}
.desc{
  font-size:12.4px;line-height:1.85;color:var(--txt2);background:var(--surface2);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;white-space:pre-wrap;
}
/* Repliee, on coupe a quatre lignes — proprement, sur une ligne entiere —
   au lieu de trancher a 74 px au milieu d un mot. Le bouton « tout afficher »
   deplie, et la description s allonge alors sans ascenseur a elle. */
.desc.collapsed{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
                -webkit-mask-image:linear-gradient(180deg,#000 45%,transparent)}
.more{font-size:11.3px;font-weight:700;color:var(--brand2);margin-top:7px}
.notes{
  width:100%;min-height:66px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);
  padding:10px 12px;font-size:12.4px;line-height:1.7;resize:vertical;
}
.notes:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.act{padding:8px 13px;border-radius:10px;font-size:11.6px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--txt2);transition:.15s}
.act:hover{color:var(--txt);border-color:var(--line2)}
.act.a-done:hover{border-color:var(--ok);color:#047857}
.act.a-wait:hover{border-color:var(--wait);color:var(--wait)}
.act.a-post:hover{border-color:var(--warn);color:#b45309}
.act.a-urg:hover{border-color:var(--bad);color:var(--bad)}
.act.on{background:var(--brandSoft);border-color:color-mix(in srgb,var(--brand) 40%,transparent);color:var(--brand2)}
.act.link{margin-inline-start:auto;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.empty{padding:42px 20px;text-align:center;color:var(--txt3);font-size:13px}
.empty .e-ic{font-size:34px;display:block;margin-bottom:10px;opacity:.5}
/* Ecran d'accueil vide : affiche uniquement quand il n'y a AUCUNE tache
   (version publiee sans donnees, ou premier demarrage). */
.nodata{display:none;max-width:1480px;margin:18px auto 0;padding:18px 20px;
  border-radius:14px;border:1px dashed var(--line);background:var(--surface);
  text-align:center}
@media(max-width:1520px){ .nodata{margin:18px 24px 0} }
.nodata.show{display:block}
.nodata .nd-ic{font-size:30px;display:block;margin-bottom:8px;opacity:.6}
.nodata .nd-t{font-size:15px;font-weight:700;color:var(--txt)}
.nodata .nd-h{font-size:12.5px;color:var(--txt3);margin-top:6px;line-height:1.7}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(16,26,43,.45);backdrop-filter:blur(4px)}
.modal.show{display:flex}
.modal-in{width:100%;max-width:520px;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:0 30px 60px -30px rgba(16,26,43,.5);max-height:88vh;overflow:auto}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-size:16px;font-weight:700;flex:1}
.modal-b{padding:22px;display:flex;flex-direction:column;gap:14px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--txt3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select,.fld textarea{width:100%;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:13px}
.fld textarea{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.mb{padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--txt2)}
.mb:hover{border-color:var(--line2)}
.mb.pri{background:var(--brand2);color:#fff;border-color:transparent}
.mb.pri:hover{background:var(--brand)}
.help{font-size:12.6px;line-height:1.85;color:var(--txt2)}
.help code{background:var(--bg2);padding:2px 7px;border-radius:6px;font-size:11.8px;border:1px solid var(--line);font-family:var(--ff-fr)}
.help b{color:var(--txt)}

/* ---------- FOOTER ---------- */
.foot{padding:16px 20px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface);
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.8px;color:var(--txt2)}
.foot b{color:var(--txt2)}
.src{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;background:var(--surface2);border:1px solid var(--line)}
.foot{position:relative;flex-direction:column;align-items:stretch;gap:0}
.foot.collapsed{background:transparent;border:none;box-shadow:none;padding:0}
.foot.collapsed .foot-in{display:none}
.foot:not(.collapsed) .pan-orb{display:none}
.foot-in{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.foot-h{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--txt2)}
.foot-h .p-tog{margin-inline-start:auto}
.foot.collapsed .foot-h{display:none}
.foot:not(.collapsed){gap:14px;padding:16px 18px}
.foot-in{row-gap:10px}

.toast{
  position:fixed;inset-block-end:26px;inset-inline-start:50%;transform:translateX(50%) translateY(120px);
  padding:12px 20px;border-radius:12px;background:var(--txt);color:var(--surface);border:none;
  font-size:13px;font-weight:600;box-shadow:0 18px 40px -20px rgba(16,26,43,.7);z-index:300;transition:.3s;opacity:0;
}
html[dir="ltr"] .toast{transform:translateX(-50%) translateY(120px)}
.toast.show{transform:translateX(50%) translateY(0);opacity:1}
html[dir="ltr"] .toast.show{transform:translateX(-50%) translateY(0);opacity:1}


/* ---------- PANNEAUX PLIABLES ---------- */
.pan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.pan-h{display:flex;align-items:center;gap:10px;padding:13px 18px;font-size:12.5px;font-weight:700;color:var(--txt2);letter-spacing:.2px}
.pan-h .p-tog{margin-inline-start:auto}
.pan > .p-in{padding:0 16px 16px}
.p-tog{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--txt2);font-size:11px;display:grid;place-items:center;transition:.18s;flex-shrink:0}
.p-tog:hover{color:var(--txt);border-color:var(--line2)}
.collapsed > .p-in{display:none}
.collapsed .p-tog{transform:rotate(-90deg)}
html[dir="rtl"] .collapsed .p-tog{transform:rotate(90deg)}
.brief > .p-tog{position:absolute;inset-block-start:20px;inset-inline-end:20px;transform:none}
.pan .kpis{margin-bottom:0}
.pan .strip{margin-bottom:0;padding-bottom:6px}
.pan .toolbar{position:static;border:none;padding:0;margin:0;background:transparent;backdrop-filter:none}

/* ---------- BRIEF : charge par catégorie ---------- */
.loadbar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--bg2);margin:6px 0 12px}
.loadbar i{display:block;height:100%}
.loadleg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.lchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-size:11.8px;font-weight:600;color:var(--txt2);transition:.15s}
.lchip:hover{border-color:var(--line2);color:var(--txt)}
.lchip.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand2)}
.lchip b{font-family:var(--ff-fr);font-weight:700}
.insight{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ins{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:9px 12px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);font-size:12.3px;color:var(--txt2);font-weight:600}
.ins b{color:var(--txt);font-weight:700}
.ins.warn{background:color-mix(in srgb,var(--bad) 7%,var(--surface));border-color:color-mix(in srgb,var(--bad) 28%,transparent);color:#b91c1c}
:root[data-theme="dark"] .ins.warn{color:#fca5a5}

/* ---------- ORBE D'ALERTES ---------- */
.orbwrap{display:flex;flex-direction:column;align-items:center;padding:24px 22px;max-height:none;overflow:visible}
.orb{position:relative;width:158px;height:158px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface2);border:1px solid var(--line);transition:.25s}
.orb:hover{transform:translateY(-2px)}
.orb .orb-face{font-size:58px;filter:grayscale(.55) opacity(.75);transition:.25s}
.orb .orb-count{position:absolute;inset-block-start:6px;inset-inline-end:6px;min-width:26px;height:26px;padding:0 6px;
  border-radius:20px;background:var(--bad);color:#fff;font-family:var(--ff-fr);font-weight:700;font-size:12.5px;display:grid;place-items:center}
.orb .orb-count.zero{background:var(--ok)}
.orbwrap.lit .orb{background:radial-gradient(circle at 50% 42%, color-mix(in srgb,var(--warn) 32%,var(--surface)), var(--surface2) 72%);
  border-color:color-mix(in srgb,var(--warn) 45%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--warn) 12%,transparent),0 18px 40px -22px var(--warn)}
.orbwrap.lit .orb .orb-face{filter:none;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.orb-cap{margin-top:12px;font-size:12.5px;font-weight:700;color:var(--txt2)}
.orb-hint{font-size:11.5px;color:var(--txt3);margin-top:3px;text-align:center}
/* On garde un plafond, mais relatif a l ecran et non a un chiffre fixe, et on
   empeche le geste de fuir vers la page quand on arrive au bout. */
.orbwrap > .p-in{width:100%;margin-top:16px;display:flex;flex-direction:column;gap:9px;
                 max-height:min(560px,62vh);overflow:auto;overscroll-behavior:contain}
.orbwrap.collapsed > .p-in{display:none}
/* La legende est posee sous le cercle en position absolue : sans cette
   reserve, la boite s arretait au cercle et la legende mordait sur la rangee
   suivante (contenu de 111 px dans une boite de 83 px). */
.orbwrap.collapsed{background:transparent;border:none;box-shadow:none;padding:0 0 30px}
.orbwrap.collapsed{position:relative}
.orbwrap.collapsed .orb-cap{position:absolute;inset-block-start:100%;inset-inline:0;margin-top:9px;font-size:11.8px}
.orbwrap.collapsed .orb-hint{display:none}
.wrap.ring .orbwrap.collapsed .orb-cap{display:none}

/* ---------- ORBES DE PANNEAUX ---------- */
.pan.collapsed{background:transparent;border:none;box-shadow:none;overflow:visible}
.pan.collapsed .pan-h{display:none}
.pan:not(.collapsed) .pan-orb{display:none}
.pan-orb{width:158px;height:158px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:.2s;padding:12px}
.pan-orb:hover{transform:translateY(-3px);border-color:var(--line2)}
.pan-orb .po-ic{font-size:31px;line-height:1.1}
.pan-orb .po-l{font-size:11.8px;font-weight:700;color:var(--txt2);text-align:center;line-height:1.35;max-width:112px}
.pan-orb .po-s{font-size:10px;color:var(--txt3);font-family:var(--ff-fr);font-weight:700;white-space:nowrap}
.hdr-orb{width:42px;height:42px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);
  font-size:19px;display:grid;place-items:center;transition:.18s;flex-shrink:0}
.hdr-orb:hover{transform:scale(1.06);border-color:var(--line2)}
.brief > .hdr-orb{position:absolute;inset-block-start:18px;inset-inline-end:18px}
.brief.collapsed{background:transparent;border:none;box-shadow:none;padding:0}
.brief.collapsed > h2,.brief.collapsed > .hdr-orb{display:none}
.brief:not(.collapsed) .pan-orb{display:none}
.brief.collapsed .pan-orb{display:flex}

/* ---------- BOARDS CIRCULAIRES ---------- */
.boards{display:contents}
.board{flex:1 1 470px;min-width:0}
.board.closed{flex:0 0 auto;background:transparent;border:none;box-shadow:none;border-radius:50%}
.board.closed .board-head,.board.closed .board-body{display:none}
.board.open .board-orb{display:none}
.board-orb{width:158px;height:158px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.2s;padding:12px}
.board-orb:hover{transform:translateY(-3px);border-color:var(--line2)}
.board[data-cat="ent"] .board-orb{background:radial-gradient(circle at 50% 28%,var(--brandSoft),var(--surface) 68%)}
.board[data-cat="perso"] .board-orb{background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--ok) 14%,var(--surface)),var(--surface) 68%)}
.board-orb .bo-ic{font-size:34px;line-height:1}
.board-orb .bo-n{font-family:var(--ff-fr);font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-1px}
.board-orb .bo-l{font-size:11.8px;font-weight:700;color:var(--txt2);text-align:center;line-height:1.35;max-width:112px}
.board-orb .bo-s{font-size:10.5px;color:var(--txt3)}

/* ---------- GROUPEMENT PAR CATÉGORIE ---------- */
.gsw{display:flex;gap:3px;background:var(--bg2);padding:3px;border-radius:10px}
.gs{padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--txt2);transition:.15s}
.gs.on{background:var(--surface);color:var(--brand2);box-shadow:0 1px 2px rgba(16,26,43,.1)}
.board-head .cnt{margin-inline-start:auto}
.cgroup{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--surface2)}
.cgroup + .cgroup{margin-top:8px}
.cg-h{width:100%;display:flex;align-items:center;gap:11px;padding:11px 13px;text-align:start;font-size:13px;font-weight:600;transition:.15s}
.cg-h:hover{background:var(--bg2)}
.cg-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.cg-n{flex:1;min-width:0}
.cg-sub{font-size:10.8px;color:var(--txt3);font-weight:600;margin-top:2px}
.cg-c{font-family:var(--ff-fr);font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--txt2)}
.cg-ch{color:var(--txt3);font-size:11px;transition:.2s}
.cgroup.open .cg-ch{transform:rotate(180deg)}
.cg-b{display:none;padding:0 9px 10px;flex-direction:column;gap:8px}
.cgroup.open .cg-b{display:flex}
@media(max-width:560px){.board-orb,.orb,.pan-orb{width:126px;height:126px}.orb .orb-face{font-size:46px}.pan-orb .po-ic{font-size:30px}}


/* ---------- COMPAGNONS (chat + chien) ---------- */
/* --- Gestion des sections et des categories --- */
.sec-btn{background:var(--surface);color:var(--txt2);border:1px solid var(--line);box-shadow:none}
.sec-btn:hover{border-color:var(--brand);color:var(--txt)}
.chiplist{display:flex;flex-wrap:wrap;gap:7px}
.seclab{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg2);font-size:12.3px;font-weight:700}
.seclab .rm{color:var(--txt3);font-size:13px;padding:0 2px;line-height:1}
.seclab .rm:hover{color:var(--bad)}

/* z-index 40 : au-dessus des panneaux (qui n'en déclarent aucun) mais SOUS
   la barre d'outils collante (50) et la barre du haut (60) — une décoration
   ne doit jamais recouvrir un contrôle.
   inset-inline-end au lieu de right:-18px : le débordement physique créait
   une barre de défilement horizontale fantôme en LTR et rognait la queue du
   chat en RTL. */
#pets{position:absolute;bottom:8px;right:0;left:auto;width:300px;height:196px;z-index:40;
  pointer-events:none;filter:drop-shadow(0 14px 20px rgba(16,26,43,.16))}

/* ÉTAT OUVERT — les animaux restent EN HAUT, à droite, comme voulu.

   contenu, se placent donc toujours SOUS la barre du haut quelle que soit
   sa hauteur (elle passe sur deux lignes en dessous de ~700px), et défilent
   avec la page au lieu de rester garés devant le contenu.
   La bande réservée par padding-block-start leur appartient entièrement :
   aucun panneau ne commence avant, donc plus aucun recouvrement — et comme
   la bande est vide sur toute la largeur, le côté choisi n'a plus d'effet
   de bord en arabe comme en français. */
.wrap:not(.ring) #pets{position:absolute;top:0;bottom:auto;right:0;left:auto;
  width:190px;height:126px;opacity:.97}
.wrap:not(.ring){padding-block-start:152px;padding-bottom:26px}
/* Sur un telephone, 122 px de bande vide pleine largeur pour une decoration de
   150x99 px, ajoutes a une barre collante de 127 px, repoussaient le premier

   decoration dans un coin. */
@media(max-width:700px){
  .wrap:not(.ring){padding-block-start:64px}
  #pets{transform:scale(.72);transform-origin:top right;opacity:.9}
}

/* ==========================================================================
   ANNEAU MINIATURE — l'anneau reste un anneau jusqu'à 320px de large.
   Géométrie vérifiée : chaque bulle satellite tient sur le cercle sans
   toucher ses voisines (corde = 2·rr·sin(π/7) ≈ 0,868·rr) ni la bulle
   centrale (jeu = rr − ctr/2 − orb/2 > 6px).
   Sélecteurs préfixés .wrap.ring → spécificité supérieure aux règles
   génériques plus bas, l'ordre source n'a donc pas d'importance.

   Seuil à 940px et non 760px : l'anneau « bureau » d'origine se calcule avec
   --rr:clamp(196px,25vw,290px) pour des satellites de 158px et une bulle
   centrale de 284px. Le jeu centre/satellite vaut rr − 142 − 79, donc il
   devient NÉGATIF (−25px à 761px) tant que 25vw n'atteint pas 227px, c'est
   à dire en dessous de ~908px de large : sur tablette et petite fenêtre, la
   bulle centrale chevauchait les satellites. L'anneau réduit prend donc le
   relais jusqu'à 940px, où le jeu d'origine est redevenu confortable.
   ========================================================================== */
@media(max-width:940px){
  .wrap.ring{
    --rr:clamp(100px,33vw,250px);      /* rayon de l'anneau            */
    --orbS:clamp(70px,22vw,150px);     /* diamètre d'une bulle         */
    --ctrS:clamp(112px,38vw,240px);    /* diamètre de la bulle centrale*/
    --petsW:min(176px,46vw);           /* largeur des animaux          */
    --petsH:calc(var(--petsW)*216/330);/* hauteur = ratio du viewBox   */
    display:block;position:relative;
    min-height:calc(var(--mainsH) + var(--rr)*2 + var(--orbS) + 56px);
    padding-bottom:0;
    margin-bottom:calc(var(--petsH) + 18px);  /* la bande des animaux */
  }
  .wrap.ring .ring-node,
  .wrap.ring #pan_brief,
  .wrap.ring::before{top:calc(var(--mainsH) + var(--rr) + var(--orbS)/2 + 28px)}
  .wrap.ring .boards{padding:0 14px;gap:10px}
  .wrap.ring .board.closed.main-node{flex:1 1 100%;max-width:none}
  .wrap.ring .board.closed .board-orb{min-height:76px;padding:12px 16px;gap:12px;border-radius:18px}
  .wrap.ring .board.closed .board-orb .bo-ic{font-size:28px}
  .wrap.ring .board.closed .board-orb .bo-n{font-size:26px;min-width:34px}
  .wrap.ring .board.closed .board-orb .bo-l{font-size:12.5px;display:block}
  .wrap.ring::before{display:block}

  /* bulles satellites */
  .wrap.ring .orb,
  .wrap.ring .pan-orb,
  .wrap.ring .board-orb{width:var(--orbS);height:var(--orbS);padding:6px;gap:1px}
  .wrap.ring .orb .orb-face{font-size:calc(var(--orbS)*.42)}
  .wrap.ring .orb .orb-count{transform:scale(.82)}
  .wrap.ring .pan-orb .po-ic{font-size:calc(var(--orbS)*.30)}
  .wrap.ring .board-orb .bo-ic{font-size:calc(var(--orbS)*.26)}
  .wrap.ring .board-orb .bo-n{font-size:calc(var(--orbS)*.24);letter-spacing:-.5px}
  .wrap.ring .pan-orb .po-l,
  .wrap.ring .board-orb .bo-l{font-size:calc(var(--orbS)*.115);max-width:calc(var(--orbS)*.9);line-height:1.25}
  .wrap.ring .pan-orb .po-s,
  .wrap.ring .board-orb .bo-s{display:none}

  /* bulle centrale */
  .wrap.ring .pan-orb.ctr{width:var(--ctrS);height:var(--ctrS);padding:10px 12px;gap:2px}
  .wrap.ring .pan-orb.ctr .po-ic{font-size:calc(var(--ctrS)*.105)}
  .wrap.ring .pan-orb.ctr .po-g{font-size:calc(var(--ctrS)*.075);line-height:1.25}
  .wrap.ring .pan-orb.ctr .po-w{font-size:calc(var(--ctrS)*.060)}
  .wrap.ring .pan-orb.ctr .po-k{font-size:calc(var(--ctrS)*.048);margin-top:2px}
  .wrap.ring .pan-orb.ctr .po-q{font-size:calc(var(--ctrS)*.056);max-width:calc(var(--ctrS)*.76);line-height:1.4}

  /* Les animaux sortent de l'anneau et se posent dans la bande réservée
     juste en dessous (top:100% = bord bas de .wrap.ring). Centrés via
     left:50% + translateX(-50%), qui est neutre vis-à-vis de la direction. */
  .wrap.ring #pets{
    width:var(--petsW);height:var(--petsH);
    top:100%;bottom:auto;right:auto;left:50%;transform:translateX(-50%);
  }
}

/* Très petits écrans : on garde l'icône et le compteur, on retire le texte
   qui ne tient plus dans un cercle de ~75px. */
@media(max-width:560px){
  .wrap.ring .pan-orb .po-l,
  .wrap.ring .board-orb .bo-l{display:none}
  .wrap.ring .pan-orb.ctr .po-q{display:none}
}

/* ==========================================================================
   ANIMAUX — correction du chevauchement.
   #pets est en position:fixed sur le bord de la fenêtre, alors que .wrap est
   limité à 1480px et centré. Au-dessus de ~1520px il reste une gouttière
   libre à droite : les animaux y sont parfaitement placés (comportement
   voulu par le design, conservé tel quel).
   En dessous, le contenu touche le bord et les animaux recouvraient la
   première bulle — en arabe (RTL) uniquement, car la rangée démarre à
   droite. On les fait alors descendre en bas, où .wrap:not(.ring) réserve
   déjà 76px : aucun chevauchement, aucun espace perdu.
   ========================================================================== */
/* Au-delà de 1880px la colonne de 1480px laisse une vraie gouttière de chaque
   côté (il faut vw >= 1480 + 2*198 pour loger un animal de 190px + 8px hors
   de la colonne). Les animaux s'y installent alors, la bande réservée n'a
   plus lieu d'être : c'est exactement le rendu que vous voyez sur votre
   grand écran, conservé tel quel. */
@media(min-width:1880px){
  .wrap:not(.ring){padding-block-start:22px}
  .wrap:not(.ring) #pets{right:-206px;top:6px}
}
@media(max-width:940px){
  .wrap:not(.ring) #pets{width:150px;height:99px}
  .wrap:not(.ring){padding-block-start:96px}
}

@media(max-width:560px){

  .wrap{padding:0 14px 50px}.topbar-in{padding:10px 14px}

<!-- Generateur iCalendar RFC 5545 (Samsung / Outlook / Apple) -->
<script>
/*!
 * ics.js - Generateur iCalendar (RFC 5545) autonome pour tableau de bord FR/AR
 * Plain ES2019. Aucune dependance, aucun build. Fonctionne depuis file://
 *
 * API :
 *   ICS.buildICS(events, opts) -> string  (VCALENDAR complet, CRLF)
 *   ICS.buildVEVENT(ev, opts)  -> string  (un seul VEVENT, CRLF)
 *   ICS.downloadICS(text, filename)
 *   ICS.escapeText / ICS.foldLine / ICS.unfold / ICS.utf8Length (utilitaires, utiles pour tester)
 */
(function (root) {
  'use strict';

  var CRLF = '\r\n';
  var MAX_OCTETS = 75;                 // RFC 5545 3.1 : 75 octets, saut de ligne exclu
  var DEFAULT_TZ = 'Africa/Algiers';
  var DEFAULT_PRODID = '-//Agenda Pro//Tableau de bord FR-AR//FR';

  /* ------------------------------------------------------------------ *
   * 1. Octets UTF-8 (jamais des "characters" JS)
   * ------------------------------------------------------------------ */

  // Longueur UTF-8 d'un point de code.
  function utf8LenOfCodePoint(cp) {
    if (cp < 0x80) return 1;
    if (cp < 0x800) return 2;
    if (cp < 0x10000) return 3;
    return 4;
  }

  // Longueur en octets UTF-8 d'une chaine complete.
  function utf8Length(str) {
    var n = 0;
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) {
        var d = str.charCodeAt(i + 1);
        if (d >= 0xdc00 && d <= 0xdfff) { n += 4; i++; continue; }
      }
      n += utf8LenOfCodePoint(c);
    }
    return n;
  }

  // Decoupe une ligne en "atomes" insecables :
  //  - une paire de substitution UTF-16 (emoji) reste entiere,
  //  - une sequence d'echappement (deux caracteres) reste entiere.
  function atomize(line) {
    var atoms = [];
    for (var i = 0; i < line.length; i++) {
      var ch = line.charAt(i);
      var code = line.charCodeAt(i);
      if (ch === '\\' && i + 1 < line.length) {
        atoms.push(line.substr(i, 2));
        i++;
        continue;
      }
      if (code >= 0xd800 && code <= 0xdbff && i + 1 < line.length) {
        var lo = line.charCodeAt(i + 1);
        if (lo >= 0xdc00 && lo <= 0xdfff) {
          atoms.push(line.substr(i, 2));
          i++;
          continue;
        }
      }
      atoms.push(ch);
    }
    return atoms;
  }

  /**
   * Pliage RFC 5545 : au plus 75 OCTETS par ligne, saut de ligne exclu.
   * L'espace de continuation compte dans les 75 octets de sa ligne.
   * Le comptage se fait en octets UTF-8 : une lettre arabe = 2 octets,
   * un emoji = 4 octets. Compter des caracteres JS produit des lignes
   * trop longues, que Outlook et Samsung Calendar tronquent ou rejettent.
   */
  function foldLine(line) {
    if (utf8Length(line) <= MAX_OCTETS) return line;

    var atoms = atomize(line);
    var out = [];
    var cur = '';
    var curOctets = 0;
    var first = true;

    for (var i = 0; i < atoms.length; i++) {
      var a = atoms[i];
      var aLen = utf8Length(a);
      var budget = first ? MAX_OCTETS : MAX_OCTETS - 1; // 1 octet pour l'espace de continuation
      if (curOctets + aLen > budget) {
        out.push(first ? cur : ' ' + cur);
        first = false;
        cur = a;
        curOctets = aLen;
      } else {
        cur += a;
        curOctets += aLen;
      }
    }
    if (cur !== '') out.push(first ? cur : ' ' + cur);
    return out.join(CRLF);
  }

  // Inverse du pliage (relecture / tests).
  function unfold(text) {
    return String(text).replace(/\r\n[ \t]/g, '').replace(/\n[ \t]/g, '');
  }

  /* ------------------------------------------------------------------ *
   * 2. Echappement RFC 5545 (valeurs de type TEXT uniquement)
   * ------------------------------------------------------------------ */

  function escapeText(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\r\n|\r|\n/g, '\\n')
      // caracteres de controle interdits dans une valeur TEXT
      .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
  }

  function unescapeText(value) {
    var out = '';
    for (var i = 0; i < value.length; i++) {
      var ch = value.charAt(i);
      if (ch === '\\' && i + 1 < value.length) {
        var nx = value.charAt(i + 1);
        if (nx === 'n' || nx === 'N') { out += '\n'; i++; continue; }
        if (nx === '\\' || nx === ';' || nx === ',') { out += nx; i++; continue; }
      }
      out += ch;
    }
    return out;
  }

  // Valeurs URI / CAL-ADDRESS : pas d'echappement TEXT, simple nettoyage.
  function sanitizeUri(value) {
    return String(value == null ? '' : value).replace(/[\r\n\t]/g, '').trim();
  }

  // Valeur de parametre, entre guillemets si necessaire (RFC 5545 3.2).
  function paramValue(value) {
    var v = String(value == null ? '' : value).replace(/["\r\n]/g, '');
    return /[;:,]/.test(v) ? '"' + v + '"' : v;
  }

  /* ------------------------------------------------------------------ *
   * 3. Dates : arithmetique pure, aucune dependance au fuseau du navigateur
   * ------------------------------------------------------------------ */

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function pad4(n) { return ('000' + n).slice(-4); }

  var DATE_RE = /^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2}))?)?\s*(Z)?$/;

  // Accepte 'YYYY-MM-DD', 'YYYY-MM-DD HH:mm', 'YYYY-MM-DDTHH:mm:ss',
  // {date:'YYYY-MM-DD', time:'HH:mm'} ou un objet Date (instant -> heure murale du fuseau).
  function parseParts(value, zone) {
    if (value == null || value === '') return null;

    if (value instanceof Date) {
      if (isNaN(value.getTime())) return null;
      return instantToWall(value.getTime(), zone);
    }
    if (typeof value === 'object') {
      var dpart = value.date || value.day || '';
      var tpart = value.time || '';
      return parseParts(tpart ? dpart + 'T' + tpart : dpart, zone);
    }

    var s = String(value).trim();
    var m = DATE_RE.exec(s);
    if (!m) throw new Error('ICS: date illisible "' + s + '" (attendu YYYY-MM-DD ou YYYY-MM-DD HH:mm)');

    var parts = {
      y: +m[1], m: +m[2], d: +m[3],
      H: m[4] === undefined ? 0 : +m[4],
      M: m[5] === undefined ? 0 : +m[5],
      S: m[6] === undefined ? 0 : +m[6],
      hasTime: m[4] !== undefined,
      utc: !!m[7]
    };
    if (parts.utc) {
      var ts = Date.UTC(parts.y, parts.m - 1, parts.d, parts.H, parts.M, parts.S);
      var w = instantToWall(ts, zone);
      w.hasTime = parts.hasTime;
      return w;
    }
    return parts;
  }

  function addDays(parts, n) {
    var ts = Date.UTC(parts.y, parts.m - 1, parts.d, 12, 0, 0) + n * 86400000;
    var dt = new Date(ts);
    return {
      y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(),
      H: parts.H, M: parts.M, S: parts.S, hasTime: parts.hasTime
    };
  }

  function addMinutes(parts, n) {
    var ts = Date.UTC(parts.y, parts.m - 1, parts.d, parts.H, parts.M, parts.S) + n * 60000;
    var dt = new Date(ts);
    return {
      y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(),
      H: dt.getUTCHours(), M: dt.getUTCMinutes(), S: dt.getUTCSeconds(),
      hasTime: true
    };
  }

  function fmtDate(p) { return pad4(p.y) + pad2(p.m) + pad2(p.d); }
  function fmtDateTime(p) { return fmtDate(p) + 'T' + pad2(p.H) + pad2(p.M) + pad2(p.S || 0); }
  function fmtUTC(ms) {
    var d = new Date(ms);
    return pad4(d.getUTCFullYear()) + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) + 'T' +
           pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
  }

  function compareParts(a, b) {
    return (a.y - b.y) || (a.m - b.m) || (a.d - b.d) ||
           ((a.H || 0) - (b.H || 0)) || ((a.M || 0) - (b.M || 0)) || ((a.S || 0) - (b.S || 0));
  }

  /* ------------------------------------------------------------------ *
   * 4. Fuseaux horaires
   * ------------------------------------------------------------------ */

  var FIXED_OFFSETS = {           // filet de securite si Intl n'a pas la base tz
    'Africa/Algiers': 60,         // UTC+1 toute l'annee, aucun changement d'heure
    'Africa/Tunis': 60,
    'UTC': 0, 'Etc/UTC': 0, 'GMT': 0
  };

  var _dtfCache = {};
  function dtfFor(zone) {
    if (!_dtfCache[zone]) {
      _dtfCache[zone] = new Intl.DateTimeFormat('en-US', {
        timeZone: zone, hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
    return _dtfCache[zone];
  }

  // Decalage du fuseau, en minutes, a un instant donne.
  function offsetMinutesAt(zone, ms) {
    if (Object.prototype.hasOwnProperty.call(FIXED_OFFSETS, zone)) return FIXED_OFFSETS[zone];
    try {
      var parts = dtfFor(zone).formatToParts(new Date(ms));
      var o = {};
      for (var i = 0; i < parts.length; i++) o[parts[i].type] = parts[i].value;
      var hour = +o.hour === 24 ? 0 : +o.hour;   // certains moteurs rendent "24"
      var asUTC = Date.UTC(+o.year, +o.month - 1, +o.day, hour, +o.minute, +o.second);
      return Math.round((asUTC - ms) / 60000);
    } catch (e) {
      return 0;
    }
  }

  // Heure murale (dans le fuseau) -> instant UTC.
  function wallToInstant(zone, p) {
    var naive = Date.UTC(p.y, p.m - 1, p.d, p.H || 0, p.M || 0, p.S || 0);
    var off = offsetMinutesAt(zone, naive);
    var ts = naive - off * 60000;
    var off2 = offsetMinutesAt(zone, ts);
    if (off2 !== off) ts = naive - off2 * 60000;
    return ts;
  }

  // Instant UTC -> heure murale dans le fuseau.
  function instantToWall(ms, zone) {
    var off = offsetMinutesAt(zone, ms);
    var d = new Date(ms + off * 60000);
    return {
      y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(),
      H: d.getUTCHours(), M: d.getUTCMinutes(), S: d.getUTCSeconds(), hasTime: true
    };
  }

  function fmtOffset(min) {
    var sign = min < 0 ? '-' : '+';
    var a = Math.abs(min);
    return sign + pad2(Math.floor(a / 60)) + pad2(a % 60);
  }

  function tzAbbrev(zone, ms) {
    try {
      var f = new Intl.DateTimeFormat('en-US', { timeZone: zone, timeZoneName: 'short' });
      var ps = f.formatToParts(new Date(ms));
      for (var i = 0; i < ps.length; i++) {
        if (ps[i].type === 'timeZoneName' && /^[A-Za-z]{2,6}$/.test(ps[i].value)) return ps[i].value;
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  // Instants de changement d'heure d'une annee (0 ou 2 en pratique).
  function findTransitions(zone, year) {
    var start = Date.UTC(year, 0, 1);
    var end = Date.UTC(year + 1, 0, 1);
    var step = 86400000;
    var res = [];
    var prev = offsetMinutesAt(zone, start);
    for (var t = start + step; t <= end; t += step) {
      var cur = offsetMinutesAt(zone, t);
      if (cur !== prev) {
        var lo = t - step, hi = t;
        while (hi - lo > 60000) {                       // dichotomie a la minute
          var mid = lo + Math.floor((hi - lo) / 2);
          if (offsetMinutesAt(zone, mid) === prev) lo = mid; else hi = mid;
        }
        res.push({ at: hi, from: prev, to: cur });
        prev = cur;
        if (res.length > 4) break;
      }
    }
    return res;
  }

  var DAYS = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];

  function nthWeekdayRule(y, mo, d) {
    var dow = new Date(Date.UTC(y, mo - 1, d)).getUTCDay();
    var daysInMonth = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    var nth = (d + 7 > daysInMonth) ? -1 : Math.floor((d - 1) / 7) + 1;
    return { bymonth: mo, byday: (nth === -1 ? '-1' : String(nth)) + DAYS[dow] };
  }

  var _vtzCache = {};

  /**
   * VTIMEZONE. Sans ce bloc, Outlook (bureau) refuse le fichier ou deplace
   * les evenements horodates dont le TZID lui est inconnu.
   * Africa/Algiers = UTC+1 fixe -> une seule sous-composante STANDARD.
   */
  function buildVTIMEZONE(zone, year) {
    var key = zone + '|' + year;
    if (_vtzCache[key]) return _vtzCache[key];

    var lines = ['BEGIN:VTIMEZONE', 'TZID:' + zone, 'X-LIC-LOCATION:' + zone];
    var trans = [];
    try { trans = findTransitions(zone, year); } catch (e) { trans = []; }

    if (trans.length !== 2) {
      // Fuseau sans changement d'heure (ou detection impossible) : offset fixe.
      var off = offsetMinutesAt(zone, Date.UTC(year, 0, 1));
      var name = tzAbbrev(zone, Date.UTC(year, 0, 1)) || 'STD';
      lines.push(
        'BEGIN:STANDARD',
        'DTSTART:19700101T000000',
        'TZOFFSETFROM:' + fmtOffset(off),
        'TZOFFSETTO:' + fmtOffset(off),
        'TZNAME:' + name,
        'END:STANDARD'
      );
    } else {
      for (var i = 0; i < 2; i++) {
        var tr = trans[i];
        var isDaylight = tr.to > tr.from;
        var wall = instantToWall(tr.at - 1000, zone);  // heure murale juste AVANT la bascule
        var rule = nthWeekdayRule(wall.y, wall.m, wall.d);
        var nm = tzAbbrev(zone, tr.at + 86400000) || (isDaylight ? 'DST' : 'STD');
        lines.push(
          'BEGIN:' + (isDaylight ? 'DAYLIGHT' : 'STANDARD'),
          'DTSTART:' + fmtDateTime({ y: wall.y, m: wall.m, d: wall.d, H: wall.H, M: wall.M, S: 0 }),
          'RRULE:FREQ=YEARLY;BYMONTH=' + rule.bymonth + ';BYDAY=' + rule.byday,
          'TZOFFSETFROM:' + fmtOffset(tr.from),
          'TZOFFSETTO:' + fmtOffset(tr.to),
          'TZNAME:' + nm,
          'END:' + (isDaylight ? 'DAYLIGHT' : 'STANDARD')
        );
      }
    }
    lines.push('END:VTIMEZONE');
    _vtzCache[key] = lines;
    return lines;
  }

  /* ------------------------------------------------------------------ *
   * 5. RRULE
   * ------------------------------------------------------------------ */

  var FREQS = { DAILY: 1, WEEKLY: 1, MONTHLY: 1, YEARLY: 1, HOURLY: 1, MINUTELY: 1, SECONDLY: 1 };

  function normalizeByDay(byDay) {
    if (byDay == null) return [];
    var list = Array.isArray(byDay) ? byDay : String(byDay).split(',');
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      if (item == null || item === '') continue;
      var token;
      if (typeof item === 'object') {
        var pos = item.pos == null ? '' : String(parseInt(item.pos, 10));
        token = (pos === '0' || pos === 'NaN' ? '' : pos) + String(item.day || '').toUpperCase();
      } else {
        token = String(item).trim().toUpperCase();
      }
      var m = /^([+-]?\d{1,2})?(SU|MO|TU|WE|TH|FR|SA)$/.exec(token);
      if (m) out.push((m[1] || '') + m[2]);
    }
    return out;
  }

  function toIntList(v) {
    if (v == null || v === '') return [];
    var list = Array.isArray(v) ? v : String(v).split(',');
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var n = parseInt(list[i], 10);
      if (!isNaN(n)) out.push(n);
    }
    return out;
  }

  /**
   * RRULE depuis {freq, interval, byDay, byMonthDay, byMonth, until, count, wkst}.
   * Rend '' si freq est vide -> aucune ligne emise.
   * UNTIL doit avoir le MEME type que DTSTART : DATE pour une journee entiere,
   * DATE-TIME en UTC (suffixe Z) pour un evenement horodate avec TZID.
   */
  function buildRRULE(rrule, ctx) {
    if (!rrule) return '';
    ctx = ctx || {};
    var zone = ctx.zone || DEFAULT_TZ;
    var freq = String(rrule.freq || rrule.frequency || '').trim().toUpperCase();
    if (!freq || !FREQS[freq]) return '';

    var parts = ['FREQ=' + freq];

    var interval = parseInt(rrule.interval, 10);
    if (!isNaN(interval) && interval > 1) parts.push('INTERVAL=' + interval);

    var byDay = normalizeByDay(rrule.byDay || rrule.byday || rrule.BYDAY);
    if (byDay.length) parts.push('BYDAY=' + byDay.join(','));

    var byMonthDay = toIntList(rrule.byMonthDay || rrule.bymonthday);
    if (byMonthDay.length) parts.push('BYMONTHDAY=' + byMonthDay.join(','));

    var byMonth = toIntList(rrule.byMonth || rrule.bymonth);
    if (byMonth.length) parts.push('BYMONTH=' + byMonth.join(','));

    var bySetPos = toIntList(rrule.bySetPos || rrule.bysetpos);
    if (bySetPos.length) parts.push('BYSETPOS=' + bySetPos.join(','));

    var wkst = String(rrule.wkst || '').trim().toUpperCase();
    if (/^(SU|MO|TU|WE|TH|FR|SA)$/.test(wkst)) parts.push('WKST=' + wkst);

    // UNTIL et COUNT sont mutuellement exclusifs : UNTIL l'emporte.
    if (rrule.until) {
      var u = parseParts(rrule.until, zone);
      if (ctx.allDay) {
        parts.push('UNTIL=' + fmtDate(u));
      } else {
        if (!u.hasTime) { u.H = 23; u.M = 59; u.S = 59; }
        parts.push('UNTIL=' + fmtUTC(wallToInstant(zone, u)));
      }
    } else {
      var count = parseInt(rrule.count, 10);
      if (!isNaN(count) && count > 0) parts.push('COUNT=' + count);
    }
    return parts.join(';');
  }

  /* ------------------------------------------------------------------ *
   * 6. VALARM
   * ------------------------------------------------------------------ */

  // 45 -> -PT45M ; 120 -> -PT2H ; 1440 -> -P1D ; 0 -> PT0S ; -10 -> PT10M (apres le debut)
  function triggerDuration(minutes) {
    var m = Math.round(Number(minutes));
    if (!isFinite(m)) m = 0;
    if (m === 0) return 'PT0S';
    var after = m < 0;
    var a = Math.abs(m);
    var body;
    if (a % 10080 === 0) body = 'P' + (a / 10080) + 'W';
    else if (a % 1440 === 0) body = 'P' + (a / 1440) + 'D';
    else if (a % 60 === 0) body = 'PT' + (a / 60) + 'H';
    else body = 'PT' + a + 'M';
    return (after ? '' : '-') + body;
  }

  function attendeeAddress(a) {
    if (!a) return '';
    if (typeof a === 'string') return a.trim();
    return String(a.email || a.mail || '').trim();
  }

  function buildVALARMs(ev, ctx, push) {
    var list = ev.reminders || ev.alarms;
    if (!list || !list.length) return;
    var summary = ev.title || ev.summary || 'Rappel';

    for (var i = 0; i < list.length; i++) {
      var r = list[i] || {};
      var minutes = r.minutes;
      if (minutes == null) minutes = r.minutesBefore;
      if (minutes == null) minutes = 10;
      var method = String(r.method || 'popup').toLowerCase();
      var action = method === 'email' ? 'EMAIL' : 'DISPLAY';

      push('BEGIN:VALARM');
      push('TRIGGER:' + triggerDuration(minutes));
      push('ACTION:' + action);
      // DESCRIPTION est obligatoire pour DISPLAY comme pour EMAIL.
      push('DESCRIPTION:' + escapeText(r.description || summary));
      if (action === 'EMAIL') {
        push('SUMMARY:' + escapeText(r.summary || summary));
        // Un VALARM EMAIL exige au moins un ATTENDEE.
        var targets = r.to ? (Array.isArray(r.to) ? r.to : [r.to])
                           : (ev.attendees && ev.attendees.length ? ev.attendees
                              : (ctx.organizerEmail ? [ctx.organizerEmail] : []));
        for (var k = 0; k < targets.length; k++) {
          var mail = attendeeAddress(targets[k]);
          if (mail) push('ATTENDEE:mailto:' + sanitizeUri(mail));
        }
      }
      push('END:VALARM');
    }
  }

  /* ------------------------------------------------------------------ *
   * 7. VEVENT
   * ------------------------------------------------------------------ */

  var STATUSES = { CONFIRMED: 1, TENTATIVE: 1, CANCELLED: 1 };
  var CLASSES = { PUBLIC: 1, PRIVATE: 1, CONFIDENTIAL: 1 };

  function makeUID(domain) {
    var rnd = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    return Date.now().toString(36) + '-' + rnd + '@' + (domain || 'agenda-pro.local');
  }

  function buildVEVENT(ev, opts) {
    ev = ev || {};
    opts = opts || {};

    var zone = String(ev.timezone || ev.timeZone || ev.tzid || opts.timezone || DEFAULT_TZ);
    var allDay = !!(ev.allDay || ev.allday || ev.isAllDay);
    var lines = [];
    function push(l) { lines.push(l); }

    var start = parseParts(ev.start || ev.begin || ev.date, zone);
    if (!start) throw new Error('ICS: evenement sans date de debut (champ "start")');
    if (!allDay && !start.hasTime) allDay = true;   // 'YYYY-MM-DD' seul = journee entiere

    var end = ev.end ? parseParts(ev.end, zone) : null;

    push('BEGIN:VEVENT');
    push('UID:' + sanitizeUri(ev.uid || makeUID(opts.uidDomain)));
    push('DTSTAMP:' + (opts.dtstamp ? fmtUTC(new Date(opts.dtstamp).getTime()) : fmtUTC(Date.now())));

    if (allDay) {
      // DTSTART;VALUE=DATE, et DTEND = LENDEMAIN du dernier jour.
      // DTEND est EXCLUSIF en iCalendar : c'est le fameux decalage d'un jour.
      push('DTSTART;VALUE=DATE:' + fmtDate(start));
      var lastDay = end || start;
      if (compareParts(lastDay, start) < 0) lastDay = start;
      var exclusiveEnd = ev.endExclusive ? lastDay : addDays(lastDay, 1);
      if (compareParts(exclusiveEnd, start) <= 0) exclusiveEnd = addDays(start, 1);
      push('DTEND;VALUE=DATE:' + fmtDate(exclusiveEnd));
    } else {
      if (!end || !end.hasTime) {
        var dur = parseInt(ev.durationMinutes != null ? ev.durationMinutes : opts.defaultDurationMinutes, 10);
        if (isNaN(dur) || dur <= 0) dur = 60;
        end = addMinutes(start, dur);
      }
      if (compareParts(end, start) <= 0) end = addMinutes(start, 60);
      // TZID obligatoire : une heure locale nue (DTSTART:20260401T090000) est
      // interpretee dans le fuseau du LECTEUR -> l'evenement se deplace d'un client a l'autre.
      push('DTSTART;TZID=' + paramValue(zone) + ':' + fmtDateTime(start));
      push('DTEND;TZID=' + paramValue(zone) + ':' + fmtDateTime(end));
    }

    push('SUMMARY:' + escapeText(ev.title || ev.summary || ''));

    if (ev.description) push('DESCRIPTION:' + escapeText(ev.description));
    if (ev.location) push('LOCATION:' + escapeText(ev.location));

    var rr = buildRRULE(ev.rrule || ev.recurrence, { zone: zone, allDay: allDay });
    if (rr) push('RRULE:' + rr);

    if (ev.exdates && ev.exdates.length) {
      var ex = [];
      for (var e = 0; e < ev.exdates.length; e++) {
        var xp = parseParts(ev.exdates[e], zone);
        ex.push(allDay ? fmtDate(xp) : fmtDateTime(xp));
      }
      push(allDay ? 'EXDATE;VALUE=DATE:' + ex.join(',')
                  : 'EXDATE;TZID=' + paramValue(zone) + ':' + ex.join(','));
    }

    var status = String(ev.status || '').trim().toUpperCase();
    if (STATUSES[status]) push('STATUS:' + status);

    var transp = String(ev.transparency || ev.transp || '').trim().toUpperCase();
    if (transp === 'OPAQUE' || transp === 'TRANSPARENT') {
      push('TRANSP:' + transp);
      // Outlook lit surtout ce champ proprietaire pour disponible/occupe.
      push('X-MICROSOFT-CDO-BUSYSTATUS:' + (transp === 'TRANSPARENT' ? 'FREE' : 'BUSY'));
    }

    var vis = String(ev.visibility || ev['class'] || '').trim().toUpperCase();
    if (vis === 'DEFAULT') vis = '';
    if (CLASSES[vis]) push('CLASS:' + vis);

    if (ev.url) push('URL:' + sanitizeUri(ev.url));

    if (ev.categories && ev.categories.length) {
      // CATEGORIES = liste de TEXT : chaque element est echappe,
      // les virgules SEPARATRICES restent nues.
      var cats = (Array.isArray(ev.categories) ? ev.categories : [ev.categories])
        .filter(function (c) { return c != null && String(c) !== ''; })
        .map(escapeText);
      if (cats.length) push('CATEGORIES:' + cats.join(','));
    }

    var prio = parseInt(ev.priority, 10);
    if (!isNaN(prio) && prio >= 0 && prio <= 9) push('PRIORITY:' + prio);

    if (ev.sequence != null && !isNaN(parseInt(ev.sequence, 10))) {
      push('SEQUENCE:' + parseInt(ev.sequence, 10));
    }

    var organizer = ev.organizer || opts.organizer;
    var organizerMail = attendeeAddress(organizer);
    if (organizerMail) {
      var oName = typeof organizer === 'object' ? (organizer.name || organizer.cn) : '';

function nextId(prefix, taken){

/* L'icone et la couleur sont bornees A L'ENREGISTREMENT, pas seulement a

/* ============================================================================
   4. OUTILS DATE
   ============================================================================ */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
/* --- La memoire des dates -------------------------------------------------
   Quelques centaines de dates distinctes portent cinq mille rendez-vous : il
   serait absurde de refaire le meme calcul cinq mille fois par affichage.
   Rien ici ne change le resultat, seulement le nombre de fois qu'on le
   calcule. Voir la note « vitesse » plus bas. */
const _tsParDate = new Map();     /* 'AAAA-MM-JJ'  ->  minuit de ce jour, en ms */
const _ecartParDate = new Map();  /* 'AAAA-MM-JJ'  ->  nombre de jours d'ici la */
let _jourCourant = '';            /* la date d'aujourd'hui, pour savoir quand oublier */
let _tsAujourdhui = 0;

/* Rend minuit d'aujourd'hui, en millisecondes. Si le jour a tourne depuis le
   dernier appel — application laissee ouverte la nuit — on oublie tous les
   ecarts calcules la veille : « demain » doit devenir « aujourd'hui ». */
function _minuitAujourdhui(){
  const d = new Date(); d.setHours(0,0,0,0);
  const cle = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  if(cle !== _jourCourant){ _jourCourant = cle; _tsAujourdhui = d.getTime(); _ecartParDate.clear(); }
  return _tsAujourdhui;
}

/* Minuit du jour ecrit 'AAAA-MM-JJ', en millisecondes. Meme decoupage qu'avant. */
function _minuitDe(s){
  let t = _tsParDate.get(s);
  if(t === undefined){
    const p = String(s).split('-');
    t = new Date(Number(p[0]), Number(p[1])-1, Number(p[2])).getTime();
    _tsParDate.set(s, t);
  }
  return t;
}

/* Un objet NEUF a chaque appel, comme avant : ce que l'appelant en fait ne
   regarde que lui. Seul le calcul est mis en reserve, jamais l'objet. */
const parse = s => new Date(_minuitDe(s));
const today = () => new Date(_minuitAujourdhui());
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const diffDays = s => {
  let n = _ecartParDate.get(s);
  if(n === undefined){
    n = Math.round((_minuitDe(s) - _minuitAujourdhui())/86400000);
    _ecartParDate.set(s, n);
  }
  return n;
};
function fmtDate(s){ const d=parse(s); const L=T[state.lang]; return d.getDate()+' '+L.months[d.getMonth()]+' '+d.getFullYear(); }
function fmtDayName(s){ return T[state.lang].days[parse(s).getDay()]; }
