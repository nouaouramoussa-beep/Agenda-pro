/* ----------------------------------------------------------------------------
   L'IDENTIFIANT ET LE LIEN D'UN RENDEZ-VOUS CHEZ GOOGLE
   ----------------------------------------------------------------------------
   Google nomme chaque occurrence d'une série « cléDeSérie_horodatageUTC ».
   Alger vit à UTC+1 toute l'année, sans heure d'été : l'horodatage se
   recalcule donc exactement, et on ne stocke ces identifiants que dans le
   cas où le calcul ne tomberait pas juste — un rendez-vous déplacé, dont
   l'identifiant garde l'heure d'origine. D'où « gid || idOcc(...) ».

   Le lien, lui, est « eid=base64(identifiant + espace + agenda raccourci) ».
   Google raccourcit l'adresse de l'agenda à sa partie locale suivie de la
   première lettre du domaine. Rien d'inventé ici : les trois valeurs
   ci-dessous ont été relevées sur les liens que Google a réellement
   renvoyés, et vérifiées sur les 5018 rendez-vous.
   -------------------------------------------------------------------------- */
const p2n = n => (n<10?'0':'')+n;
function idOcc(k,d,t,ad){
  if(!k) return '';
  if(ad || !t) return k+'_'+String(d).replace(/-/g,'');
  const p = String(d).split('-').map(Number), q = String(t).split(':').map(Number);
  const u = new Date(Date.UTC(p[0],p[1]-1,p[2],q[0],q[1],0) - 60*60*1000);   /* Alger = UTC+1 */
  return k+'_'+u.getUTCFullYear()+p2n(u.getUTCMonth()+1)+p2n(u.getUTCDate())+
         'T'+p2n(u.getUTCHours())+p2n(u.getUTCMinutes())+p2n(u.getUTCSeconds())+'Z';
}
function lienGoogle(oid,cal){
  /* Les adresses d'agenda vivent dans les donnees, jamais dans le programme :
     la version publiee n'en a aucune, et ne fabrique donc aucun lien. Elle
     n'a de toute facon aucun rendez-vous a ouvrir. */
  const C = (typeof FAM!=='undefined' && FAM && FAM.cals) ? FAM.cals : null;
  const court = C ? (C[cal] || C.moi) : null;
  if(!court || !oid) return 'https://calendar.google.com/calendar/u/0/r';
  try{
    const b = btoa(unescape(encodeURIComponent(oid+' '+court))).replace(/=+$/,'');
    return (FAM.lb||'')+b+'&ctz=Africa/Algiers';
  }catch(e){ return 'https://calendar.google.com/calendar/u/0/r'; }
}

/* Les rappels, tels que Google les donne : [{method:'popup',minutes:10}].
   « 0 minute » veut dire « à l'heure dite », et c'est ce qu'il faut écrire. */
function fmtRappels(rap){
  if(!rap || !rap.length) return '';
  return rap.map(r=>{
    const m = Number(r && r.minutes);
    const voie = (r && r.method==='email') ? t('rapMail') : t('rapPopup');
    if(!isFinite(m)) return voie;
    if(m===0) return voie+' — '+t('rapPile');
    if(m%1440===0) return voie+' — '+t('rapAvant').replace('%1', duree(m/1440,'j'));
    if(m%60===0)   return voie+' — '+t('rapAvant').replace('%1', duree(m/60,'h'));
    return voie+' — '+t('rapAvant').replace('%1', duree(m,'min'));
  }).join(' • ');
}

/* Le nombre et son nom, ecrits comme on les dit. En arabe le nom change de
   forme selon le compte — un, deux, de trois a dix, puis onze et au-dela —
   et le chiffre disparait pour « une heure » et « deux heures ». */
function duree(n,u){
  const f = (T[state.lang].rapU||{})[u] || ['','',''];
  if(state.lang!=='ar') return n+' '+(n>1?f[1]:f[0]);
  if(n===1) return f[0];
  if(n===2) return f[1];
  if(n>=3 && n<=10) return n+' '+f[2];
  return n+' '+f[0];
}

function gcalLink(d){ const [y,m,dd]=d.split('-'); return 'https://calendar.google.com/calendar/u/0/r/day/'+y+'/'+Number(m)+'/'+Number(dd); }

/* --- catégorie effective (avec surcharge utilisateur) -------------------- */
const catOf = it => store.cat[it.id] || it.cat;
/* --- statut ------------------------------------------------------------- */
function statusOf(it){
  const u = store.status[it.id];
  if(u) return u;
  const dd = diffDays(it.date);
  if(dd < 0) return it.routine ? 'passed' : 'overdue';
  return 'pending';
}
/* --- check-list --------------------------------------------------------- */
function clOf(it){
  if(store.checks[it.id] && store.checks[it.id].list) return store.checks[it.id].list;
  const base = CL[it.sk];
  let list = base ? base[state.lang].slice() : [];
  if(it.manual){ const c = store.custom.find(x=>x.id===it.id); if(c && c.subs) list = c.subs.slice(); }
  return list;
}
const clDone = it => (store.checks[it.id] && store.checks[it.id].done) || [];
function setCheck(it,i,on){
  const list = clOf(it);
  const cur = store.checks[it.id] || {};
  const done = (cur.done||[]).slice();
  const k = list[i];
  const p = done.indexOf(k);
  if(on && p<0) done.push(k); if(!on && p>=0) done.splice(p,1);
  store.checks[it.id] = {list:list, done:done};
  lsSet(); render();
  if(window.AP&&AP.sync&&AP.sync.setChecklist) AP.sync.setChecklist(it.id, list, done);
}
function addCheck(it,txt){
  if(!txt.trim()) return;
  const list = clOf(it).slice(); list.push(txt.trim());
  const cur = store.checks[it.id]||{};
  store.checks[it.id] = {list:list, done:cur.done||[]};
  lsSet(); render(); toast(t('toastSaved'));
}
function delCheck(it,i){
  const list = clOf(it).slice(); const k=list[i]; list.splice(i,1);
  const cur = store.checks[it.id]||{};
  store.checks[it.id] = {list:list, done:(cur.done||[]).filter(x=>x!==k)};
  lsSet(); render();
}

/* ============================================================================
   6. FILTRES
   ============================================================================ */
function winRange(){
  const T0 = today();
  if(state.win==='custom' && state.from && state.to) return [parse(state.from), parse(state.to)];
  if(state.selDay) return [parse(state.selDay), parse(state.selDay)];
  /* Deux bornes en jours autour d aujourd'hui, et non plus une seule vers
     l'avant. Un nombre negatif regarde en arriere : c'est tout ce qui
     manquait pour retrouver ce qui est passe. Les anciennes cles (w1…m2)
     gardent exactement leur sens : un reglage deja enregistre chez l'artisan
     continue de marcher. */
  const W = {
    p1:[-31,0], p3:[-92,0],                       /* le passe */
    w1:[0,7], w2:[0,14], w3:[0,21],               /* les semaines */
    m1:[0,31], m2:[0,62], m6:[0,183], a1:[0,365], /* les mois, l'annee */
    all:[-1095,1095]                              /* tout ce qu'on a */
  };
  const b = W[state.win] || W.m1;
  return [addDays(T0,b[0]), addDays(T0,b[1])];
}
function visible(){
  const [A,B] = winRange();
  const q = state.q.trim().toLowerCase();
  return TASKS.filter(it=>{
    const st = statusOf(it);
    const d = parse(it.date);
    const inWin = d>=A && d<=B;
    /* Quand on cherche, on cherche PARTOUT. Enfermer la recherche dans la
       fenetre de temps revenait a cacher a l'artisan des rendez-vous qu'il
       sait pourtant exister : sur deux ans de donnees, la plupart. */
    const enRecherche = q.length > 0;
    /* les retards restent visibles même hors fenêtre (60 j en arrière) */
    const isLateVisible = !state.selDay && state.win!=='custom' && st==='overdue' && d>=addDays(today(),-60) && d<today();
    if(!enRecherche && !inWin && !isLateVisible) return false;
    if(!state.routine && it.routine && st!=='overdue') return false;
    if(state.sub!=='all' && it.sub!==state.sub) return false;
    if(state.status!=='all' && st!==state.status) return false;
    if(q){
      const hay = (it.title.ar+' '+it.title.fr+' '+it.raw+' '+it.desc+' '+(SUBS[it.sub]?SUBS[it.sub].ar+' '+SUBS[it.sub].fr:'')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}

/* ============================================================================
   7. RENDU
   ============================================================================ */
function render(){
  const vis = visible();
  /* Aucune tache du tout : on montre l'ecran d'accueil vide plutot qu'un
     tableau de bord rempli de zeros. Cas normal de la version publiee, tant
     que l'artisan ne s'est pas connecte a son compte. */
  const nd = document.getElementById('noData');
  if(nd) nd.classList.toggle('show', TASKS.length === 0);
  renderKPI();
  renderBrief(vis);
  renderAlerts();
  renderStrip();
  allSections().forEach(s=>{ renderBoard(s.id, vis.filter(i=>catOf(i)===s.id)); });
  /* Mesurer sur la ligne suivante donnerait encore la mise en page d'AVANT :
     le navigateur n'a pas encore replie les textes ni pose les images.
     requestAnimationFrame attend qu'il l'ait fait. C'est la cause du vide
     blanc et de l'anneau qui chevauchait les cartes. */
  requestAnimationFrame(function(){ syncMains(); syncBarre(); });
}

/* --- KPI ---------------------------------------------------------------- */
function renderKPI(){
  const T0=today(), W=addDays(T0,7);
  const notDone = s => s!=='done' && s!=='passed';
  let k1=0,k2=0,k3=0,k4=0,k5=0,k6=0;
  const curM = iso(T0).slice(0,7);
  TASKS.forEach(it=>{
    const s = statusOf(it), c = catOf(it), d = parse(it.date);
    if(s==='overdue' && d>=addDays(T0,-60)) k1++;
    if(c==='ent' && !it.routine && d>=T0 && d<=W && notDone(s)) k2++;
    if(c==='perso' && !it.routine && d>=T0 && d<=addDays(T0,31) && notDone(s)) k3++;
    if(s==='waiting') k4++;
    if(s==='done' && it.date.slice(0,7)===curM) k5++;
    if(it.routine && it.date===iso(T0)) k6++;
  });
  const K=[['k1',k1,'k1'],['k2',k2,'k2'],['k3',k3,'k3'],['k4',k4,'k4'],['k5',k5,'k5'],['k6',k6,'k6']];
  const acts = {k1:"state.status='overdue';syncUI();render()",k2:"state.sub='all';state.status='all';syncUI();render()",
                k3:"state.status='all';syncUI();render()",k4:"state.status='waiting';syncUI();render()",
                k5:"state.status='done';syncUI();render()",k6:"state.routine=true;state.win='w1';syncUI();render()"};
  document.getElementById('kpis').innerHTML = K.map(([cls,v,key])=>
    '<button class="kpi '+cls+'" onclick="'+acts[key]+'"><span class="bar"></span><div class="v">'+v+'</div><div class="l">'+t('kpi.'+key)+'</div></button>'
  ).join('');
}

/* --- Briefing ----------------------------------------------------------- */
function arCnt(n,one,two,few,many,none){
  if(n===0) return none;
  if(n===1) return one;
  if(n===2) return two;
  return '<b>'+n+'</b> '+(n<=10?few:many);
}
function renderBrief(vis){
  const hh = new Date().getHours();
  const gr = hh<12 ? t('greetM') : (hh<18 ? t('greet') : t('greetE'));
  document.getElementById('greet').textContent = gr;
  const og=document.getElementById('orbGreet'); if(og) og.textContent = gr;
  const wt = (typeof wxText==='function' ? wxText() : '');
  const wLbl = wt ? wt+' · '+WX_CITY[state.lang] : (state.lang==='ar'?'الطقس غير متاح':'Météo indisponible');
  const ow=document.getElementById('orbWx'); if(ow) ow.textContent = wLbl;
  const bw=document.getElementById('briefWx'); if(bw) bw.textContent = wLbl;
  const dd0 = (typeof dailyData!=='undefined' && dailyData) ? dailyData : null;
  const kLbl = dd0 ? (dd0.kind==='tip' ? (state.lang==='ar'?'نصيحة اليوم':'Conseil du jour') : (state.lang==='ar'?'حكمة اليوم':'Maxime du jour')) : '';
  const ok=document.getElementById('orbKind'); if(ok) ok.textContent = kLbl;
  const oq=document.getElementById('orbQuote'); if(oq) oq.textContent = dd0 ? dd0.text : '';
  const bq=document.getElementById('briefQuote');
  if(bq) bq.innerHTML = dd0 ? ('<b>'+kLbl+'</b> · '+esc(dd0.text)+' <span style="color:var(--txt3)">↻</span>') : '';
  if(bq) bq.onclick = ()=>newDaily();
  if(bq) bq.style.cursor = 'pointer';
  const L = state.lang==='ar';
  const act = vis.filter(i=>{ const s=statusOf(i); return s!=='done' && s!=='passed'; });

  /* --- répartition par catégorie (barre + puces cliquables) --- */
  const by={}; act.forEach(i=>{ by[i.sub]=(by[i.sub]||0)+1; });
  const ord = Object.keys(by).sort((a,b)=>by[b]-by[a]);
  const tot = act.length;
  document.getElementById('loadBar').innerHTML = tot
    ? ord.map(k=>'<i style="width:'+(by[k]/tot*100).toFixed(2)+'%;background:'+(SUBS[k]?SUBS[k].c:'#94a3b8')+'" title="'+(SUBS[k]?SUBS[k][state.lang]:k)+' — '+by[k]+'"></i>').join('')
    : '<i style="width:100%;background:var(--line)"></i>';
  document.getElementById('loadLeg').innerHTML = tot
    ? ord.slice(0,7).map(k=>{ const S=SUBS[k]||SUBS.perso;
        return '<button class="lchip'+(state.sub===k?' on':'')+'" onclick="pickSub(\''+k+'\')">'+
          '<span style="width:9px;height:9px;border-radius:50%;background:'+S.c+';display:inline-block"></span>'+
          S[state.lang]+' <b>'+by[k]+'</b></button>'; }).join('')
    : '<span class="ins">'+t('noneOpen')+'</span>';

  /* --- deux repères utiles : jour le plus chargé & premier jour libre --- */
  const cnt={}; act.forEach(i=>{ if(diffDays(i.date)>=0) cnt[i.date]=(cnt[i.date]||0)+1; });
  const busy = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b))[0];
  let free=null;
  for(let i=0;i<30;i++){ const s=iso(addDays(today(),i)); if(!cnt[s]){ free=s; break; } }
  const late = TASKS.filter(i=>statusOf(i)==='overdue' && parse(i.date)>=addDays(today(),-60)).length;
  let ins='';
  if(busy) ins += '<button class="ins" onclick="pickDay(\''+busy+'\')">🔥 '+t('busiest')+' : <b>'+fmtDayName(busy)+' '+parse(busy).getDate()+' '+T[state.lang].months[parse(busy).getMonth()]+'</b> · '+cnt[busy]+'</button>';
  if(free) ins += '<button class="ins" onclick="pickDay(\''+free+'\')">🌿 '+t('freeDay')+' : <b>'+fmtDayName(free)+' '+parse(free).getDate()+'</b></button>';
  if(late) ins += '<button class="ins warn" onclick="pickStatus(\'overdue\')">⚠️ <b>'+late+'</b> '+t('lateLbl')+'</button>';
  document.getElementById('insightBox').innerHTML = ins;

  const nxt = TASKS.filter(it=>{
    const s=statusOf(it);
    return !it.routine && s!=='done' && s!=='passed' && parse(it.date)>=today();
  }).slice(0,4);
  document.getElementById('nextUp').innerHTML = nxt.length ? nxt.map(it=>{
    const dd = diffDays(it.date);
    const S = SUBS[it.sub]||SUBS.perso;
    return '<button class="nextup-item" onclick="jumpTo(\''+it.id+'\')">'+
      '<span class="when">'+T[state.lang].inDays(dd)+'</span>'+
      '<span class="ttl">'+S.ic+' '+esc(it.title[state.lang])+'</span>'+
      '<span class="tag time">'+(it.allDay? t('allDay') : it.start)+'</span></button>';
  }).join('') : '';
}
function pickSub(k){ state.sub = state.sub===k ? 'all' : k; syncUI(); render(); }
function pickStatus(s){ state.status = state.status===s ? 'all' : s; syncUI(); render(); }

/* --- Alertes ------------------------------------------------------------ */
function renderAlerts(){
  const A=[], T0=today();
  TASKS.forEach(it=>{
    const s=statusOf(it), d=parse(it.date), dd=diffDays(it.date);
    if(it.routine) return;
    const nm = esc(it.title[state.lang]);
    const list = clOf(it), done = clDone(it);
    if(s==='overdue' && d>=addDays(T0,-60)){
      A.push({p:0,k:'a-bad',ic:'🔴',h:state.lang==='ar'
        ? '<b>'+nm+'</b> متأخرة منذ '+Math.abs(dd)+' يوم — سجّلها كمكتملة أو أعد برمجتها.'
        : '<b>'+nm+'</b> en retard de '+Math.abs(dd)+' j — marquez-la terminée ou reprogrammez-la.'});
    } else if(dd>=0 && dd<=2 && s!=='done'){
      A.push({p:1,k:'a-warn',ic:'⏰',h:state.lang==='ar'
        ? '<b>'+nm+'</b> '+T.ar.inDays(dd)+' ('+fmtDate(it.date)+')'+(list.length? ' — الوثائق الجاهزة: '+done.length+'/'+list.length:'')
        : '<b>'+nm+'</b> '+T.fr.inDays(dd)+' ('+fmtDate(it.date)+')'+(list.length? ' — documents prêts : '+done.length+'/'+list.length:'')});
    } else if(catOf(it)==='ent' && dd>2 && dd<=7 && s!=='done' && list.length && done.length<list.length){
      A.push({p:2,k:'a-info',ic:'📂',h:state.lang==='ar'
        ? 'موعد <b>'+nm+'</b> بعد '+dd+' أيام — هل جهّزت الأوراق؟ ('+done.length+'/'+list.length+')'
        : '<b>'+nm+'</b> dans '+dd+' j — les pièces sont-elles prêtes ? ('+done.length+'/'+list.length+')'});
    } else if(s==='waiting'){
      A.push({p:3,k:'a-info',ic:'⏳',h:state.lang==='ar'
        ? '<b>'+nm+'</b> تحت المتابعة — تحقق من الرد.'
        : '<b>'+nm+'</b> en suivi — vérifiez la réponse.'});
    }
  });
  A.sort((a,b)=>a.p-b.p);
  const urgent = A.filter(a=>a.p<=1).length;
  const cntEl = document.getElementById('alertCnt');
  cntEl.textContent = urgent || A.length;
  cntEl.classList.toggle('zero', !A.length);
  document.getElementById('pan_alerts').classList.toggle('lit', A.length>0 && !!state.pan.alerts);
  const box = document.getElementById('alertList');
  box.innerHTML = A.length
    ? A.slice(0,7).map(a=>'<div class="alert '+a.k+'"><span class="ic">'+a.ic+'</span><div>'+a.h+'</div></div>').join('')
    : '<div class="alert a-ok"><span class="ic">✅</span><div>'+t('noAlerts')+'</div></div>';
}

/* --- Bande agenda 14 jours --------------------------------------------- */
function stripDays(){
  if(state.win==='custom' && state.from && state.to){
    const n = Math.round((parse(state.to)-parse(state.from))/86400000)+1;
    return {from:parse(state.from), n:Math.max(1,Math.min(n,92))};
  }
  return {from:today(), n:({w1:7,w2:14,w3:21,m1:31,m2:62}[state.win]||31)};
}
function renderStrip(){
  const {from,n} = stripDays(); let out='';
  const T0s = iso(today()), L=T[state.lang];
  let curMo = -1;
  for(let i=0;i<n;i++){
    const d = addDays(from,i), s = iso(d);
    if(n>14 && d.getMonth()!==curMo){
      curMo = d.getMonth();
      out += '<div class="strip-mo">'+L.months[curMo]+' '+d.getFullYear()+'</div>';
    }
    const items = TASKS.filter(x=>x.date===s && !x.routine && statusOf(x)!=='done');
    const ent = items.filter(x=>catOf(x)==='ent').length;
    const per = items.length - ent;
    const kls = !items.length ? 'none' : (per===0 ? 'ent' : ent===0 ? 'per' : 'mix');
    out += '<button class="day'+(s===T0s?' today':'')+(state.selDay===s?' sel':'')+(items.length?'':' empty-d')+'" onclick="pickDay(\''+s+'\')" title="'+items.length+'">'+
      '<div class="dw">'+L.daysS[d.getDay()]+'</div>'+
      '<div class="dn">'+d.getDate()+'</div>'+
      (n<=14 ? '<span class="dm">'+L.months[d.getMonth()].slice(0,4)+'</span>' : '')+
      '<span class="dq '+kls+'">'+(items.length||'·')+'</span></button>';
  }
  document.getElementById('strip').innerHTML = out;
  const lbl = t(state.win) + ' · ' + n + (state.lang==='ar'?' يوم':' j');
  document.getElementById('stripRange').textContent = lbl;
  const o = document.getElementById('stripRangeOrb'); if(o) o.textContent = lbl;
}
function pickDay(s){ state.selDay = (state.selDay===s ? null : s); syncUI(); render(); }

/* --- Colonnes ----------------------------------------------------------- */
function bucketOf(it){
  const s = statusOf(it), dd = diffDays(it.date);
  if(s==='done'||s==='passed') return 'closed';
  if(dd<0) return 'overdue';
  if(dd===0) return 'today';
  if(dd===1) return 'tomorrow';
  if(dd<=7) return 'week';
  if(dd<=14) return 'next';
  return 'later';
}
const BK_ORDER = ['overdue','today','tomorrow','week','next','later','closed'];
let PRINTING = false;
/* Construit une carte de tableau par section. Appelee au demarrage et apres
   toute modification de la liste des sections. */
function buildBoardsDOM(){
  const wrap=document.getElementById('boardsWrap'); if(!wrap) return;
  wrap.innerHTML = allSections().map(s=>{
    const cl = s.builtin ? '' : ' custom-sec';
    /* L'icone d'une section ajoutee par l'utilisateur est du TEXTE LIBRE relu
       depuis localStorage : le maxlength="4" du champ de saisie est une regle
       d'affichage, la page ne l'applique jamais a la relecture. Sans esc(),
       une section nommee avec <img src=x onerror=...> executerait son code au
       prochain chargement — et le jour ou les sections seront synchronisees
       dans l'organisation, ce serait le code d'un employe s'executant chez le
       proprietaire, avec sa session en prime (XSS stocke multi-utilisateurs). */
    const ic = esc(s.ic);
    /* La couleur, elle, part dans un ATTRIBUT style : l'echapper ne suffirait
       pas, une valeur echappee reste une valeur CSS arbitraire. On valide donc
       le FORMAT, et toute valeur douteuse retombe sur la couleur par defaut
       des sections ajoutees. */
    const sc = /^#[0-9a-fA-F]{3,8}$/.test(String(s.c == null ? '' : s.c)) ? s.c : '#a855f7';
    const st = s.builtin ? '' : ' style="--secC:'+sc+'"';
    return '<div class="board closed main-node'+cl+'" data-cat="'+s.id+'" id="pan_b_'+s.id+'"'+st+'>'+
      '<button class="board-orb" onclick="togBoard(\''+s.id+'\')">'+
        '<span class="bo-ic">'+ic+'</span>'+
        '<span class="bo-n" id="orb_'+s.id+'">0</span>'+
        '<span class="bo-l" data-sec-name="'+s.id+'"></span>'+
      '</button>'+
      '<div class="board-head">'+
        '<div class="bi">'+ic+'</div>'+
        '<div><h3 data-sec-name="'+s.id+'"></h3><div class="bs" data-sec-sub="'+s.id+'"></div></div>'+
        '<div class="cnt" id="cnt_'+s.id+'">0</div>'+
        '<div class="gsw">'+
          '<button class="gs on" id="gs_'+s.id+'_date" onclick="setGroup(\''+s.id+'\',\'date\')" data-t="byDate"></button>'+
          '<button class="gs" id="gs_'+s.id+'_cat" onclick="setGroup(\''+s.id+'\',\'cat\')" data-t="byCat"></button>'+
        '</div>'+
        (s.builtin? '' : '<button class="p-tog" title="—" onclick="delSection(\''+s.id+'\')">🗑</button>')+
        '<button class="p-tog" onclick="togBoard(\''+s.id+'\')">✕</button>'+
      '</div>'+
      '<div class="board-body" id="board_'+s.id+'"></div>'+
    '</div>';
  }).join('');
  allSections().forEach(s=>{ if(state.boards[s.id]===undefined) state.boards[s.id]=0; });
}
function renderBoard(cat, items){
  const el = document.getElementById('board_'+cat);
  const cn = document.getElementById('cnt_'+cat), on = document.getElementById('orb_'+cat);
  if(!el) return;
  if(cn) cn.textContent = items.length;
  if(on) on.textContent = items.length;
  if(!state.boards[cat] && !PRINTING){ el.innerHTML=''; return; }
  if(!items.length){
    el.innerHTML = '<div class="empty"><span class="e-ic">🗂️</span>'+t('empty')+'<br><small style="opacity:.7">'+t('emptyHint')+'</small></div>';
    return;
  }
  if((state.group[cat]||'date')==='cat'){ el.innerHTML = groupByCat(cat, items); return; }
  const g = {}; items.forEach(i=>{ const b=bucketOf(i); (g[b]=g[b]||[]).push(i); });
  el.innerHTML = BK_ORDER.filter(b=>g[b]).map(b=>
    '<div class="bucket"><div class="bucket-t'+(b==='overdue'?' b-over':b==='today'?' b-today':'')+'">'+
    t('bk.'+b)+' <span style="font-family:var(--ff-fr)">('+g[b].length+')</span></div>'+
    g[b].map(card).join('')+'</div>'
  ).join('');
}
function groupByCat(cat, items){
  const g={}; items.forEach(i=>{ (g[i.sub]=g[i.sub]||[]).push(i); });
  const keys = Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
  return keys.map(k=>{
    const S = SUBS[k]||SUBS.perso;
    const list = g[k].slice().sort((a,b)=>a.date.localeCompare(b.date));
    const key = cat+':'+k;
    const isOpen = !!state.gopen[key];
    const late = list.filter(i=>statusOf(i)==='overdue').length;
    const next = list.find(i=>diffDays(i.date)>=0);
    const sub = (next ? T[state.lang].inDays(diffDays(next.date))+' · '+esc(next.title[state.lang]) : '')
              + (late ? ' · ⚠️ '+late+' '+t('lateLbl') : '');
    return '<div class="cgroup'+(isOpen?' open':'')+'">'+
      '<button class="cg-h" onclick="togGroup(\''+key+'\')">'+
        '<span class="cg-ic" style="background:'+hex(S.c,.14)+'">'+esc(S.ic)+'</span>'+
        '<span class="cg-n">'+esc(S[state.lang])+'<div class="cg-sub">'+sub+'</div></span>'+
        '<span class="cg-c">'+list.length+'</span><span class="cg-ch">▼</span>'+
      '</button>'+
      '<div class="cg-b">'+list.map(card).join('')+'</div></div>';
  }).join('');
}
function togGroup(key){ state.gopen[key]=!state.gopen[key]; render(); }
function setGroup(cat,mode){
  state.group[cat]=mode;
  ['date','cat'].forEach(m=>{
    const b=document.getElementById('gs_'+cat+'_'+m);
    if(b) b.classList.toggle('on', m===mode);
  });
  prefSet(); render();
}

/* --- Carte -------------------------------------------------------------- */
function card(it){
  const st = statusOf(it), dd = diffDays(it.date), d = parse(it.date);
  const S = SUBS[it.sub] || SUBS.perso;
  const list = clOf(it), done = clDone(it);
  const pct = list.length ? Math.round(done.length/list.length*100) : 0;
  const isOpen = !!state.open[it.id];
  const relCls = dd<0?'neg':dd===0?'now':'';
  let h = '<article class="card s-'+st+(dd===0?' is-today':'')+(isOpen?' open':'')+'" id="c_'+cssId(it.id)+'">';
  h += '<button class="card-head" onclick="tog(\''+it.id+'\')">';
  h += '<div class="dchip"><div class="d">'+d.getDate()+'</div><div class="m">'+T[state.lang].months[d.getMonth()].slice(0,4)+'</div></div>';
  h += '<div class="c-main"><h4>'+S.ic+' '+esc(it.title[state.lang])+'</h4><div class="c-meta">';
  h += '<span class="tag" style="background:'+hex(S.c,.14)+';color:color-mix(in srgb,'+S.c+',var(--ink) 42%)">'+S[state.lang]+'</span>';
  h += '<span class="tag time">'+(it.allDay? t('allDay') : it.start+(it.end?'–'+it.end:''))+'</span>';
  h += '<span class="tag rel '+relCls+'">'+T[state.lang].inDays(dd)+'</span>';
  if(list.length) h += '<span class="tag time">📎 '+done.length+'/'+list.length+'</span>';
  h += '</div></div>';
  h += '<span class="pill p-'+st+'">'+t('st.'+st)+'</span><span class="chev">▼</span></button>';

  /* corps */
  h += '<div class="card-body">';
  h += '<div class="sec"><div class="sec-t">📅 '+fmtDayName(it.date)+' • '+fmtDate(it.date)+
       (it.raw? ' &nbsp;·&nbsp; <span class="orgv">'+t('sourceTitle')+' : “'+esc(it.raw)+'”</span>':'')+'</div></div>';
  const orgTxt = it.org ? it.org[state.lang] : S[state.lang];
  h += '<div class="sec"><div class="sec-t">🏷️ '+t('orgLbl')+' : <span class="orgv">'+esc(orgTxt)+'</span></div>'+
       '<div class="row2c">'+
       '<input class="mini" placeholder="'+t('contactPh')+'" value="'+esc(store.contact[it.sk]||'')+'" onchange="setMeta(\'contact\',\''+it.sk+'\',this.value)">'+
       '<input class="mini" placeholder="'+t('placePh')+'" value="'+esc(store.place[it.sk]||'')+'" onchange="setMeta(\'place\',\''+it.sk+'\',this.value)">'+
       '</div></div>';
  if(it.desc){
    const long = it.desc.length>260;
    h += '<div class="sec"><div class="sec-t">📝 '+t('details')+'</div>'+
         '<div class="desc'+(long?' collapsed':'')+'" id="d_'+cssId(it.id)+'">'+esc(it.desc)+'</div>'+
         (long?'<div class="more" onclick="expandDesc(\''+it.id+'\',event)">▾ '+(state.lang==='ar'?'عرض الكل':'Tout afficher')+'</div>':'')+'</div>';
  }
  /* --- ce que Google sait, et qu'on ne montrait pas ---------------------- */
  const gl = [];
  if(it.loc) gl.push(['📍', t('gPlace'), esc(it.loc)]);
  if(it.endDate && it.endDate !== it.date) gl.push(['🗓️', t('gUntil'), esc(fmtDate(it.endDate))]);
  if(it.rap && it.rap.length) gl.push(['⏰', t('gRemind'), esc(fmtRappels(it.rap))]);
  if(it.inv && it.inv.length) gl.push(['👥', t('gGuests'), esc(it.inv.join(' • '))]);
  if(it.pj && it.pj.length) gl.push(['📎', t('gFiles'), esc(it.pj.join(' • '))]);
  if(it.calId) gl.push(['🗂️', t('gCal'), esc(t('cal.'+it.calId))]);
  if(gl.length){
    h += '<div class="sec"><div class="sec-t">🔗 '+t('gInfo')+'</div><div class="ginfo">';
    gl.forEach(g=>{ h += '<div class="grow"><span class="gic">'+g[0]+'</span><span class="glbl">'+g[1]+'</span><span class="gval">'+g[2]+'</span></div>'; });
    h += '</div></div>';
  }
  h += '<div class="sec"><div class="sec-t">✅ '+t('checklist')+'</div>';
  if(list.length) h += '<div class="progress"><i style="width:'+pct+'%"></i></div>';
  h += '<div class="checklist">';
  list.forEach((c,i)=>{
    const on = done.indexOf(c)>=0;
    h += '<label class="chk'+(on?' done':'')+'">'+
         '<input type="checkbox" '+(on?'checked':'')+' onchange="setCheck(TID(\''+it.id+'\'),'+i+',this.checked)">'+
         '<span>'+esc(c)+'</span>'+
         '<span class="del" onclick="event.preventDefault();delCheck(TID(\''+it.id+'\'),'+i+')">✕</span></label>';
  });
  h += '</div><div class="addsub"><input id="as_'+cssId(it.id)+'" placeholder="'+t('addSub')+'" onkeydown="if(event.key===\'Enter\'){addCheck(TID(\''+it.id+'\'),this.value);this.value=\'\'}">'+
       '<button onclick="var e=document.getElementById(\'as_'+cssId(it.id)+'\');addCheck(TID(\''+it.id+'\'),e.value);e.value=\'\'">＋</button></div></div>';

  h += '<div class="sec"><div class="sec-t">🖊️ '+t('notes')+'</div>'+
       '<textarea class="notes" onchange="setNote(\''+it.id+'\',this.value)">'+esc(store.notes[it.id]||'')+'</textarea></div>';

  h += '<div class="acts">';
  h += btn('a-done', st==='done', t('markDone'), it.id, 'done');
  h += btn('a-wait', st==='waiting', t('markWait'), it.id, 'waiting');
  h += btn('a-post', st==='postponed', t('markPost'), it.id, 'postponed');
  h += btn('a-urg',  st==='overdue' && store.status[it.id]==='overdue', t('markUrg'), it.id, 'overdue');
  h += '<button class="act" onclick="setStatus(\''+it.id+'\',null)">'+t('reset')+'</button>';
  const lst=allSections().map(s=>s.id), nxt=lst[(lst.indexOf(catOf(it))+1)%lst.length];
  h += '<button class="act" onclick="moveCat(\''+it.id+'\')">'+t('moveTo')+' '+secName(secById(nxt))+'</button>';
  h += '<a class="act link" href="'+it.link+'" target="_blank" rel="noopener">📅 '+t('openCal')+'</a>';
  h += '</div></div></article>';
  return h;
}
const btn = (cls,on,lbl,id,v) => '<button class="act '+cls+(on?' on':'')+'" onclick="setStatus(\''+id+'\',\''+v+'\')">'+lbl+'</button>';
const cssId = s => s.replace(/[^a-zA-Z0-9]/g,'_');
const TID = id => TASKS.find(x=>x.id===id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hex(c,a){ const n=parseInt(c.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }

/* ============================================================================
   8. ACTIONS
   ============================================================================ */
function tog(id){ const it=TID(id); if(it && !state.boards[catOf(it)]){ state.boards[catOf(it)]=1; applyPanels(); prefSet(); } state.open[id]=!state.open[id]; render(); if(state.open[id]) setTimeout(()=>{const e=document.getElementById('c_'+cssId(id)); if(e) e.scrollIntoView({block:'nearest',behavior:'smooth'});},60); }
/* Les trois appels « AP.sync » ci-dessous remontent la modification vers le
   compte. Sans compte configure, AP.sync n'existe pas et rien ne change :
   l'application hors ligne se comporte exactement comme avant. */
function setStatus(id,v){ if(v===null) delete store.status[id]; else store.status[id]=v; lsSet(); render(); toast(t('toastStatus'));
  if(window.AP&&AP.sync&&AP.sync.setStatus) AP.sync.setStatus(id,v); }

function syncRing(){

  const allClosed = Object.values(state.pan).every(v=>!v)
                 && Object.values(state.boards).every(v=>!v);
  document.querySelector('.wrap').classList.toggle('ring', allClosed);
  const hb = document.getElementById('btnHome');
  if(hb) hb.classList.toggle('hide', allClosed);   /* inutile sur l'accueil */

/* Mesure la rangée « sections principales » et la publie dans --mainsH :
   l'anneau se recentre en dessous, quelle que soit la hauteur réelle des
   cartes (une ligne sur ordinateur, deux sur téléphone). Aucune boucle de
   rétroaction : les cartes sont en position:absolute, leur hauteur ne
   dépend pas de --mainsH. */
function syncMains(){
  const w = document.querySelector('.wrap');
  if(!w) return;
  if(!w.classList.contains('ring')){ w.style.setProperty('--mainsH','0px'); return; }
  const b = document.querySelector('.boards');
  /* 26px = décalage haut des cartes, 34px = respiration avant l'anneau. */
  const h = b ? Math.round(b.getBoundingClientRect().height) : 0;
  /* Deux garde-fous appris a l'usage :
     — on ne laisse pas cette hauteur depasser 60 % de l'ecran, sinon la page
       d'accueil reserve un vide enorme sous l'anneau ;
     — une mesure faite trop tot rend zero ; on garde alors la precedente
       plutot que d'ecraser une bonne valeur par une fausse. */
  const plafond = Math.round(window.innerHeight * 0.6);
  if(h > 0) w.style.setProperty('--mainsH', Math.min(h + 60, plafond) + 'px');
}

/* La hauteur REELLE de la barre du haut. Le navigateur s'en sert pour ne plus
   amener une carte derriere elle quand il fait defiler vers elle (voir la
   regle scroll-padding-top). Elle change avec la langue, la largeur, et selon
   qu'on est sur l'accueil ou dans une section : on la remesure. */
function syncBarre(){
  const t = document.querySelector('.topbar');
  if(!t) return;
  const hh = Math.ceil(t.getBoundingClientRect().height);
  if(hh > 0) document.documentElement.style.setProperty('--tbH', hh + 'px');
}

/* ===========================================================================
   FORMULAIRE D'EVENEMENT — memes champs que Google Agenda / Samsung Calendar.
   Trois sorties : le tableau de bord (local), un lien Google pre-rempli, un
   fichier .ics (Samsung, Outlook, Apple).
   Ce qu'un lien Google TRANSPORTE : titre, debut, fin, journee entiere,
   fuseau, description, lieu, invites, recurrence, occupe/libre.
   Ce qu'il NE transporte PAS : rappels, couleur, visibilite, agenda cible,
   type « tache ». Ces champs-la ne survivent que par le .ics (VALARM) ou par
   l'API. Le .ics est donc la voie complete, le lien la voie rapide.
   =========================================================================== */
const WDAYS = ['SU','MO','TU','WE','TH','FR','SA'];

function addRemRow(method, minutes){
  const box=document.getElementById('aRemBox');
  const d=document.createElement('div');
  d.className='remrow';
  d.innerHTML='<select class="rem-m"><option value="popup">'+t('remPopup')+'</option><option value="email">'+t('remMail')+'</option></select>'+
              '<input type="number" class="rem-n" min="0" value="'+(minutes==null?30:minutes)+'">'+
              '<span class="rem-u">'+t('remBefore')+'</span>'+
              '<button class="tbtn" style="height:30px" onclick="this.parentNode.remove()">✕</button>';
  box.appendChild(d);
  if(method) d.querySelector('.rem-m').value=method;
}
function readReminders(){
  return [...document.querySelectorAll('#aRemBox .remrow')].map(r=>({
    method:r.querySelector('.rem-m').value,
    minutes:Math.max(0, parseInt(r.querySelector('.rem-n').value,10)||0)
  }));
}

/* Recolte le formulaire dans l'objet commun aux deux generateurs. */
function readForm(){
  const g=id=>document.getElementById(id);
  const title=g('aTitle').value.trim();
  if(!title){ g('aTitle').focus(); return null; }
  const all=g('aAllDay').checked;
  const d1=g('aDate').value||iso(today());
  const t1=all?'':(g('aTime').value||'09:00');
  const d2=g('aDateEnd').value||d1;
  const t2=all?'':(g('aTimeEnd').value||'');
  const freq=g('aFreq').value;
  let rrule=null;
  if(freq){
    rrule={freq:freq, interval:Math.max(1,parseInt(g('aInterval').value,10)||1)};
    const days=[...document.querySelectorAll('#aDaysBox input:checked')].map(c=>c.value);
    if(freq==='WEEKLY' && days.length) rrule.byDay=days;
    const u=g('aUntil').value, c=parseInt(g('aCount').value,10);
    if(u) rrule.until=u; else if(c>0) rrule.count=c;
  }
  const guests=g('aGuests').value.split(/[,;\s]+/).map(s=>s.trim()).filter(s=>s.indexOf('@')>0);
  return {
    title:title,
    cat:g('aCat').value, sub:g('aSub').value,
    allDay:all,
    start:all? d1 : d1+'T'+t1,
    end:  all? d2 : (t2? d2+'T'+t2 : ''),
    durationMinutes: (!all && !t2) ? 60 : undefined,
    endInclusive:all,
    timezone:(g('aTz').value||'Africa/Algiers').trim(),
    timeZone:(g('aTz').value||'Africa/Algiers').trim(),
    location:g('aLoc').value.trim(),
    description:g('aNotes').value,
    guests:guests, attendees:guests,
    rrule:rrule,
    recurrence: rrule ? ICS.buildRRULE(rrule,{allDay:all}) : '',
    reminders:readReminders(),
    busy:g('aBusy').value==='1',
    transparency:g('aBusy').value==='1'?'OPAQUE':'TRANSPARENT',
    visibility:g('aVis').value,
    categories:[ (SUBS[g('aSub').value]||{}).fr || g('aSub').value ],
    subs:g('aSubs').value.split('\n').map(s=>s.trim()).filter(Boolean)
  };
}

function exportAllICS(){
  const list=visible().map(it=>{
    const l=clOf(it), d=clDone(it);
    const done=l.length? ('\n\n'+t('checklist')+' : '+d.length+'/'+l.length+'\n'+l.map(x=>(d.indexOf(x)>=0?'[x] ':'[ ] ')+x).join('\n')) : '';

      allDay:it.allDay,
      start: it.allDay? it.date : it.date+'T'+(it.start||'09:00'),

    };
  });

  ICS.downloadICS(ICS.buildICS(list,{}), 'agenda-pro-'+iso(today())+'.ics');

function restoreState(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ try{ store=Object.assign(store,JSON.parse(e.target.result)); lsSet(); buildTasks(); render(); toast(t('toastSaved')); }catch(x){ alert('JSON ✗'); } };
  r.readAsText(f); inp.value='';
}
function dl(txt,name){
  const b=new Blob([txt],{type:'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}

const WX_POS = (function(){ try{ return JSON.parse(localStorage.getItem('agendapro_v1_wx_pos')||'null'); }catch(e){ return null; } })();
const WX_LAT = WX_POS && WX_POS.lat, WX_LON = WX_POS && WX_POS.lon,

/* ---------------------------------------------------------------------------
   GEMINI — conseil et maxime du jour.
   L'ancien code appelait window.claude.complete, qui n'existe QUE dans un
   artefact publie sur claude.ai : depuis un fichier local ou un hebergement,
   l'objet est absent, la fonction sortait immediatement, et la phrase du jour
   restait figee sur la liste locale. D'ou le remplacement par l'API Gemini.

   La cle n'est jamais ecrite dans ce fichier : elle est saisie une fois dans
   le panneau « Sources » et reste dans le localStorage du navigateur. Si la
   page est un jour hebergee, chaque utilisateur saisit la sienne — il n'y a
   rien a voler dans le code source. Pour un vrai produit la cle appartient a
   un serveur : c'est le role de la fonction edge prevue en phase SaaS.
   --------------------------------------------------------------------------- */
const GEM_KEY='agendapro_v1_gemkey', GEM_MODEL_KEY='agendapro_v1_gemmodel';
const GEM_MODEL_DEFAULT='gemini-2.0-flash';
function gemKey(){ try{ return localStorage.getItem(GEM_KEY)||''; }catch(e){ return ''; } }
function gemModel(){ try{ return localStorage.getItem(GEM_MODEL_KEY)||GEM_MODEL_DEFAULT; }catch(e){ return GEM_MODEL_DEFAULT; } }
function setGemKey(v){
  v=(v||'').trim();
  try{ v ? localStorage.setItem(GEM_KEY,v) : localStorage.removeItem(GEM_KEY); }catch(e){}
  if(v){ newDaily(); }
  else { dailyData=null; loadDayCache(); renderBrief(visible()); gemState('', t('gemOff')); }
}
function setGemModel(v){
  v=(v||'').trim();
  try{ v ? localStorage.setItem(GEM_MODEL_KEY,v) : localStorage.removeItem(GEM_MODEL_KEY); }catch(e){}
  if(gemKey()) newDaily();
}
function gemState(cls,msg){
  const e=document.getElementById('gemState'); if(!e) return;
  e.className='gemstate '+(cls||''); e.textContent=msg||'';
}
async function gemini(prompt){
  const k=gemKey(); if(!k) throw new Error('NOKEY');
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+
            encodeURIComponent(gemModel())+':generateContent?key='+encodeURIComponent(k);
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],
      generationConfig:{temperature:1.05,maxOutputTokens:180}})});
  if(!r.ok){
    let d=''; try{ const j=await r.json(); d=(j.error&&j.error.message)||''; }catch(e){}
    throw new Error('HTTP '+r.status+(d? ' - '+d.slice(0,140):''));
  }
  const j=await r.json();
  const c=(j.candidates||[])[0]||{}, parts=((c.content||{}).parts)||[];
  const txt=(parts[0]||{}).text||'';
  if(!txt.trim()) throw new Error('EMPTY');
  return txt.trim();
}
/* Resume compact de la journee, pour que le conseil parle de VOS dossiers
   et non de generalites. */
function dailyContext(){
  const T0=today(), W=addDays(T0,7);
  const live=TASKS.filter(it=>{ const s=statusOf(it); return !it.routine && s!=='done' && s!=='passed'; });
  const late=live.filter(i=>parse(i.date)<T0 && parse(i.date)>=addDays(T0,-60));
  const soon=live.filter(i=>parse(i.date)>=T0 && parse(i.date)<=W)
                 .sort((a,b)=>a.date.localeCompare(b.date));
  const nx=soon[0]||live.filter(i=>parse(i.date)>=T0).sort((a,b)=>a.date.localeCompare(b.date))[0];
  let s='';
  if(nx){
    const l=clOf(nx), d=clDone(nx);
    s='Prochaine echeance: "'+nx.title.fr+'" dans '+diffDays(nx.date)+' jours'+
      (l.length? ' ('+d.length+'/'+l.length+' pieces pretes)':'')+'. ';
  }
  s+='En retard: '+late.length+'. Cette semaine: '+soon.length+'.';
  if(late.length) s+=' Exemple en retard: "'+late[0].title.fr+'".';
  return s;
}
async function fetchDaily(){
  if(!gemKey()){ gemState('', t('gemOff')); return; }
  if(dailyData && dailyData.src==='ai' && dailyData.date===iso(today())){ gemState('ok', t('gemOn')); return; }
  const k = dailyKind(), ctx = dailyContext();
  const AR_TIP = 'انت مساعد تنفيذي. هذه حالة ملفات صاحب مؤسسة صغيرة اليوم:\n'+ctx+
    '\n\nاكتب نصيحة عملية واحدة تخص وضعه هذا تحديدا. جملة واحدة، 20 كلمة كحد اقصى، بالعربية الفصيحة، بدون علامات تنصيص وبدون مقدمات.';
  const AR_WIS = 'اكتب حكمة قصيرة اصيلة عن ادارة الوقت والانتظام في العمل. جملة واحدة، 18 كلمة كحد اقصى، بالعربية الفصيحة، بدون علامات تنصيص وبدون مقدمات. اجعلها غير مالوفة.';
  const FR_TIP = "Tu es un assistant de direction. Voici l'etat des dossiers d'un chef de petite entreprise aujourd'hui :\n"+ctx+
    "\n\nEcris un conseil pratique qui vise precisement cette situation. Une phrase, 20 mots maximum, sans guillemets, sans preambule.";
  const FR_WIS = "Ecris une courte maxime originale sur la gestion du temps et la regularite. Une phrase, 18 mots maximum, sans guillemets, sans preambule. Qu'elle soit inattendue.";
  const p = state.lang==='ar' ? (k==='tip'? AR_TIP : AR_WIS) : (k==='tip'? FR_TIP : FR_WIS);
  const lang = state.lang, day = iso(today());
  gemState('wait', t('gemChecking'));
  try{
    const r = await gemini(p);
    const txt = r.replace(/^[\s"'“«]+|[\s"'”»]+$/g,'').split('\n')[0].trim();
    const arabic = /[؀-ۿ]/.test(txt);
    const okLang = lang==='ar' ? arabic : !arabic;
    if(txt && okLang && state.lang===lang && day===iso(today())){
      dailyData={date:day, kind:k, text:txt, src:'ai', lang:lang};
      try{ localStorage.setItem(DAY_KEY, JSON.stringify(dailyData)); }catch(e){}
      renderBrief(visible()); gemState('ok', t('gemOn'));
    } else {
      gemState('err', t('gemLang'));
    }
  }catch(e){
    /* On affiche le vrai message de Google : c'est lui qui dit si la cle est
       invalide, le quota epuise, ou le nom de modele inconnu. */
    const m=String(e.message||e);
    gemState('err', m==='NOKEY' ? t('gemOff') : (m==='EMPTY' ? t('gemEmpty') : m));
  }
}
function newDaily(){ dailyData=null; localStorage.removeItem(DAY_KEY); loadDayCache(); renderBrief(visible()); fetchDaily(); }

/* Le demarrage passe par le verrou. Deux cas, et deux seulement :
     - AUCUN mot de passe defini : AP.lock.deferBoot appelle init() sur-le-champ.
       Rien ne change, pas une milliseconde de retard.
     - un mot de passe defini : init() attend que le mot de passe ait dechiffre
       les donnees. Le tableau ne se construit donc jamais sur du vide, et il
       n'y a rien a afficher avant.
   Si app/lock/lock.js n'est pas la, DEUX cas bien differents :
     - aucun mot de passe n'a jamais ete defini : on demarre comme avant, le
       programme ne doit pas rester bloque a cause d'un fichier de securite ;
     - un mot de passe EST defini (la fiche du verrou est dans le stockage) :
       on ne demarre surtout PAS. Sans lock.js, le tableau lirait un stockage
       vide, afficherait une page blanche — et la premiere modification
       ecrirait par-dessus, en clair, a cote du coffre. On s'arrete donc net et
       on explique, dans les deux langues. */
if (window.AP && window.AP.lock && window.AP.lock.deferBoot) {
  window.AP.lock.deferBoot(init);
} else {
  let verrouPose = false;
  try { verrouPose = !!localStorage.getItem('agendapro_lock_v1'); } catch(e){}
  if (!verrouPose) init();
  else {
    document.documentElement.classList.add('ap-locked');
    const d = document.createElement('div');
    d.className = 'ap-lock';
    /* L'identifiant compte : la regle de lock.css qui masque la page laisse
       passer #apLock, et rien d'autre. Sans lui, ce message serait cache par
       la regle censee le mettre en avant. */
    d.id = 'apLock';
    /* Habillage minimal ecrit ici meme : si lock.js manque, lock.css manque
       probablement aussi, et ce message doit rester lisible quand meme. */
    d.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-start;'+
      'justify-content:center;padding:22px;overflow:auto;background:var(--bg,#f5f7fa);text-align:center';
    d.innerHTML = '<div class="ap-lock-card" style="max-width:430px;padding:28px;border-radius:18px;'+
      'background:var(--surface,#fff);border:1px solid var(--line,#e3e9f0)"><div class="ap-lock-logo">⚠️</div>'+
      '<h2>app/lock/lock.js</h2>'+
      '<p class="ap-lock-sub">ملف الأمان غير موجود، وبياناتك مشفَّرة به. لا تغيّر شيئاً: '+
      'أعد الملف <b>app/lock/lock.js</b> إلى مكانه وافتح البرنامج من جديد. بياناتك سليمة.</p>'+
      '<p class="ap-lock-foot">Le fichier de securite est absent et vos donnees sont chiffrees avec lui. '+
      'Ne changez rien : remettez <b>app/lock/lock.js</b> a sa place et rouvrez le programme. '+
      'Vos donnees sont intactes.</p></div>';
    document.body.appendChild(d);
  }
}

<!-- ==========================================================================
     AGENDA PRO — app/billing/pricing.html
     LE MORCEAU DE PAGE DE LA BRIQUE VENTE.
     --------------------------------------------------------------------------
     DEUX FACONS DE S'EN SERVIR, exactement comme pour app/auth/auth-ui.html :

     (A) RECOMMANDE — copiez tout ce fichier et collez-le dans index.html,
         juste avant </body>, a la suite du bloc de la brique COMPTES.
         Avantage : cela fonctionne meme quand la page est ouverte
         directement depuis le disque (adresse « file:// »), ou le navigateur
         interdit a une page de lire un fichier voisin.

     (B) Ne rien coller : billing.js tente de telecharger ce fichier et de
         l'inserer lui-meme. Cela ne marche que derriere un vrai serveur web.

     Dans les deux cas billing.js reconnait le bloc a son identifiant
     « apBillRoot » et ne l'ajoute jamais deux fois.

     POURQUOI « data-apbt » ET PAS « data-t » NI « data-apt » ?
     ---------------------------------------------------------
     Trois traducteurs cohabitent dans cette page :
        data-t    appartient a l'application d'origine ;
        data-apt  appartient a la brique COMPTES ;
        data-apbt appartient a la brique VENTE, c'est-a-dire a ce fichier.
     Si deux briques partageaient le meme marqueur, celle qui passe en dernier
     effacerait les textes de l'autre (elle ne connait pas ses cles) et vous
     verriez des libelles vides sans comprendre pourquoi.
        data-apbt      -> le texte de l'element
        data-apbt-ph   -> le texte grise d'un champ de saisie (placeholder)

     Les textes sont VOLONTAIREMENT VIDES ici : billing.js les remplit en
     arabe ou en francais selon la langue de la page. Rien a traduire a la
     main, et rien a retoucher le jour ou vous corrigez une formulation.

     TOUT LE STYLE VIENT DE VOTRE APPLICATION
     ----------------------------------------
     .modal, .modal-in, .modal-h, .modal-b, .modal-f, .fld, .row2, .mb,
     .mb.pri, .tbtn, .note-line : ce sont VOS classes, celles d'index.html.
     billing.js n'ajoute qu'une poignee de classes « apb- » pour ce qui
     n'existe pas encore (la grille de prix, la liste des membres), et elles
     n'utilisent que vos variables de couleur. Il n'y a pas de seconde charte
     graphique dans ce projet.
     ========================================================================== -->

<div id="apBillRoot">

  <!-- ====================================================================
       1. LA PASTILLE D'ABONNEMENT
       billing.js la deplace tout seul dans la barre du haut (.tools), a
       cote de la pastille de compte. Si la barre n'existe pas, elle reste
       flottante : jamais d'ecran blanc, jamais de bouton introuvable.
       Elle est masquee tant qu'on travaille en local (config.js vide) :
       parler d'abonnement a quelqu'un qui n'a pas de compte n'a aucun sens.
       ==================================================================== -->

        <!-- Membres actuels -->
        <div class="apb-card">
          <div class="apb-card-h"><b data-apbt="membersTitle"></b></div>
          <div class="apb-list" id="apbTeamList"></div>
          <div class="apb-hint" data-apbt="membersHelp"></div>
        </div>

        <!-- Les invitations qui me concernent MOI (recues d'une autre
             organisation). Le SQL m'autorise a les voir par mon adresse. -->
        <div class="apb-card" id="apbMyInvCard" hidden>
          <div class="apb-card-h"><b data-apbt="myInvTitle"></b></div>
          <div class="apb-list" id="apbMyInvList"></div>
        </div>

        <div class="apb-msg" id="apbTeamMsg" hidden></div>
      </div>

      <div class="modal-f">
        <button type="button" class="mb" data-apb-close="apbmTeam" data-apbt="close"></button>
      </div>
    </div>
  </div>

</div>


<!-- ==========================================================================
     COUCHE SaaS — comptes, synchronisation, facturation, application mobile.
     L'ORDRE COMPTE : la configuration d'abord, puis le client Supabase, puis
     les briques qui s'en servent. billing.js vient apres auth.js parce qu'il
     lit AP.auth pour savoir qui est connecte.

     TANT QUE app/config.js EST VIDE, RIEN DE TOUT CELA NE S'ACTIVE : aucune
     requete reseau, aucun message dans la console, aucun changement visible.
     Le tableau de bord continue de fonctionner hors ligne sur le localStorage,
     exactement comme avant. C'est la regle que toutes les briques respectent.
     ========================================================================== -->
<script src="app/config.js"></script>
<!-- setup.js vient ICI, entre la configuration et le client Supabase, et
     nulle part ailleurs. Il verse dans window.AP_CONFIG les valeurs saisies
     dans le panneau « Liaison et compte » et gardees dans le localStorage :
     le client Supabase, charge juste apres, les lit comme si elles avaient
     toujours ete dans config.js. Place plus bas, il arriverait trop tard —
     le client aurait deja constate une configuration vide. -->
<script src="app/setup/setup.js"></script>
<script src="app/supabase-client.js"></script>
<script src="app/auth/auth.js"></script>
<!-- L'ORDRE DE CES DEUX LIGNES N'EST PAS NEGOCIABLE : sync.js publie
     window.AP.sync et sa boite a outils interne, migrate.js s'y accroche.
     Charge en premier, migrate.js se desactivait tout seul avec un
     avertissement dans la console, et le transfert des donnees locales vers
     le compte n'etait JAMAIS propose. -->
<script src="app/sync/sync.js"></script>
<script src="app/sync/migrate.js"></script>
<script src="app/billing/billing.js"></script>
<script src="app/pwa/pwa.js"></script>

<!-- ==========================================================================
     LA SYNCHRONISATION PAR GOOGLE AGENDA — LE BUREAU ET LE TELEPHONE.
     --------------------------------------------------------------------------
     POURQUOI CES TROIS LIGNES SONT ICI, ET APRES LES PRECEDENTES.
     L'artisan veut travailler depuis son bureau ET depuis son telephone, et
     retrouver la meme chose des deux cotes. Google Agenda sait deja faire
     voyager les RENDEZ-VOUS entre ses appareils, gratuitement et sans serveur.
     Ce qui ne voyageait pas, c'est ce que l'artisan AJOUTE par-dessus : le
     statut, les documents coches, ses notes, le contact, le lieu. Ces trois
     briques rangent ces annotations DANS le rendez-vous lui-meme, dans un
     casier prive que l'application Google Agenda n'affiche jamais et que
     Google recopie tout seul d'un appareil a l'autre.

     LA COUCHE SUPABASE AU-DESSUS N'EST NI CASSEE NI SUPPRIMEE : elle dort.
     Le jour ou son quota sera regle, elle reviendra A COTE de celle-ci, pas a
     sa place. C'est pour cela que ces lignes viennent APRES et non a la place
     des precedentes : rien n'a ete retire, rien n'a change d'ordre.

     L'ORDRE DE CES TROIS LIGNES N'EST PAS NEGOCIABLE :
       gauth.js   publie AP.gauth   — il obtient le jeton, et lui seul ;
       gsync.js   publie AP.gsync   — il lit et annote, il a besoin de gauth ;
       gbridge.js publie AP.gbridge — il branche les deux au tableau de bord.
     Charge en premier, gbridge ne trouverait ni l'un ni l'autre.

     TANT QUE app/config.js NE CONTIENT PAS DE googleClientId ET QUE L'ARTISAN
     NE S'EST PAS CONNECTE, CES TROIS FICHIERS NE FONT RIEN : aucune requete,
     aucun message dans la console, aucun element ajoute a la page, pas une
     instruction de plus au rendu. Le tableau de bord reste exactement celui
     d'hier, avec ses rendez-vous ecrits dans le fichier.
     ========================================================================== -->
<script src="app/google/gauth.js"></script>
<script src="app/google/gsync.js"></script>
<script src="app/google/gbridge.js"></script>

<!-- ==========================================================================
     LE PONT VERS LA SYNCHRONISATION (app/INTEGRATION.md, brique 2, point 2).
     Pourquoi ici et pas dans le grand bloc de script du haut : `store`, `state`,
     `TASKS` et `SUBS` y sont declares avec let/const. Ces declarations sont
     visibles par TOUS les blocs de script classiques de la page, mais elles
     n'existent pas sur window : aucun fichier externe ne peut les atteindre.
     On les passe donc a la main, depuis un bloc place APRES sync.js —
     sinon window.AP.sync n'existerait pas encore.
     `TASKS` est passe sous forme de fonction parce que buildTasks() fait
     « TASKS = out » : une reference figee vieillirait des le premier rendu.
     Sans compte configure, tout ce bloc reste sans effet.
     ========================================================================== -->
<script>
if (window.AP && AP.sync && typeof AP.sync.bind === 'function') {
  try {
    AP.sync.bind({
      store: store, state: state, lsSet: lsSet,
      buildTasks: buildTasks, render: render, toast: toast,
      TASKS: function () { return TASKS; },
      SUBS: SUBS,
      /* LES SECTIONS ET LES CATEGORIES QUI REDESCENDENT DU COMPTE.
         sync.js ne sait ecrire que dans `store` ; or une section ajoutee a
         store.sections n'apparait a l'ecran qu'apres buildBoardsDOM(), et une
         categorie ajoutee a store.subs n'existe pour le reste du code qu'apres
         mergeSubs(). Ces fonctions sont declarees ici, dans le grand bloc du
         haut, et invisibles depuis un fichier externe : on les passe donc par
         le pont, exactement comme lsSet, buildTasks et render.
         C'est la meme sequence que celle d'addSection() juste au-dessus — si
         elle change la, elle doit changer ici. */
      rebuildBoards: function () {
        mergeSubs();
        buildBoardsDOM();
        applyI18n();
        applyPanels();
        render();
      }
    });
    AP.sync.init();
    /* LE TRANSFERT DES DONNEES LOCALES — ARMER, PAS TENTER SA CHANCE.
       Ici, a la fin de l'analyse du HTML, le client Supabase n'existe pas
       encore : il se fabrique de facon asynchrone, en allant chercher sa
       librairie sur le reseau. Un appel direct a maybeOffer() a cet instant
       ne trouve aucune session et renvoie false, TOUJOURS — c'est exactement
       le bogue qui a fait que le transfert n'a jamais pu demarrer, et que le
       proprietaire s'est connecte sans que ses donnees montent dans son
       compte. arm() pose des ecouteurs et rappelle la proposition quand la
       session est REELLEMENT ouverte (voir app/sync/migrate.js, section 8).
       Le repli sur maybeOffer() ne sert qu'aux copies de migrate.js
       anterieures a ce correctif. */
    if (AP.sync.migrate) {
      if (typeof AP.sync.migrate.arm === 'function') {
        AP.sync.migrate.arm();
      } else if (typeof AP.sync.migrate.maybeOffer === 'function') {
        AP.sync.migrate.maybeOffer();
      }
    }
  } catch (e) {
    /* Le tableau de bord doit demarrer meme si la couche nuage echoue. */
    try { console.warn('[pont AP.sync] ' + (e && e.message)); } catch (e2) {}
  }
}
</script>

<!-- ==========================================================================
     LE PONT VERS GOOGLE AGENDA.
     --------------------------------------------------------------------------
     Meme raison d'etre que le bloc precedent : `store`, `state`, `TASKS` et
     `SUBS` sont declares plus haut avec let/const. Ils sont visibles par tous
     les blocs de script de cette page, mais ils n'existent PAS sur window :
     aucun fichier externe ne peut les atteindre. On les passe donc a la main.

     DEUX DIFFERENCES AVEC LE BLOC PRECEDENT, ET ELLES COMPTENT :

     1. `buildTasks` et `render` sont passes SOUS FORME D'ENVELOPPE
        (function(){ return window.buildTasks(); }) et non directement.
        Pourquoi : app/google/gbridge.js remplace window.buildTasks par une
        version qui, apres coup, fait entrer les rendez-vous de Google dans la
        liste et en retire les doublons. Si on passait ici la fonction elle-
        meme, on figerait la version d'AVANT ce remplacement : le moteur
        Google appellerait l'ancienne, et les doublons reviendraient. Avec
        l'enveloppe, tout le monde appelle toujours la version en cours.

     2. On appelle AP.gbridge.brancher() et LUI SEUL. C'est lui qui repasse le
        meme pont au moteur (AP.gsync.bind) : un seul pont, une seule verite.
        Deux ponts differents seraient deux occasions de diverger.

     Sans googleClientId et sans liaison, ce bloc ne declenche rien du tout.
     ========================================================================== -->
<script>
if (window.AP && AP.gbridge && typeof AP.gbridge.brancher === 'function') {
  try {
    AP.gbridge.brancher({
      store: store, state: state, lsSet: lsSet,
      buildTasks: function () { return window.buildTasks(); },
      render:     function () { return window.render(); },
      toast: toast,
      TASKS: function () { return TASKS; },
      SUBS: SUBS,
      rebuildBoards: function () {
        mergeSubs();
        buildBoardsDOM();
        applyI18n();
        applyPanels();
        render();
      }
    });
  } catch (e) {
    /* Le tableau de bord doit demarrer meme si la couche Google echoue. */
    try { console.warn('[pont Google] ' + (e && e.message)); } catch (e2) {}
  }
}
</script>

</body>
