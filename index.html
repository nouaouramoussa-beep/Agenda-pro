  }
  const orgTxt = it.org ? it.org[state.lang] : S[state.lang];
  h += '<div class="sec"><div class="sec-t">🏷️ '+t('orgLbl')+' : <span class="orgv">'+esc(orgTxt)+'</span></div>'+
       '<div class="row2c">'+
       '<input class="mini" placeholder="'+t('contactPh')+'" value="'+esc(store.contact[it.sk]||'')+'" onchange="setMeta(\'contact\',\''+it.sk+'\',this.value)">'+
       '<input class="mini" placeholder="'+t('placePh')+'" value="'+esc(store.place[it.sk]||'')+'" onchange="setMeta(\'place\',\''+it.sk+'\',this.value)">'+
       '</div></div>';
  if(it.peutEcrireSource && it.notesModifiables!==false){
    h += '<div class="sec"><div class="sec-t">📝 '+t('gDescEdit')+' <span class="orgv">('+t('gWriteHint')+')</span></div>'+
         '<textarea class="notes" onchange="setSrcNote(\''+it.id+'\',this.value)">'+esc(it.desc||'')+'</textarea></div>';
  } else if(it.desc){
    const long = it.desc.length>260;
    h += '<div class="sec"><div class="sec-t">📝 '+t('details')+'</div>'+
         '<div class="desc'+(long?' collapsed':'')+'" id="d_'+cssId(it.id)+'">'+esc(it.desc)+'</div>'+
         (long?'<div class="more" onclick="expandDesc(\''+it.id+'\',event)">▾ '+(state.lang==='ar'?'عرض الكل':'Tout afficher')+'</div>':'')+'</div>';
  }
  /* --- ce que Google sait, et qu'on ne montrait pas ---------------------- */
  const gl = [];
  if(it.loc) gl.push(['📍', t('gPlace'), esc(it.loc)]);
  if(it.endDate && it.endDate !== it.date) gl.push(['🗓️', t('gUntil'), esc(fmtDate(it.endDate))]);
  if(it.rap && it.rap.length) gl.push(['⏰', t('gRemind'), esc(fmtRappels(it.rap))]);
  if(it.inv && it.inv.length) gl.push(['👥', t('gGuests'), esc(it.inv.join(' • '))]);
  if(it.pj && it.pj.length) gl.push(['📎', t('gFiles'), esc(it.pj.join(' • '))]);
  if(it.calId) gl.push(['🗂️', t('gCal'), esc(t('cal.'+it.calId))]);
  /* Google Tasks : tout ce que l'API donne, en lignes, jamais en HTML fourni
     par la source (tout est echappe ici, liens compris). */
  if(it.gtache){
    gl.push(['📅', t('gtEcheance'), it.gDue ? esc(fmtDate(it.gDue)) : t('sansDateLbl')]);
    if(it.gFaitLe) gl.push(['✔️', t('gtFaitLe'), esc(heureLocale(it.gFaitLe))]);
    else if(it.gFaitIci && statusOf(it)==='done') gl.push(['✔️', t('gtFaitLe'), esc(fmtDate(it.gFaitIci))]);
    if(it.gEnAttente) gl.push(['⏳', t('gtAttente'), t('gtAttenteTxt')]);
    if(it.gMaj) gl.push(['🕘', t('gtMaj'), esc(heureLocale(it.gMaj))]);
    if(it.gParent) gl.push(['↳', t('gtParent'), esc(it.gParent.titre)]);
    if(it.gLiens && it.gLiens.length) gl.push(['🔗', t('gtLiens'), it.gLiens.map(l=>lienSur(l.link, l.description||l.type||l.link)).filter(Boolean).join(' • ')]);
    if(it.gAssign) gl.push(['📨', t('gtAssigne'), esc((T[state.lang].gtSurf||{})[it.gAssign.type] || it.gAssign.type || '')+(it.gAssign.lien ? ' '+lienSur(it.gAssign.lien, '↗') : '')]);
  }
  if(gl.length){
    h += '<div class="sec"><div class="sec-t">🔗 '+t(it.gtache ? 'gtInfo' : 'gInfo')+'</div><div class="ginfo">';
    gl.forEach(g=>{ h += '<div class="grow"><span class="gic">'+g[0]+'</span><span class="glbl">'+g[1]+'</span><span class="gval">'+g[2]+'</span></div>'; });
    h += '</div></div>';
  }
  /* Les sous-taches Google : en lecture seule, pour ne pas laisser croire
     qu'une case cochee ici partirait vers Google. Chacune garde aussi sa
     propre carte : rien n'est cache. */
  if(it.gEnfants && it.gEnfants.length){
    h += '<div class="sec"><div class="sec-t">🧩 '+t('gtSous')+'</div><div class="checklist">';
    it.gEnfants.forEach(c=>{
      h += '<label class="chk'+(c.fait?' done':'')+'"><input type="checkbox" disabled '+(c.fait?'checked':'')+'><span>'+esc(c.titre)+'</span></label>';
    });
    h += '</div></div>';
  }
  h += '<div class="sec"><div class="sec-t">✅ '+t('checklist')+'</div>';
  if(list.length) h += '<div class="progress"><i style="width:'+pct+'%"></i></div>';
  h += '<div class="checklist">';
  list.forEach((c,i)=>{
    const on = done.indexOf(c)>=0;
    h += '<label class="chk'+(on?' done':'')+'">'+
         '<input type="checkbox" '+(on?'checked':'')+' onchange="setCheck(TID(\''+it.id+'\'),'+i+',this.checked)">'+
         '<span>'+esc(c)+'</span>'+
         '<span class="del" onclick="event.preventDefault();delCheck(TID(\''+it.id+'\'),'+i+')">✕</span></label>';
  });
  h += '</div><div class="addsub"><input id="as_'+cssId(it.id)+'" placeholder="'+t('addSub')+'" onkeydown="if(event.key===\'Enter\'){addCheck(TID(\''+it.id+'\'),this.value);this.value=\'\'}">'+
       '<button onclick="var e=document.getElementById(\'as_'+cssId(it.id)+'\');addCheck(TID(\''+it.id+'\'),e.value);e.value=\'\'">＋</button></div></div>';

  h += '<div class="sec"><div class="sec-t">🖊️ '+t('notes')+'</div>'+
       '<textarea class="notes" onchange="setNote(\''+it.id+'\',this.value)">'+esc(store.notes[it.id]||'')+'</textarea></div>';

  h += '<div class="acts">';
  h += btn('a-done', st==='done', t('markDone'), it.id, 'done');
  h += btn('a-wait', st==='waiting', t('markWait'), it.id, 'waiting');
  h += btn('a-post', st==='postponed', t('markPost'), it.id, 'postponed');
  h += btn('a-urg',  st==='overdue' && store.status[it.id]==='overdue', t('markUrg'), it.id, 'overdue');
  h += '<button class="act" onclick="setStatus(\''+it.id+'\',null)">'+t('reset')+'</button>';
  if(it.manual) h += '<button class="act" onclick="delCustom(\''+it.id+'\')">🗑 '+t('delTask')+'</button>';
  if(it.manual && gcalDispo()) h += '<button class="act" id="pg_'+cssId(it.id)+'"'+(POUSSE_EN_COURS[it.id]?' disabled':'')+' onclick="pousserVersGoogle(\''+it.id+'\')">'+(POUSSE_EN_COURS[it.id]?t('enCours'):t('pushG'))+'</button>';
  if(gWritable && !(state.edit && state.edit[it.id])) h += '<button class="act" onclick="togEditG(\''+it.id+'\')">'+t('gEditBtn')+'</button>';
  const lst=secsPour(it).map(s=>s.id), nxt=lst[(lst.indexOf(catOf(it))+1)%lst.length];
  h += '<button class="act" onclick="moveCat(\''+it.id+'\')">'+t('moveTo')+' '+esc(secName(secById(nxt)))+'</button>';
  if(it.link) h += '<a class="act link" href="'+esc(it.link)+'" target="_blank" rel="noopener">'+(it.gtache ? '✅ '+t('openTasks') : '📅 '+t('openCal'))+'</a>';
  h += '</div></div></article>';
  return h;
}
const btn = (cls,on,lbl,id,v) => '<button class="act '+cls+(on?' on':'')+'" onclick="setStatus(\''+id+'\',\''+v+'\')">'+lbl+'</button>';
const cssId = s => s.replace(/[^a-zA-Z0-9]/g,'_');
const TID = id => TASKS.find(x=>x.id===id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Un horodatage RFC 3339 (Google) en date + heure LOCALES : couper la chaine
   donnerait le jour UTC, qui n'est pas celui de l'artisan entre minuit et 1 h. */
function heureLocale(ts){ const x=new Date(ts); return isNaN(x) ? '' : fmtDate(iso(x))+' '+pad(x.getHours())+':'+pad(x.getMinutes()); }
/* Un lien venu d'une source exterieure : seulement http(s) ou mailto, et tout
   echappe. Le reste n'est pas un lien. */
function lienSur(url, lbl){ const u=String(url||''); return /^(https?:|mailto:)/i.test(u) ? '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(lbl||u)+'</a>' : ''; }
function hex(c,a){ const n=parseInt(c.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }

/* ============================================================================
   8. ACTIONS
   ============================================================================ */
function tog(id){ const it=TID(id); if(it && !state.boards[catOf(it)]){ state.boards[catOf(it)]=1; applyPanels(); prefSet(); } state.open[id]=!state.open[id]; render(); if(state.open[id]) setTimeout(()=>{const e=document.getElementById('c_'+cssId(id)); if(e) e.scrollIntoView({block:'nearest',behavior:'smooth'});},60); }
/* Les trois appels « AP.sync » ci-dessous remontent la modification vers le
   compte. Sans compte configure, AP.sync n'existe pas et rien ne change :
   l'application hors ligne se comporte exactement comme avant. */
function setStatus(id,v){ if(v===null) delete store.status[id]; else store.status[id]=v; lsSet(); render(); toast(t('toastStatus'));
  if(window.AP&&AP.sync&&AP.sync.setStatus) AP.sync.setStatus(id,v); }
function setNote(id,v){ store.notes[id]=v; lsSet();
  if(window.AP&&AP.sync&&AP.sync.setNote) AP.sync.setNote(id,v); }
/* Ces deux-la ne touchent aucun stockage local : le titre et la note "source"
   d'une tache venue de Google Tasks vivent chez gtasks.js (TACHES), pas dans
   store. Sans effet si la tache ne vient pas de la avec l'ecriture activee. */
function setSrcTitle(id,v){ if(window.AP&&AP.gtasks&&AP.gtasks.ecrireTitre) AP.gtasks.ecrireTitre(id,v); }
function setSrcNote(id,v){ if(window.AP&&AP.gtasks&&AP.gtasks.ecrireNote) AP.gtasks.ecrireNote(id,v); }
function setMeta(kind,sk,v){ store[kind][sk]=v; lsSet(); toast(t('toastSaved')); }
/* Une tache ajoutee a la main ne pouvait ni etre supprimee ni corrigee : elle
   restait a vie. */
function delCustom(id){
  if(!confirm(t('delTaskQ'))) return;
  oublierCustom(id);
  lsSet(); buildTasks(); render(); toast(t('toastSaved'));
  if(window.AP&&AP.sync&&AP.sync.deleteTask) AP.sync.deleteTask(id);
}
/* Retire une tache ajoutee a la main ET tout ce qui s'y rattache. */
function oublierCustom(id){
  store.custom = store.custom.filter(c=>c.id!==id);
  ['status','notes','checks','cat','subOf','titleOf'].forEach(k=>{ if(store[k]) delete store[k][id]; });
  ['contact','place'].forEach(k=>{ if(store[k]) delete store[k]['c:'+id]; });
  delete state.open[id];
}
/* Change la section d'une tache.
   - cible absente : la section SUIVANTE (l'ancien bouton « ⇄ », qui marche
     avec deux sections comme avec dix) ;
   - cible = un id de section : celle-la, choisie dans la liste de la carte ;
   - cible = '' : on oublie le choix fait sur CETTE tache (elle reprend celui
     de sa serie, ou celui de sa source).
   Les briques (gsync, gtasks, mbridge) enveloppent cette fonction et relisent
   store.cat[id] apres coup : le choix suit sur les autres appareils.
   silencieux : sans dessin ni message (appel en serie). */
function moveCat(id, cible, silencieux){
  const it=TID(id); if(!it) return;
  const list=secsPour(it).map(s=>s.id);
  if(cible===''){ delete store.cat[id]; }
  else if(cible===undefined || cible===null){ const i=list.indexOf(catOf(it)); store.cat[id]=list[(i+1)%list.length]; }
  else if(list.indexOf(cible)>=0){ store.cat[id]=cible; }
  else return;
  lsSet();
  if(silencieux) return;
  /* on suit la carte : le cadre d'arrivee s'ouvre, la carte reste depliee,
     et l'ecran y va — au lieu de la voir disparaitre sans autre trace */
  const ou=catOf(it);
  state.boards[ou]=1; state.open[id]=true; applyPanels(); prefSet();
  render(); toast(t('toastMoved')+' — '+secName(secById(ou)));
  setTimeout(()=>{ const e=document.getElementById('c_'+cssId(id)); if(e) e.scrollIntoView({block:'start',behavior:'smooth'}); },60);
}
/* La categorie (SUBS) d'une tache existante. v vide : on revient a celle de
   la source. gsync enveloppe cette fonction (casier : suit sur le
   telephone). */
function setSub(id, v, silencieux){
  store.subOf = store.subOf||{};
  if(v && SUBS[v]) store.subOf[id]=v; else delete store.subOf[id];
  lsSet();
  if(silencieux) return;
  render(); toast(t('toastSub'));
}
/* Les repetitions d'un meme rendez-vous (meme it.sk) presentes en ce moment. */
function serieDe(it){ return (it && it.sk) ? TASKS.filter(x=>x.sk===it.sk) : (it ? [it] : []); }
/* Un rendez-vous Google qui se repete : son choix « toutes les repetitions »
   s'ecrit UNE fois chez Google, sur l'evenement maitre (gsync.sectionSerie),
   et suit donc sur le telephone. */
function serieGoogle(it){ return !!(it && it.src==='google' && !it.gtache && it.gRec && !it.gRO && window.AP && AP.gsync && AP.gsync.sectionSerie); }
/* La liaison Google attend une reconnexion : un geste qui ecrit dans Google
   ne part pas (il partirait des heures plus tard, par-dessus ce qui a change
   entre-temps). On le dit. */
function liaisonPrete(){
  try{ if(window.AP&&AP.gauth&&typeof AP.gauth.etat==='function'&&AP.gauth.etat().besoinReconnexion){ toast(t('errLiaison')); return false; } }catch(e){}
  return true;
}
/* TOUTE la serie. Rendez-vous Google repete : une ecriture sur le maitre.
   Autre serie (agenda ecrit dans le programme, Microsoft) : le choix est
   range par serie (store.catSk / subSk) et vaut aussi pour les occurrences
   pas encore chargees ; les choix faits occurrence par occurrence s'effacent
   devant lui. */
let SERIE_EN_COURS=false;
async function secSerie(id, v){
  const it=TID(id); if(!it || !it.sk) return;
  if(secsPour(it).map(s=>s.id).indexOf(v)<0) return;
  if(serieGoogle(it)){
    if(SERIE_EN_COURS){ toast(t('serieEnCours')); render(); return; }
    if(!liaisonPrete()){ render(); return; }
    SERIE_EN_COURS=true; toast(t('enCours'));
    try{
      if(!(await permisAgenda())){ toast(t('gNoWrite')); return; }
      await AP.gsync.sectionSerie(id, v);
      state.boards[v]=1; state.open[id]=true; applyPanels(); prefSet(); render();
      toast(t('toastSerie')+' — '+secName(secById(v)));
    }catch(e){ toast(t('gEditKo').replace('%1', errMsg(e))); render(); }
    finally{ SERIE_EN_COURS=false; }
    return;
  }
  store.catSk = store.catSk||{}; store.catSk[it.sk]=v;
  serieDe(it).forEach(x=>{ if(store.cat[x.id]!==undefined) moveCat(x.id,'',true); });
  lsSet(); state.boards[v]=1; state.open[id]=true; applyPanels(); prefSet(); render();
  toast(t('toastSerie')+' — '+secName(secById(v)));
}
async function subSerie(id, v){
  const it=TID(id); if(!it || !it.sk || !SUBS[v]) return;
  if(serieGoogle(it)){
    if(SERIE_EN_COURS){ toast(t('serieEnCours')); render(); return; }
    if(!liaisonPrete()){ render(); return; }
    SERIE_EN_COURS=true; toast(t('enCours'));
    try{
      if(!(await permisAgenda())){ toast(t('gNoWrite')); return; }
      await AP.gsync.sousCatSerie(id, v);
      render(); toast(t('toastSerie'));
    }catch(e){ toast(t('gEditKo').replace('%1', errMsg(e))); render(); }
    finally{ SERIE_EN_COURS=false; }
    return;
  }
  store.subSk = store.subSk||{}; store.subSk[it.sk]=v;
  serieDe(it).forEach(x=>{ if(store.subOf && store.subOf[x.id]!==undefined) setSub(x.id,'',true); });
  lsSet(); render(); toast(t('toastSerie'));
}
function choisirSection(id, v){ if(serieCochee(id)) secSerie(id, v); else moveCat(id, v); }
function choisirCategorie(id, v){ if(serieCochee(id)) subSerie(id, v); else setSub(id, v); }
/* La case « toutes les repetitions » : son etat est garde (state.serieCase),
   il survit aux redessins de la carte, et la cocher N'ECRIT RIEN — c'est le
   choix suivant (section, categorie, nom) qui s'applique a toute la serie. */
function caseSerie(id, on){
  state.serieCase=state.serieCase||{};
  if(on) state.serieCase[id]=true; else delete state.serieCase[id];
}
function serieCochee(id){ return !!(state.serieCase && state.serieCase[id]); }
/* LE NOM D'UNE TACHE EXISTANTE, garde DANS LE PROGRAMME : pour ce qui ne
   peut pas etre ecrit a la source (agenda en dur, Microsoft, agenda Google
   en lecture seule). Par tache, ou par serie. Applique a chaque dessin
   (appliquerNoms), le nom d'origine garde a cote (__t0). */
function setNomLocal(id, v){
  const it=TID(id); if(!it) return;
  v=String(v||'').trim();
  const serie=!!(serieCochee(id) && it.sk);
  const orig=(it.__t0||it.title)[state.lang];
  store.titleOf=store.titleOf||{}; store.titleSk=store.titleSk||{};
  if(serie){
    if(v && v!==orig) store.titleSk[it.sk]=v; else delete store.titleSk[it.sk];
    serieDe(it).forEach(x=>{ delete store.titleOf[x.id]; });
  } else {
    /* v vide ou egal a l'origine : cette occurrence reprend son nom d'origine
       — meme si la serie porte un autre nom (on le garde alors en propre). */
    if(v && v!==orig) store.titleOf[id]=v;
    else if(it.sk && store.titleSk[it.sk]) store.titleOf[id]=orig;
    else delete store.titleOf[id];
  }
  lsSet(); render(); toast(t('toastSaved'));
}
/* « ↺ الاسم الأصلي » : cette occurrence seulement, sauf si la case « toutes
   les repetitions » est cochee (alors toute la serie). */
function nomOrigine(id){
  const it=TID(id); if(!it) return;
  const serie=!!(serieCochee(id) && it.sk);
  store.titleOf=store.titleOf||{}; store.titleSk=store.titleSk||{};
  const orig=(it.__t0||it.title)[state.lang];
  if(serie){
    delete store.titleSk[it.sk];
    serieDe(it).forEach(x=>{ delete store.titleOf[x.id]; });
  } else if(it.sk && store.titleSk[it.sk]){
    store.titleOf[id]=orig;
  } else {
    delete store.titleOf[id];
  }
  lsSet(); render();
}
function appliquerNoms(){
  const to=store.titleOf||{}, ts=store.titleSk||{};
  const rien=!Object.keys(to).length && !Object.keys(ts).length;
  TASKS.forEach(it=>{
    if(rien && !it.__t0) return;
    const v = to[it.id] || (it.sk && ts[it.sk]) || '';
    const o = (it.__t0||it.title)[state.lang];
    if(v && v!==o){ if(!it.__t0) it.__t0=it.title; it.title={ar:v, fr:v}; }
    else if(it.__t0){ it.title=it.__t0; delete it.__t0; }
  });
}
/* Le nom d'une tache ajoutee a la main : c'est sa propre donnee. */
function renameCustom(id, v){
  v=String(v||'').trim();
  const c=store.custom.find(x=>x.id===id);
  if(!c || !v){ render(); return; }
  c.title=v; if(c.ev) c.ev.title=v;
  lsSet(); buildTasks(); render(); toast(t('toastSaved'));
  if(window.AP&&AP.sync&&AP.sync.setTaskFields) AP.sync.setTaskFields(id,{title:v});
}
/* L'echeance d'une tache Google Tasks (gtasks.js : file, attente, conflit).
   Envoyee a la sortie du champ (pas a chaque chiffre tape). */
function setSrcDue(id,v){ if(window.AP&&AP.gtasks&&AP.gtasks.ecrireEcheance) return AP.gtasks.ecrireEcheance(id,v); }

/* ---- GOOGLE AGENDA : ecrire depuis le programme ---------------------------
   La permission d'ecrire est demandee au moment du geste, jamais avant. Le
   jeton que gsync garde en memoire ne la porte pas encore : on le lui fait
   oublier, le suivant la portera. */
async function permisAgenda(){
  if(!(window.AP&&AP.gauth&&typeof AP.gauth.etat==='function')) return true;
  if(AP.gauth.etat().peutEcrire) return true;
  if(typeof AP.gauth.demanderEcriture!=='function') return false;
  let ok=false; try{ ok=await AP.gauth.demanderEcriture(); }catch(e){ ok=false; }
  if(ok && AP.gsync && AP.gsync.oublierJeton) AP.gsync.oublierJeton();
  return !!ok;
}
function gcalDispo(){
  try{ return !!(window.AP&&AP.gsync&&AP.gsync.creerTache&&AP.gsync.agendaPourEcrire&&AP.gsync.info().connecte&&AP.gsync.agendaPourEcrire()); }
  catch(e){ return false; }
}
function nomAgendaG(id){
  try{ const a=(AP.gsync.agendas()||[]).find(x=>x.id===id); return a ? a.nom : id; }catch(e){ return id; }
}
/* Un message lisible, dans la langue de l'ecran — jamais le texte technique
   (francais ou anglais) d'une brique ou de Google. */
/* « لم يُحفظ في Google: … » — sauf quand on ne SAIT pas (reponse perdue) :
   dire « pas enregistre » pousserait a recreer. */
function msgCreation(e){
  const c=e&&e.code;
  if(c==='incertainG' || c==='incertain') return errMsg(e);
  return t('gCreateKo').replace('%1', errMsg(e));
}
function errMsg(e){
  const c=e&&e.code;
  const M={agenda:'errAgenda', date:'errDate', trop:'errTrop', titre:'errTitre', serie:'gSerieDate',
           conflit:'errConflitDesc', ro:'gRO', disparu:'errDisparu', incertainG:'errIncertainG'};
  if(c && M[c]) return t(M[c]);
  /* gtasks.js fabrique deja ses messages traduits (crea_*) */
  if(c && e.message) return e.message;
  try{ console.warn('[Agenda Pro] erreur Google :', e); }catch(x){}
  if(e && (e.jeton || e.name==='AP_SANS_JETON' || e.auth)) return t('errLiaison');
  if(e && e.statut===403 && /ratelimit|quota|dailylimit|usagelimit/i.test(JSON.stringify(e.data||{}))) return t('errGoogle');
  if(e && e.statut===403) return t('errDroit');
  if(e && (e.name==='TypeError' || (typeof navigator!=='undefined' && navigator.onLine===false))) return t('errReseau');
  return t('errGoogle');
}
/* LE BLOC « تعديل » : ce qui y est tape est garde a part (brouillon) jusqu'a
   « حفظ » ou « إلغاء » — un redessin de la carte (relecture Google, geste sur
   une autre partie de la carte) ne l'efface plus. */
function togEditG(id){
  state.edit=state.edit||{}; state.gDraft=state.gDraft||{};
  state.edit[id]=!state.edit[id];
  /* A l'ouverture : la description telle que l'artisan la voit MAINTENANT.
     C'est elle qu'on compare a Google au moment d'enregistrer — une relecture
     pendant qu'il tape ne doit pas deplacer la reference. */
  if(state.edit[id]){ const it=TID(id); state.gDraft[id]={descBase:(it&&it.gDescH)||''}; }
  else delete state.gDraft[id];
  state.open[id]=true; render();
}
const GESV_EN_COURS={};
function gDraft(id, champ, v){ state.gDraft=state.gDraft||{}; (state.gDraft[id]=state.gDraft[id]||{})[champ]=v; }
function geJour(k,on){ ['geh_','gehf_'].forEach(p=>{ const e=document.getElementById(p+k); if(e) e.style.display=on?'none':''; }); }
/* Changer la date de DEBUT fait suivre la date de fin (meme duree), tant que
   l'artisan n'a pas touche la fin lui-meme. */
function geDebut(id, k, v){
  const it=TID(id); if(!it || !v) return;
  const f=document.getElementById('gedf_'+k); if(!f) return;
  const d0=state.gDraft&&state.gDraft[id]||{};
  if(d0.finTouchee) return;
  const ecart=Math.round((parse(it.endDate||it.date)-parse(it.date))/86400000);
  f.value=iso(addDays(parse(v), Math.max(0,ecart)));
  gDraft(id,'dateFin',f.value);
}
/* Enregistre dans Google ce qui a CHANGE dans le bloc « تعديل » d'un
   rendez-vous Google. forcer : c'est l'artisan qui corrige un rendez-vous,
   meme ecrit a la main dans Google — voir gsync.modifierTache. */
const normTxt = s => String(s||'').replace(/\r\n?/g,'\n').replace(/^\n+/,'').replace(/\s+$/,'');
async function saveEditG(id){
  const it=TID(id); if(!it || !(window.AP&&AP.gsync&&AP.gsync.modifierTache)) return;
  const k=cssId(id), g=p=>document.getElementById(p+k);
  const b=g('gesv_'); if(!b || b.disabled || GESV_EN_COURS[id]) return;
  const titre=g('get_').value.trim();
  if(!titre){ toast(t('errTitre')); g('get_').focus(); return; }
  const tout=g('gea_').checked, d1=g('ged_').value, h1=tout?'':g('geh_').value, h2=tout?'':g('gehf_').value;
  let d2=g('gedf_').value||d1;
  const lieu=g('gel_').value.trim(), desc=g('gen_').value;
  const serie=!!(g('ges_') && g('ges_').checked);
  const champs={};
  if(titre!==String(it.raw||'').trim()) champs.titre=titre;
  if(lieu!==String(it.loc||'').trim()) champs.lieu=lieu;
  const dr0=(state.gDraft&&state.gDraft[id])||{};
  const base=dr0.descBase!==undefined ? dr0.descBase : (it.gDescH||'');
  if(dr0.desc!==undefined && normTxt(desc)!==normTxt(base)){ champs.desc=desc; champs.descAvant=base; }
  /* debut deplace, fin laissee telle quelle : la fin suit (meme duree) —
     sinon le rendez-vous s'etalerait sur plusieurs jours dans Google */
  const fin0=it.endDate||it.date;
  if(d1 && d1!==it.date && d2===fin0 && !dr0.finTouchee){
    const ecart=Math.round((parse(fin0)-parse(it.date))/86400000);
    d2=iso(addDays(parse(d1), Math.max(0,ecart)));
  }
  if(d2<d1) d2=d1;
  const dateChangee = (!!tout)!==(!!it.allDay) || d1!==it.date || d2!==fin0 || (!tout && (h1!==(it.start||'') || h2!==(it.end||'')));
  if(dateChangee){
    if(!d1 || (!tout && !h1)){ toast(t('errDate')); return; }
    let fuseau='Africa/Algiers';
    try{ fuseau=Intl.DateTimeFormat().resolvedOptions().timeZone||fuseau; }catch(e){}
    /* heure de fin avant l'heure de debut le meme jour : +1 h (comme Google) */
    const h2b = (!tout && d2===d1 && h2 && h2<=h1) ? '' : h2;
    Object.assign(champs,{date:d1, dateFin:d2, heure:h1, fin:h2b, fuseau:fuseau});
  }
  if(!Object.keys(champs).length){ toast(t('gEditRien')); return; }
  if(serie && Object.keys(champs).some(c=>c!=='titre' && c!=='lieu')){ toast(t('gSerieDate')); return; }
  if(!liaisonPrete()) return;
  b.disabled=true; const lbl=b.textContent; b.textContent=t('enCours'); GESV_EN_COURS[id]=1;
  try{
    if(!(await permisAgenda())){ toast(t('gNoWrite')); return; }
    await AP.gsync.modifierTache(id, champs, {explicite:true, forcer:true, serie:serie});
    state.edit[id]=false; if(state.gDraft) delete state.gDraft[id];
    toast(t('gEditOk')); render();
  }catch(e){
    /* coupure APRES l'envoi : la modification a pu arriver — ne pas dire
       « rien n'est parti » */
    const incertain = e && e.name==='TypeError' && !e.avantEnvoi && !(typeof navigator!=='undefined' && navigator.onLine===false);
    toast(incertain ? t('errIncertainModif') : t('gEditKo').replace('%1', errMsg(e)));
  }
  finally{ delete GESV_EN_COURS[id]; b.disabled=false; b.textContent=lbl; render(); }
}
/* Une tache ajoutee a la main AVANT (elle n'existe que sur cet appareil)
   part dans Google Agenda : UN rendez-vous, tel qu'on le voit ici (sa date,
   son heure), avec sa section, sa categorie, son statut, sa note et sa
   liste. Pas sa repetition ni ses invites : en local ce n'etait qu'une seule
   tache, et ses invites n'ont jamais rien recu — les reactiver en silence
   ferait apparaitre le rendez-vous chez eux. La copie locale n'est retiree
   qu'une fois Google d'accord, et seulement si le rendez-vous revient bien a
   l'ecran. */
const POUSSE_EN_COURS={};
async function pousserVersGoogle(id){
  const c=store.custom.find(x=>x.id===id); if(!c) return;
  if(POUSSE_EN_COURS[id]) return;
  if(!gcalDispo()){ toast(t('errAgenda')); return; }
  if(!liaisonPrete()) return;
  try{
    const w=AP.gsync.fenetre ? AP.gsync.fenetre() : null;
    if(w && (c.date<w.debut || c.date>w.fin)){ toast(t('errHorsFenetre')); return; }
  }catch(e){}
  if(!confirm(t('pushGQ'))) return;
  POUSSE_EN_COURS[id]=1;
  const bt=document.getElementById('pg_'+cssId(id)); if(bt){ bt.disabled=true; bt.textContent=t('enCours'); }
  try{
    if(!(await permisAgenda())){ toast(t('gNoWrite')); return; }
    const ev=c.ev||{}, it=TID(id)||{};
    const ch=store.checks[id]||null;
    const liste=(ch && ch.list) ? ch.list.slice() : (c.subs||[]).slice();
    /* la date et l'heure telles que la carte les montre (c.date/c.time,
       tenues a jour), la fin d'origine si elle existe le meme jour */
    const fin0 = (!!c.time && String(ev.end||'').slice(0,10)===c.date) ? String(ev.end).slice(11,16) : '';
    const o={
      titre:c.title, date:c.date, heure:c.time||'', dateFin:c.date, fin:(fin0 && fin0>c.time)?fin0:'',
      fuseau:ev.timeZone||'Africa/Algiers', desc:c.notes||'', lieu:ev.location||'',
      rappels:ev.reminders, occupe:ev.busy, visibilite:ev.visibility,
      sec:catOf(it)||c.cat, sub:subOf(it)||c.sub,
      statut:store.status[id]||'', notes:store.notes[id]||'', liste:liste, coches:(ch&&ch.done)||[],
      ct:store.contact['c:'+id]||'', pl:store.place['c:'+id]||''
    };
    /* un identifiant FIXE pour cette tache : la renvoyer apres une reponse
       perdue retrouve le rendez-vous deja cree (pas de doublon) */
    if(AP.gsync.idPour) o.id=AP.gsync.idPour(id);
    const r=await AP.gsync.creerTache(o);
    if(r && (r.id || r.repetition) && !r.horsFenetre){
      oublierCustom(id); lsSet(); buildTasks(); render(); toast(t('pushGOk'));
      if(window.AP&&AP.sync&&AP.sync.deleteTask) AP.sync.deleteTask(id);
    } else {
      /* cree chez Google mais hors de ce que le programme montre : on garde
         la copie locale plutot que de la faire disparaitre */
      toast(t('errHorsFenetre'));
    }
  }catch(e){ toast(msgCreation(e)); }
  finally{ delete POUSSE_EN_COURS[id]; render(); }
}
/* L'objet du formulaire (readForm) dans la forme que gsync.creerTache lit. */
function versGoogle(ev){
  const all=!!ev.allDay, st=String(ev.start||''), en=String(ev.end||'');
  return {
    titre:ev.title, date:st.slice(0,10), heure:all?'':st.slice(11,16),
    dateFin:en?en.slice(0,10):'', fin:(!all && en.length>10)?en.slice(11,16):'',
    fuseau:ev.timeZone||'Africa/Algiers', desc:ev.description||'', lieu:ev.location||'',
    repetition:ev.recurrence||'', rappels:ev.reminders, occupe:ev.busy,
    visibilite:ev.visibility, invites:ev.guests||[],
    sec:ev.cat, sub:ev.sub, liste:(ev.subs||[]).slice()
  };
}
function expandDesc(id,e){ e.stopPropagation(); const d=document.getElementById('d_'+cssId(id)); if(d){ d.classList.toggle('collapsed'); } }
function jumpTo(id){ const it=TID(id); if(it){ state.boards[catOf(it)]=1; applyPanels(); prefSet(); } state.open[id]=true; render(); setTimeout(()=>{const e=document.getElementById('c_'+cssId(id)); if(e) e.scrollIntoView({block:'center',behavior:'smooth'});},80); }
function toggleRoutine(){ state.routine=!state.routine; state.routineChoisi=true; syncUI(); prefSet(); render(); }
/* La recherche attend un quart de seconde apres la derniere lettre avant de
   redessiner : taper un mot de six lettres ne coute plus six rendus complets. */
let qT;
function chercher(v){ state.q=v; clearTimeout(qT); qT=setTimeout(render,250); }
function setWin(w){ state.win=w; state.selDay=null; document.getElementById('rangeBox').classList.toggle('show', w==='custom'); syncUI(); prefSet(); render(); }
function applyCustom(){
  const dF=document.getElementById('dFrom'), dT=document.getElementById('dTo');
  let a=dF.value, b=dT.value;
  /* une seule date = ce jour-la, tout seul ; deux dates a l'envers = remises
     dans l'ordre. L'artisan ne doit jamais rester devant une liste vide sans
     savoir pourquoi. */
  if(a && !b){ b=a; dT.value=b; } else if(b && !a){ a=b; dF.value=a; }
  if(!(a && b)) return;
  if(a>b){ const x=a; a=b; b=x; dF.value=a; dT.value=b; }
  setCustom(a,b);
}
/* Cale la periode sur deux dates precises, cases remplies, puce allumee. */
function setCustom(a,b){
  const dF=document.getElementById('dFrom'), dT=document.getElementById('dTo');
  if(dF) dF.value=a; if(dT) dT.value=b;
  state.from=a; state.to=b; state.win='custom'; state.selDay=null;
  syncUI(); prefSet(); render();
}

function togPanel(k){
  state.pan[k] = state.pan[k] ? 0 : 1;
  document.getElementById('pan_'+k).classList.toggle('collapsed', !state.pan[k]);
  syncRing(); prefSet();
  /* Bulle des filtres refermee avec un jour choisi dans la bande : plus aucun
     temoin visible de ce filtre — on l'oublie, la liste revient a la periode. */
  if(k==='filters' && !state.pan[k] && state.selDay){ state.selDay=null; syncUI(); render(); }
  /* Le pied s'ouvre tout en bas : on l'amene sous les yeux. */
  if(k==='foot' && state.pan[k]){ const e=document.getElementById('pan_foot'); if(e) setTimeout(function(){ e.scrollIntoView({block:'end',behavior:'smooth'}); }, 60); }
}
function togOrb(){ togPanel('alerts'); renderAlerts(); }
function togBoard(cat){
  state.boards[cat] = state.boards[cat] ? 0 : 1;
  const el = document.getElementById('pan_b_'+cat);
  if(el){ el.classList.toggle('open', !!state.boards[cat]);
          el.classList.toggle('closed', !state.boards[cat]); }
  syncRing(); prefSet(); render();
}
function syncRing(){
  /* Générique : parcourt les clés au lieu de les énumérer, pour que des
     sections ajoutées par l'utilisateur soient prises en compte d'office. */
  /* Seulement les cadres qui EXISTENT : celui de Google Tasks peut etre
     memorise ouvert alors que sa section n'est pas (encore) la. */
  const allClosed = Object.values(state.pan).every(v=>!v)
                 && allSections().every(s=>!state.boards[s.id]);
  document.querySelector('.wrap').classList.toggle('ring', allClosed);
  const hb = document.getElementById('btnHome');
  if(hb) hb.classList.toggle('hide', allClosed);   /* inutile sur l'accueil */
  syncMains();
}
/* Mesure la rangée « sections principales » et la publie dans --mainsH :
   l'anneau se recentre en dessous, quelle que soit la hauteur réelle des
   cartes (une ligne sur ordinateur, deux sur téléphone). Aucune boucle de
   rétroaction : les cartes sont en position:absolute, leur hauteur ne
   dépend pas de --mainsH. */
function syncMains(){
  const w = document.querySelector('.wrap');
  if(!w) return;
  if(!w.classList.contains('ring')){ w.style.setProperty('--mainsH','0px'); return; }
  const b = document.querySelector('.boards');
  /* 26px = décalage haut des cartes, 34px = respiration avant l'anneau. */
  const h = b ? Math.round(b.getBoundingClientRect().height) : 0;
  /* Deux garde-fous appris a l'usage :
     — on ne laisse pas cette hauteur depasser 60 % de l'ecran, sinon la page
       d'accueil reserve un vide enorme sous l'anneau ;
     — une mesure faite trop tot rend zero ; on garde alors la precedente
       plutot que d'ecraser une bonne valeur par une fausse. */
  const plafond = Math.round(window.innerHeight * 0.6);
  if(h > 0) w.style.setProperty('--mainsH', Math.min(h + 60, plafond) + 'px');
}

/* La hauteur REELLE de la barre du haut. Le navigateur s'en sert pour ne plus
   amener une carte derriere elle quand il fait defiler vers elle (voir la
   regle scroll-padding-top). Elle change avec la langue, la largeur, et selon
   qu'on est sur l'accueil ou dans une section : on la remesure. */
function syncBarre(){
  const t = document.querySelector('.topbar');
  if(!t) return;
  const hh = Math.ceil(t.getBoundingClientRect().height);
  if(hh > 0) document.documentElement.style.setProperty('--tbH', hh + 'px');
}
/* Replier / deplier la barre du haut. Au telephone seulement : sur un grand
   ecran elle tient sur une ligne et n'a rien a cacher. */
function togBarre(ev){
  if(ev) ev.stopPropagation();
  if(window.innerWidth > 700) return;
  const b = document.querySelector('.topbar'); if(!b) return;
  b.classList.toggle('repliee');
  b.dataset.choisi = '1';   /* l'artisan a choisi : on ne replie plus a sa place sur cet ecran */
  const p = b.querySelector('.barre-poignee'); if(p) p.setAttribute('aria-expanded', b.classList.contains('repliee') ? 'false' : 'true');
  /* tout de suite (la hauteur est deja connue), et encore apres la mise en
     page : requestAnimationFrame ne tourne pas dans un onglet cache */
  syncBarre();
  requestAnimationFrame(function(){ syncBarre(); syncMains(); });
}
/* Au telephone la barre demarre repliee. A la rotation ou au redimensionnement
   on remet les choses d'equerre : un grand ecran n'a jamais de barre repliee,
   un petit la replie tant que l'artisan n'y a pas touche. */
function plierBarreTel(){
  const b = document.querySelector('.topbar'); if(!b) return;
  if(window.innerWidth > 700) b.classList.remove('repliee');
  else if(!b.dataset.choisi) b.classList.add('repliee');
  const p = b.querySelector('.barre-poignee'); if(p) p.setAttribute('aria-expanded', b.classList.contains('repliee') ? 'false' : 'true');
  syncBarre();
}
window.addEventListener('resize', plierBarreTel);

/* cat : la section ou l'on veut ajouter (le « ＋ » d'un cadre). */
function openAdd(cat){
  remplirSectionsAjout();

     (jeton en route, reconnexion demandee) : on le dit, au lieu d'ouvrir le
     formulaire sur une autre section — la tache serait partie ailleurs. */
  if(cat==='gtasks' && ![...ac.options].some(o=>o.value==='gtasks')){ toast(t('gtPasPret')); return; }

  if(cat && [...ac.options].some(o=>o.value===cat)) ac.value=cat;

/* La fin suit le debut (meme jour, une heure plus tard) tant que l'artisan
   ne l'a pas changee lui-meme : sinon un rendez-vous pose a 14:30 gardait
   « 10:00 » en fin et Google le refusait, ou un rendez-vous d'hier durait
   jusqu'a aujourd'hui. */
function finSuitDebut(){
  const g=id=>document.getElementById(id);
  const d1=g('aDate').value, t1=g('aTime').value;
  if(!g('aDateEnd').dataset.touche || g('aDateEnd').value<d1) g('aDateEnd').value=d1;
  if(t1 && (!g('aTimeEnd').dataset.touche || (g('aDateEnd').value===d1 && g('aTimeEnd').value<=t1))){
    const p=t1.split(':'); let h=Number(p[0])+1; if(h>23) h=23;
    g('aTimeEnd').value=pad(h)+':'+(h===23 && Number(p[0])===23 ? '59' : p[1]);
  }
}
/* Les listes Google Tasks ou l'on peut creer une tache : celles qui sont
   suivies (une tache creee dans une liste non suivie ne reviendrait jamais a
   l'ecran). Vide sans Google Tasks. */
function gtListes(){
  try{
    if(!(window.AP&&AP.gtasks&&AP.gtasks.creerTache&&AP.gtasks.info)) return [];
    const i=AP.gtasks.info(); if(!i.connecte) return [];
    const s=i.suivis||[]; return (i.listes||[]).filter(l=>s.indexOf(l.id)>=0);
  }catch(e){ return []; }
}
/* Les sections proposees dans « إضافة » : toutes, plus « مهام Google Tasks »
   des que Google Tasks est lisible (meme si la section n'a pas encore de
   tache a montrer). Le choix en cours est garde. */
function remplirSectionsAjout(){
  const ac=document.getElementById('aCat'); if(!ac) return;
  const avant=ac.value;
  const secs=secsPour(null).slice();
  if(gtListes().length) secs.push(allSections().find(s=>s.id==='gtasks') || SEC_GTASKS);
  ac.innerHTML=secs.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.ic)+' '+esc(secName(s))+'</option>').join('');
  if(avant && secs.some(s=>s.id===avant)) ac.value=avant;
  const gl=document.getElementById('aGtListe');
  if(gl){
    const av=gl.value, ls=gtListes();
    gl.innerHTML=ls.map(l=>'<option value="'+esc(l.id)+'">'+esc(l.nom||l.id)+'</option>').join('');
    if(av && ls.some(l=>l.id===av)) gl.value=av;
  }
  if(document.getElementById('mAdd') && document.getElementById('mAdd').classList.contains('show')) syncForm();
}
/* OU PART CE QUI EST ECRIT DANS « إضافة » :
   - section « مهام Google Tasks » -> Google Tasks ;
   - une autre section, Google Agenda relie et un agenda ou ecrire -> Google
     Agenda (sauf « في البرنامج فقط ») ;
   - sinon -> le programme, sur cet appareil (comme avant). */
function destinationAjout(){
  const g=id=>document.getElementById(id);
  if(g('aCat').value==='gtasks'){
    const ls=gtListes(), id=g('aGtListe').value || (ls[0]&&ls[0].id) || '';
    const l=ls.find(x=>x.id===id);
    return {type:'gtasks', liste:id, nom:l?(l.nom||l.id):''};
  }
  const dispo=gcalDispo();
  if(!dispo || g('aLocalOnly').checked) return {type:'local', noG:!dispo};
  const cal=AP.gsync.agendaPourEcrire();
  return {type:'gcal', cal:cal, nom:nomAgendaG(cal)};
}
/* ===========================================================================
   FORMULAIRE D'EVENEMENT — memes champs que Google Agenda / Samsung Calendar.
   Trois sorties : le tableau de bord (local), un lien Google pre-rempli, un
   fichier .ics (Samsung, Outlook, Apple).
   Ce qu'un lien Google TRANSPORTE : titre, debut, fin, journee entiere,
   fuseau, description, lieu, invites, recurrence, occupe/libre.
   Ce qu'il NE transporte PAS : rappels, couleur, visibilite, agenda cible,
   type « tache ». Ces champs-la ne survivent que par le .ics (VALARM) ou par
   l'API. Le .ics est donc la voie complete, le lien la voie rapide.
   =========================================================================== */
const WDAYS = ['SU','MO','TU','WE','TH','FR','SA'];

function addRemRow(method, minutes){
  const box=document.getElementById('aRemBox');
  const d=document.createElement('div');
  d.className='remrow';
  d.innerHTML='<select class="rem-m"><option value="popup">'+t('remPopup')+'</option><option value="email">'+t('remMail')+'</option></select>'+
              '<input type="number" class="rem-n" min="0" value="'+(minutes==null?30:minutes)+'">'+
              '<span class="rem-u">'+t('remBefore')+'</span>'+
              '<button class="tbtn" style="height:30px" onclick="this.parentNode.remove()">✕</button>';
  box.appendChild(d);
  if(method) d.querySelector('.rem-m').value=method;
}
function readReminders(){
  return [...document.querySelectorAll('#aRemBox .remrow')].map(r=>({
    method:r.querySelector('.rem-m').value,
    minutes:Math.max(0, parseInt(r.querySelector('.rem-n').value,10)||0)
  }));
}
/* Affiche/masque ce qui depend de « journee entiere » et du type de repetition */
function syncForm(){
  const g=id=>document.getElementById(id);
  const dest=destinationAjout(), gt=dest.type==='gtasks';
  const vis=(id,on)=>{ const e=g(id); if(e) e.style.display=on?'':'none'; };
  /* Google Tasks n'a ni heure, ni fin, ni fuseau, ni repetition, ni lieu, ni
     invites, ni rappel, ni occupe/libre : ces champs disparaissent au lieu
     de laisser croire qu'ils partiront. */
  ['aAllDayBox','aEndFld','aTzFld','aFreqFld','aLocFld','aGuestsFld','aRemFld','aBusyRow'].forEach(id=>vis(id,!gt));
  vis('aGtListeBox', gt); vis('aNoDateBox', gt);
  const pasDeDate = gt && g('aNoDate').checked;
  g('aDate').style.display = pasDeDate ? 'none' : '';
  if(g('aStartLbl')){ g('aStartLbl').textContent = gt ? t('gtDateEdit') : t('fStart'); g('aStartLbl').style.display = pasDeDate ? 'none' : ''; }
  const all=g('aAllDay').checked;
  document.querySelectorAll('#mAdd .tm.hour, #aTime, #aTimeEnd').forEach(e=>{ e.style.display = (all||gt)?'none':''; });
  const f=g('aFreq').value;
  g('aRecBox').style.display = (f && !gt)?'block':'none';
  g('aDaysBox').style.display = (f==='WEEKLY' && !gt)?'flex':'none';
  /* « في البرنامج فقط » n'a de sens que si Google Agenda est la ; le lien
     « فتح في Google Agenda » ne sert que pour ce qui reste ici (sinon il
     fabriquerait un doublon de ce qui part deja tout seul). */
  vis('aLocalBox', !gt && gcalDispo());
  vis('aOpenGBtn', dest.type==='local');
  vis('aIcsBtn', !gt);
  vis('aLinkNote', dest.type==='local');
  const d=g('aDest');
  if(d) d.textContent = gt ? t('destGtasks').replace('%1', dest.nom||'—')
                     : dest.type==='gcal' ? t('destGcal').replace('%1', dest.nom||'')
                     : t(dest.noG ? 'destLocalNoG' : 'destLocal');
  const b=g('aSaveBtn');
  if(b && !b.disabled) b.textContent = gt ? t('saveGtasks') : dest.type==='gcal' ? t('saveGcal') : t('save');
}
/* vide : repartir de cases vierges (ouverture du formulaire). Sinon les jours
   deja coches sont gardes — un changement de langue ou l'arrivee des taches
   Google Tasks ne doivent pas les effacer pendant que l'artisan remplit. */
function buildDaysBox(vide){
  const box=document.getElementById('aDaysBox'); if(!box) return;
  const on = vide ? new Set() : new Set([...box.querySelectorAll('input:checked')].map(c=>c.value));
  box.innerHTML = WDAYS.map((d,i)=>'<label class="dayck"><input type="checkbox" value="'+d+'"'+(on.has(d)?' checked':'')+'><span>'+T[state.lang].daysS[i]+'</span></label>').join('');

/* Recolte le formulaire dans l'objet commun aux deux generateurs. */
function readForm(){
  const g=id=>document.getElementById(id);
  const title=g('aTitle').value.trim();
  if(!title){ g('aTitle').focus(); toast(t('fTitleReq')); return null; }
  const all=g('aAllDay').checked;
  const d1=g('aDate').value||iso(today());
  const t1=all?'':(g('aTime').value||'09:00');
  /* une fin avant le debut n'a pas de sens : meme jour, et sans heure de
     fin (Google, comme l'.ics, compte alors une heure) */
  let d2=g('aDateEnd').value||d1; if(d2<d1) d2=d1;
  let t2=all?'':(g('aTimeEnd').value||'');
  if(!all && d2===d1 && t2 && t2<=t1) t2='';
  const freq=g('aFreq').value;
  let rrule=null;
  if(freq){
    rrule={freq:freq, interval:Math.max(1,parseInt(g('aInterval').value,10)||1)};
    const days=[...document.querySelectorAll('#aDaysBox input:checked')].map(c=>c.value);
    if(freq==='WEEKLY' && days.length) rrule.byDay=days;
    const u=g('aUntil').value, c=parseInt(g('aCount').value,10);
    if(u) rrule.until=u; else if(c>0) rrule.count=c;
  }
  const guests=g('aGuests').value.split(/[,;\s]+/).map(s=>s.trim()).filter(s=>s.indexOf('@')>0);
  return {
    title:title,
    cat:g('aCat').value, sub:g('aSub').value,
    allDay:all,
    start:all? d1 : d1+'T'+t1,
    end:  all? d2 : (t2? d2+'T'+t2 : ''),
    durationMinutes: (!all && !t2) ? 60 : undefined,
    endInclusive:all,
    timezone:(g('aTz').value||'Africa/Algiers').trim(),
    timeZone:(g('aTz').value||'Africa/Algiers').trim(),
    location:g('aLoc').value.trim(),
    description:g('aNotes').value,
    guests:guests, attendees:guests,
    rrule:rrule,
    recurrence: rrule ? ICS.buildRRULE(rrule,{allDay:all}) : '',
    reminders:readReminders(),
    busy:g('aBusy').value==='1',
    transparency:g('aBusy').value==='1'?'OPAQUE':'TRANSPARENT',
    visibility:g('aVis').value,
    categories:[ (SUBS[g('aSub').value]||{}).fr || g('aSub').value ],
    subs:g('aSubs').value.split('\n').map(s=>s.trim()).filter(Boolean)
  };
}
/* Enregistre : dans Google Tasks, dans Google Agenda, ou dans le programme
   (destinationAjout). Un envoi rate laisse le formulaire ouvert et rempli. */
async function saveTask(){
  const ev=readForm(); if(!ev) return;
  const dest=destinationAjout();
  if(dest.type==='local'){
    store.custom.push({
      id:'m|'+Date.now(), title:ev.title, cat:ev.cat, sub:ev.sub,
      date:ev.start.slice(0,10), time:ev.allDay?'':ev.start.slice(11,16),
      notes:ev.description, subs:ev.subs, ev:ev
    });
    lsSet(); buildTasks(); render(); closeModal('mAdd'); toast(t('toastSaved'));
    viderAjout();
    return;
  }
  const b=document.getElementById('aSaveBtn');
  if(!b || b.disabled) return;
  b.disabled=true; b.textContent=t('enCours');
  try{
    if(dest.type==='gtasks'){
      const sansDate=document.getElementById('aNoDate').checked;
      const r=await AP.gtasks.creerTache({ liste:dest.liste, titre:ev.title, notes:ev.description,
        date: sansDate ? '' : ev.start.slice(0,10), sous:ev.subs });
      /* la categorie choisie dans le formulaire, gardee ici (Google Tasks n'en a pas) */
      if(r && r.id && ev.sub && ev.sub!=='perso') setSub(r.id, ev.sub, true);
      closeModal('mAdd'); viderAjout();
      toast(r && r.sousKo ? t('toastGtSousKo').replace('%1', r.sousKo) : t('toastGtOk'));
      state.boards.gtasks=1; applyPanels(); prefSet(); render();
    } else {
      if(!liaisonPrete()) return;
      if(!(await permisAgenda())){ toast(t('gNoWrite')); return; }
      /* le MEME identifiant d'un essai a l'autre, tant que ce formulaire n'a
         pas reussi : un second « حفظ » apres une reponse perdue retrouve le
         rendez-vous deja cree au lieu d'en faire un second */
      /* le meme identifiant pour le MEME rendez-vous (titre, debut, fin,
         section) — un autre rendez-vous tape dans ce formulaire en recoit un
         nouveau, et ne peut jamais remplacer le premier */
      const emp=[ev.title, ev.start, ev.end, ev.cat].join('|');
      if((!ID_AJOUT || EMP_AJOUT!==emp) && AP.gsync.idNeuf){ ID_AJOUT=AP.gsync.idNeuf(); EMP_AJOUT=emp; }
      const r=await AP.gsync.creerTache(Object.assign(versGoogle(ev), {id:ID_AJOUT||undefined}));
      ID_AJOUT=null; EMP_AJOUT=null;
      closeModal('mAdd'); viderAjout(); toast(t(r && r.horsFenetre ? 'gcalHorsFenetre' : 'toastGcalOk'));
      if(state.boards[ev.cat]!==undefined){ state.boards[ev.cat]=1; applyPanels(); prefSet(); }
      render();
    }
  }catch(e){
    toast(msgCreation(e));
  }finally{
    b.disabled=false; syncForm();
  }
}

function exportAllICS(){

     « aujourd'hui » dans l'agenda du telephone. */
  const list=visible().filter(it=>!it.sansDate).map(it=>{

function backupState(){ dl(JSON.stringify(store,null,2),'agendapro-backup-'+iso(today())+'.json'); }
function restoreState(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ try{
    const b=JSON.parse(e.target.result);
    /* une sauvegarde d'avant ces choix n'en porte pas : on les remet a vide,
       sinon ils survivraient a la restauration qui devait les annuler */
    ['subOf','catSk','subSk','titleOf','titleSk'].forEach(k=>{ if(!b || typeof b[k]!=='object' || !b[k]) b[k]={}; });
    store=Object.assign(store,b);
    const ids=new Set((store.subs||[]).map(x=>x.id));
    Object.keys(SUBS).forEach(k=>{ if(SUBS[k].custom && !ids.has(k)) delete SUBS[k]; });
    if(state.sub!=='all' && !SUBS[state.sub]) state.sub='all';
    mergeSubs(); lsSet(); buildTasks(); buildBoardsDOM(); applyI18n(); applyPanels(); render(); toast(t('toastSaved'));
  }catch(x){ toast(t('restoreBad')); } };
  r.readAsText(f); inp.value='';
}
function dl(txt,name){
  const b=new Blob([txt],{type:'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}

/* ---------------------------------------------------------------------------
   GEMINI — conseil et maxime du jour.
   L'ancien code appelait window.claude.complete, qui n'existe QUE dans un
   artefact publie sur claude.ai : depuis un fichier local ou un hebergement,
   l'objet est absent, la fonction sortait immediatement, et la phrase du jour
   restait figee sur la liste locale. D'ou le remplacement par l'API Gemini.

   La cle n'est jamais ecrite dans ce fichier : elle est saisie une fois dans
   le panneau « Sources » et reste dans le localStorage du navigateur. Si la
   page est un jour hebergee, chaque utilisateur saisit la sienne — il n'y a
   rien a voler dans le code source. Pour un vrai produit la cle appartient a
   un serveur : c'est le role de la fonction edge prevue en phase SaaS.
   --------------------------------------------------------------------------- */
const GEM_KEY='agendapro_v1_gemkey', GEM_MODEL_KEY='agendapro_v1_gemmodel';
/* Le nom du modele par defaut vieillit vite : « gemini-2.0-flash » n'est plus
   servi, et une cle parfaitement valide recevait « model not found » — ce que
   l'artisan lisait comme « le lien Gemini ne marche pas ». Aujourd'hui on part
   d'un nom courant, et surtout gemini() demande a Google la liste des modeles
   que la cle a le droit d'appeler des que le nom echoue, en retient un, et
   reessaie : le programme ne se casse plus quand Google renomme ses modeles. */
const GEM_MODEL_DEFAULT='gemini-3.5-flash-lite';   /* le modele que Google recommande aux nouveaux projets, quota gratuit le plus large */
const GEM_CANDS_KEY='agendapro_v1_gemcands';
/* Le RANG d'un modele pour une application comme celle-ci : du texte court,
   une cle gratuite. On ecarte tout ce qui n'est pas un modele de texte
   (direct, voix, image, son, transcription, omni, robotique…) : ce sont eux
   qui sortaient en tete par simple ordre alphabetique — « gemini-omni-1.1-
   flash » contient bien « flash » — et qui n'ont pas de quota gratuit :
   « quota depasse » des le premier essai. Puis : Flash stable (le plus recent
   d'abord), Flash-Lite, Pro, et seulement ensuite les previews. */
function gemRang(nom){
  nom=String(nom||'').toLowerCase();
  /* rien de ce qui n'est pas un modele de texte, ni ce qui n'a pas de quota
     gratuit (Pro, image, video, omni…) : un 429 « limit: 0 » y est certain */
  if(/live|tts|image|audio|embed|transcrib|robotic|computer-use|omni|translate|deep-research|banana|thinking|veo|lyria|imagen|antigravity|pro/.test(nom)) return null;
  const prev = /preview|exp/.test(nom) ? 10 : 0;
  if(/^gemini-1\./.test(nom)) return null;                 /* retires depuis 2025 */
  const vieux = /^gemini-2\./.test(nom) ? 20 : 0;          /* fermes aux nouveaux projets : tout au bout */
  if(/^gemini-/.test(nom)){
    if(/flash-lite/.test(nom)) return 0+prev+vieux;        /* 15/min, 500/jour */
    if(/flash/.test(nom))      return 1+prev+vieux;        /* 5/min, 20/jour  */
    return 5+prev+vieux;
  }
  if(/^gemma-.*-it$/.test(nom)) return 3+prev;             /* gratuit, sans limite payante : dernier filet */
  return null;
}
function gemVersion(nom){ const m=/gemini-(\d+(?:\.\d+)?)/.exec(nom); return m ? parseFloat(m[1]) : 0; }
/* Demande a Google la liste des modeles que CETTE cle peut appeler, la
   range par rang puis par version decroissante, la garde une semaine. */
async function gemModelAuto(k){
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(k)+'&pageSize=200');
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  const ok=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0)
                         .map(m=>String(m.name||'').replace(/^models\//,''))
                         .filter(m=>gemRang(m)!==null);
  ok.sort((a,b)=>gemRang(a)-gemRang(b) || gemVersion(b)-gemVersion(a) || a.localeCompare(b));
  if(!ok.length) throw new Error('EMPTY');
  try{ localStorage.setItem(GEM_CANDS_KEY, JSON.stringify({t:Date.now(), l:ok})); }catch(e){}
  return ok;
}
function gemCandsCached(){
  try{ const c=JSON.parse(localStorage.getItem(GEM_CANDS_KEY)||'null');
       if(c && Array.isArray(c.l) && c.l.length && Date.now()-c.t < 7*24*60*60*1000) return c.l; }catch(e){}
  return null;
}
function gemKey(){ try{ return localStorage.getItem(GEM_KEY)||''; }catch(e){ return ''; } }
function gemModel(){ try{ return localStorage.getItem(GEM_MODEL_KEY)||GEM_MODEL_DEFAULT; }catch(e){ return GEM_MODEL_DEFAULT; } }

function gemState(cls,msg){
  const e=document.getElementById('gemState'); if(!e) return;
  e.className='gemstate '+(cls||''); e.textContent=msg||'';
}
async function gemini(prompt, essais){
  const k=gemKey(); if(!k) throw new Error('NOKEY');
  essais = essais || { n:0, faits:{} };
  const modele = gemModel();
  essais.faits[modele] = 1;
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+
            encodeURIComponent(modele)+':generateContent?key='+encodeURIComponent(k);
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],
      generationConfig:{maxOutputTokens:180}})});
  if(!r.ok){
    let d='', raison='', statut='';
    try{ const j=await r.json(); const e=(j&&j.error)||{}; d=e.message||''; statut=String(e.status||'');
         raison=String((((e.details||[]).find(x=>x&&x.reason))||{}).reason||''); }catch(e){}
    if(r.status===400 && (raison==='API_KEY_INVALID' || /API key/i.test(d))) throw new Error(t('gemBadKey'));
    if(r.status===400 && statut==='FAILED_PRECONDITION') throw new Error('HTTP 400 - '+d.slice(0,160));
    if(r.status===403) throw new Error('HTTP 403'+(d? ' - '+d.slice(0,140):''));
    /* Le modele en place ne repond pas : inconnu ou retire (404), sans
       quota pour cette cle ou quota du jour epuise (429), surcharge (5xx),
       ou refuse (400 « not supported »). On ne s'arrete pas la : la liste
       des modeles que la cle peut appeler est demandee a Google (ou reprise
       de la semaine), et on passe au suivant — quatre fois au plus. C'est ce
       qui rendait « quota depasse » definitif alors qu'un autre modele, lui,
       repondait tout de suite. */
    const changer = r.status===404 || r.status===429 || r.status>=500 ||
                    (r.status===400 && /not found|not supported|deprecated/i.test(d));
    if(changer && essais.n < 4){
      let cands = gemCandsCached();
      if(!cands || cands.every(c=>essais.faits[c])){ try{ cands = await gemModelAuto(k); }catch(e){ cands = []; } }
      const suivant = cands.find(c=>!essais.faits[c]);
      if(suivant){
        essais.n++;
        try{ localStorage.setItem(GEM_MODEL_KEY,suivant); }catch(e){}
        const gm=document.getElementById('gemModel'); if(gm) gm.value=suivant;
        gemState('wait', t('gemAuto').replace('%1',suivant));
        return gemini(prompt, essais);
      }
    }
    throw new Error('HTTP '+r.status+(d? ' - '+d.slice(0,140):''));
  }
  const j=await r.json();
  const c=(j.candidates||[])[0]||{}, parts=((c.content||{}).parts)||[];
  const txt=(parts[0]||{}).text||'';
  if(!txt.trim()) throw new Error('EMPTY');
  return txt.trim();
}
/* Resume compact de la journee, pour que le conseil parle de VOS dossiers
   et non de generalites. */
function dailyContext(){
  const T0=today(), W=addDays(T0,7);
  const live=TASKS.filter(it=>{ const s=statusOf(it); return !it.routine && !it.sansDate && s!=='done' && s!=='passed'; });
  const late=live.filter(i=>parse(i.date)<T0 && parse(i.date)>=addDays(T0,-60));
  const soon=live.filter(i=>parse(i.date)>=T0 && parse(i.date)<=W)
                 .sort((a,b)=>a.date.localeCompare(b.date));
  const nx=soon[0]||live.filter(i=>parse(i.date)>=T0).sort((a,b)=>a.date.localeCompare(b.date))[0];
  let s='';
  if(nx){
    const l=clOf(nx), d=clDone(nx);
    s='Prochaine echeance: "'+nx.title.fr+'" dans '+diffDays(nx.date)+' jours'+
      (l.length? ' ('+d.length+'/'+l.length+' pieces pretes)':'')+'. ';
  }
  s+='En retard: '+late.length+'. Cette semaine: '+soon.length+'.';
  if(late.length) s+=' Exemple en retard: "'+late[0].title.fr+'".';
  return s;
}
async function fetchDaily(){
  if(!gemKey()){ gemState('', t('gemOff')); return; }
  if(dailyData && dailyData.src==='ai' && dailyData.date===iso(today())){ gemState('ok', t('gemOn')); return; }
  const k = dailyKind(), ctx = dailyContext();
  const AR_TIP = 'انت مساعد تنفيذي. هذه حالة ملفات صاحب مؤسسة صغيرة اليوم:\n'+ctx+
    '\n\nاكتب نصيحة عملية واحدة تخص وضعه هذا تحديدا. جملة واحدة، 20 كلمة كحد اقصى، بالعربية الفصيحة، بدون علامات تنصيص وبدون مقدمات.';
  const AR_WIS = 'اكتب حكمة قصيرة اصيلة عن ادارة الوقت والانتظام في العمل. جملة واحدة، 18 كلمة كحد اقصى، بالعربية الفصيحة، بدون علامات تنصيص وبدون مقدمات. اجعلها غير مالوفة.';
  const FR_TIP = "Tu es un assistant de direction. Voici l'etat des dossiers d'un chef de petite entreprise aujourd'hui :\n"+ctx+
    "\n\nEcris un conseil pratique qui vise precisement cette situation. Une phrase, 20 mots maximum, sans guillemets, sans preambule.";
  const FR_WIS = "Ecris une courte maxime originale sur la gestion du temps et la regularite. Une phrase, 18 mots maximum, sans guillemets, sans preambule. Qu'elle soit inattendue.";
  const p = state.lang==='ar' ? (k==='tip'? AR_TIP : AR_WIS) : (k==='tip'? FR_TIP : FR_WIS);
  const lang = state.lang, day = iso(today());
  gemState('wait', t('gemChecking'));
  try{
    const r = await gemini(p);
    const txt = r.replace(/^[\s"'“«]+|[\s"'”»]+$/g,'').split('\n')[0].trim();
    const arabic = /[؀-ۿ]/.test(txt);
    const okLang = lang==='ar' ? arabic : !arabic;
    if(txt && okLang && state.lang===lang && day===iso(today())){
      dailyData={date:day, kind:k, text:txt, src:'ai', lang:lang};
      try{ localStorage.setItem(DAY_KEY, JSON.stringify(dailyData)); }catch(e){}
      renderBrief(visible()); gemState('ok', t('gemOn'));
    } else {
      gemState('err', t('gemLang'));
    }
  }catch(e){
    /* On affiche le vrai message de Google : c'est lui qui dit si la cle est
       invalide, le quota epuise, ou le nom de modele inconnu. */
    const m=String(e.message||e);
    /* les cas courants en clair, dans la langue de l'artisan ; le reste tel quel */
    const clair = m==='NOKEY' ? t('gemOff')
                : m==='EMPTY' ? t('gemEmpty')
                : /^HTTP 429/.test(m) ? t('gemQuota')
                : /^HTTP 40[13]/.test(m) ? t('gemBadKey')
                : /Failed to fetch|NetworkError|Load failed/i.test(m) ? t('gemNet')
                : m;
    gemState('err', clair);
  }
}
function newDaily(){ if(!gemKey()) toast(t('gemOff')); dailyData=null; localStorage.removeItem(DAY_KEY); loadDayCache(); renderBrief(visible()); fetchDaily(); }

/* Le demarrage passe par le verrou. Deux cas, et deux seulement :
     - AUCUN mot de passe defini : AP.lock.deferBoot appelle init() sur-le-champ.
       Rien ne change, pas une milliseconde de retard.
     - un mot de passe defini : init() attend que le mot de passe ait dechiffre
       les donnees. Le tableau ne se construit donc jamais sur du vide, et il
       n'y a rien a afficher avant.
   Si app/lock/lock.js n'est pas la, DEUX cas bien differents :
     - aucun mot de passe n'a jamais ete defini : on demarre comme avant, le
       programme ne doit pas rester bloque a cause d'un fichier de securite ;
     - un mot de passe EST defini (la fiche du verrou est dans le stockage) :
       on ne demarre surtout PAS. Sans lock.js, le tableau lirait un stockage
       vide, afficherait une page blanche — et la premiere modification
       ecrirait par-dessus, en clair, a cote du coffre. On s'arrete donc net et
       on explique, dans les deux langues. */
if (window.AP && window.AP.lock && window.AP.lock.deferBoot) {
  window.AP.lock.deferBoot(init);
} else {
  let verrouPose = false;
  try { verrouPose = !!localStorage.getItem('agendapro_lock_v1'); } catch(e){}
  if (!verrouPose) init();
  else {
    document.documentElement.classList.add('ap-locked');
    const d = document.createElement('div');
    d.className = 'ap-lock';
    /* L'identifiant compte : la regle de lock.css qui masque la page laisse
       passer #apLock, et rien d'autre. Sans lui, ce message serait cache par
       la regle censee le mettre en avant. */
    d.id = 'apLock';
    /* Habillage minimal ecrit ici meme : si lock.js manque, lock.css manque
       probablement aussi, et ce message doit rester lisible quand meme. */
    d.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-start;'+
      'justify-content:center;padding:22px;overflow:auto;background:var(--bg,#f5f7fa);text-align:center';
    d.innerHTML = '<div class="ap-lock-card" style="max-width:430px;padding:28px;border-radius:18px;'+
      'background:var(--surface,#fff);border:1px solid var(--line,#e3e9f0)"><div class="ap-lock-logo">⚠️</div>'+
      '<h2>app/lock/lock.js</h2>'+
      '<p class="ap-lock-sub">ملف الأمان غير موجود، وبياناتك مشفَّرة به. لا تغيّر شيئاً: '+
      'أعد الملف <b>app/lock/lock.js</b> إلى مكانه وافتح البرنامج من جديد. بياناتك سليمة.</p>'+
      '<p class="ap-lock-foot">Le fichier de securite est absent et vos donnees sont chiffrees avec lui. '+
      'Ne changez rien : remettez <b>app/lock/lock.js</b> a sa place et rouvrez le programme. '+
      'Vos donnees sont intactes.</p></div>';
    document.body.appendChild(d);
  }
}

     LE MORCEAU DE PAGE DE LA BRIQUE VENTE.
     --------------------------------------------------------------------------
     DEUX FACONS DE S'EN SERVIR, exactement comme pour app/auth/auth-ui.html :

     (A) RECOMMANDE — copiez tout ce fichier et collez-le dans index.html,
         juste avant </body>, a la suite du bloc de la brique COMPTES.
         Avantage : cela fonctionne meme quand la page est ouverte
         directement depuis le disque (adresse « file:// »), ou le navigateur
         interdit a une page de lire un fichier voisin.

     (B) Ne rien coller : billing.js tente de telecharger ce fichier et de
         l'inserer lui-meme. Cela ne marche que derriere un vrai serveur web.

     Dans les deux cas billing.js reconnait le bloc a son identifiant
     « apBillRoot » et ne l'ajoute jamais deux fois.

     POURQUOI « data-apbt » ET PAS « data-t » NI « data-apt » ?
     ---------------------------------------------------------
     Trois traducteurs cohabitent dans cette page :
        data-t    appartient a l'application d'origine ;
        data-apt  appartient a la brique COMPTES ;
        data-apbt appartient a la brique VENTE, c'est-a-dire a ce fichier.
     Si deux briques partageaient le meme marqueur, celle qui passe en dernier
     effacerait les textes de l'autre (elle ne connait pas ses cles) et vous
     verriez des libelles vides sans comprendre pourquoi.
        data-apbt      -> le texte de l'element
        data-apbt-ph   -> le texte grise d'un champ de saisie (placeholder)

     Les textes sont VOLONTAIREMENT VIDES ici : billing.js les remplit en
     arabe ou en francais selon la langue de la page. Rien a traduire a la
     main, et rien a retoucher le jour ou vous corrigez une formulation.

     TOUT LE STYLE VIENT DE VOTRE APPLICATION
     ----------------------------------------
     .modal, .modal-in, .modal-h, .modal-b, .modal-f, .fld, .row2, .mb,
     .mb.pri, .tbtn, .note-line : ce sont VOS classes, celles d'index.html.
     billing.js n'ajoute qu'une poignee de classes « apb- » pour ce qui
     n'existe pas encore (la grille de prix, la liste des membres), et elles
     n'utilisent que vos variables de couleur. Il n'y a pas de seconde charte
     graphique dans ce projet.
     ========================================================================== -->

     L'ORDRE COMPTE : la configuration d'abord, puis le client Supabase, puis
     les briques qui s'en servent. billing.js vient apres auth.js parce qu'il
     lit AP.auth pour savoir qui est connecte.

     TANT QUE app/config.js EST VIDE, RIEN DE TOUT CELA NE S'ACTIVE : aucune
     requete reseau, aucun message dans la console, aucun changement visible.
     Le tableau de bord continue de fonctionner hors ligne sur le localStorage,
     exactement comme avant. C'est la regle que toutes les briques respectent.
     ========================================================================== -->
<script src="app/config.js"></script>
<!-- setup.js vient ICI, entre la configuration et le client Supabase, et
     nulle part ailleurs. Il verse dans window.AP_CONFIG les valeurs saisies
     dans le panneau « Liaison et compte » et gardees dans le localStorage :
     le client Supabase, charge juste apres, les lit comme si elles avaient
     toujours ete dans config.js. Place plus bas, il arriverait trop tard —
     le client aurait deja constate une configuration vide. -->
<script src="app/setup/setup.js"></script>
<script src="app/supabase-client.js"></script>
<script src="app/auth/auth.js"></script>
<!-- L'ORDRE DE CES DEUX LIGNES N'EST PAS NEGOCIABLE : sync.js publie
     window.AP.sync et sa boite a outils interne, migrate.js s'y accroche.
     Charge en premier, migrate.js se desactivait tout seul avec un
     avertissement dans la console, et le transfert des donnees locales vers
     le compte n'etait JAMAIS propose. -->
<script src="app/sync/sync.js"></script>
<script src="app/sync/migrate.js"></script>
<script src="app/billing/billing.js"></script>
<script src="app/pwa/pwa.js"></script>

<!-- ==========================================================================
     LA SYNCHRONISATION PAR GOOGLE AGENDA — LE BUREAU ET LE TELEPHONE.
     --------------------------------------------------------------------------
     POURQUOI CES TROIS LIGNES SONT ICI, ET APRES LES PRECEDENTES.
     L'artisan veut travailler depuis son bureau ET depuis son telephone, et
     retrouver la meme chose des deux cotes. Google Agenda sait deja faire
     voyager les RENDEZ-VOUS entre ses appareils, gratuitement et sans serveur.
     Ce qui ne voyageait pas, c'est ce que l'artisan AJOUTE par-dessus : le
     statut, les documents coches, ses notes, le contact, le lieu. Ces trois
     briques rangent ces annotations DANS le rendez-vous lui-meme, dans un
     casier prive que l'application Google Agenda n'affiche jamais et que
     Google recopie tout seul d'un appareil a l'autre.

     LA COUCHE SUPABASE AU-DESSUS N'EST NI CASSEE NI SUPPRIMEE : elle dort.
     Le jour ou son quota sera regle, elle reviendra A COTE de celle-ci, pas a
     sa place. C'est pour cela que ces lignes viennent APRES et non a la place
     des precedentes : rien n'a ete retire, rien n'a change d'ordre.

     L'ORDRE DE CES TROIS LIGNES N'EST PAS NEGOCIABLE :
       gauth.js   publie AP.gauth   — il obtient le jeton, et lui seul ;
       gsync.js   publie AP.gsync   — il lit et annote, il a besoin de gauth ;
       gbridge.js publie AP.gbridge — il branche les deux au tableau de bord.
     Charge en premier, gbridge ne trouverait ni l'un ni l'autre.

     TANT QUE app/config.js NE CONTIENT PAS DE googleClientId ET QUE L'ARTISAN
     NE S'EST PAS CONNECTE, CES TROIS FICHIERS NE FONT RIEN : aucune requete,
     aucun message dans la console, aucun element ajoute a la page, pas une
     instruction de plus au rendu. Le tableau de bord reste exactement celui
     d'hier, avec ses rendez-vous ecrits dans le fichier.
     ========================================================================== -->
<script src="app/google/gauth.js"></script>
<script src="app/google/gsync.js"></script>
<script src="app/google/gtasks.js"></script>
<script src="app/google/gbridge.js"></script>

<!-- ==========================================================================
     LA SYNCHRONISATION PAR MICROSOFT (Outlook / Microsoft 365 / To Do).
     Le jumeau du bloc Google ci-dessus, charge APRES lui et pour la meme
     raison que gbridge vient apres gauth/gsync : mbridge enveloppe a son tour
     window.buildTasks (qui, a ce point, contient deja les rendez-vous de
     Google) et applique en dernier le choix « quelles sources afficher »
     (app/microsoft/mbridge.js, PARTIE 4) — voir ce fichier pour le detail.

     TANT QUE app/config.js NE CONTIENT PAS DE microsoftClientId ET QUE
     L'ARTISAN NE S'EST PAS CONNECTE, CES TROIS FICHIERS NE FONT RIEN.
     ========================================================================== -->
<script src="app/microsoft/mauth.js"></script>
<script src="app/microsoft/msync.js"></script>
<script src="app/microsoft/mbridge.js"></script>

<!-- ==========================================================================
     LE PONT VERS LA SYNCHRONISATION (app/INTEGRATION.md, brique 2, point 2).
     Pourquoi ici et pas dans le grand bloc de script du haut : `store`, `state`,
     `TASKS` et `SUBS` y sont declares avec let/const. Ces declarations sont
     visibles par TOUS les blocs de script classiques de la page, mais elles
     n'existent pas sur window : aucun fichier externe ne peut les atteindre.
     On les passe donc a la main, depuis un bloc place APRES sync.js —
     sinon window.AP.sync n'existerait pas encore.
     `TASKS` est passe sous forme de fonction parce que buildTasks() fait
     « TASKS = out » : une reference figee vieillirait des le premier rendu.
     Sans compte configure, tout ce bloc reste sans effet.
     ========================================================================== -->
<script>
if (window.AP && AP.sync && typeof AP.sync.bind === 'function') {
  try {
    AP.sync.bind({
      store: store, state: state, lsSet: lsSet,
      buildTasks: buildTasks, render: render, toast: toast,
      TASKS: function () { return TASKS; },
      SUBS: SUBS,
      /* LES SECTIONS ET LES CATEGORIES QUI REDESCENDENT DU COMPTE.
         sync.js ne sait ecrire que dans `store` ; or une section ajoutee a
         store.sections n'apparait a l'ecran qu'apres buildBoardsDOM(), et une
         categorie ajoutee a store.subs n'existe pour le reste du code qu'apres
         mergeSubs(). Ces fonctions sont declarees ici, dans le grand bloc du
         haut, et invisibles depuis un fichier externe : on les passe donc par
         le pont, exactement comme lsSet, buildTasks et render.
         C'est la meme sequence que celle d'addSection() juste au-dessus — si
         elle change la, elle doit changer ici. */
      rebuildBoards: function () {
        mergeSubs();
        buildBoardsDOM();
        applyI18n();
        applyPanels();
        render();
      }
    });
    AP.sync.init();
    /* LE TRANSFERT DES DONNEES LOCALES — ARMER, PAS TENTER SA CHANCE.
       Ici, a la fin de l'analyse du HTML, le client Supabase n'existe pas
       encore : il se fabrique de facon asynchrone, en allant chercher sa
       librairie sur le reseau. Un appel direct a maybeOffer() a cet instant
       ne trouve aucune session et renvoie false, TOUJOURS — c'est exactement
       le bogue qui a fait que le transfert n'a jamais pu demarrer, et que le
       proprietaire s'est connecte sans que ses donnees montent dans son
       compte. arm() pose des ecouteurs et rappelle la proposition quand la
       session est REELLEMENT ouverte (voir app/sync/migrate.js, section 8).
       Le repli sur maybeOffer() ne sert qu'aux copies de migrate.js
       anterieures a ce correctif. */
    if (AP.sync.migrate) {
      if (typeof AP.sync.migrate.arm === 'function') {
        AP.sync.migrate.arm();
      } else if (typeof AP.sync.migrate.maybeOffer === 'function') {
        AP.sync.migrate.maybeOffer();
      }
    }
  } catch (e) {
    /* Le tableau de bord doit demarrer meme si la couche nuage echoue. */
    try { console.warn('[pont AP.sync] ' + (e && e.message)); } catch (e2) {}
  }
}
</script>

<!-- ==========================================================================
     LE PONT VERS GOOGLE AGENDA.
     --------------------------------------------------------------------------
     Meme raison d'etre que le bloc precedent : `store`, `state`, `TASKS` et
     `SUBS` sont declares plus haut avec let/const. Ils sont visibles par tous
     les blocs de script de cette page, mais ils n'existent PAS sur window :
     aucun fichier externe ne peut les atteindre. On les passe donc a la main.

     DEUX DIFFERENCES AVEC LE BLOC PRECEDENT, ET ELLES COMPTENT :

     1. `buildTasks` et `render` sont passes SOUS FORME D'ENVELOPPE
        (function(){ return window.buildTasks(); }) et non directement.
        Pourquoi : app/google/gbridge.js remplace window.buildTasks par une
        version qui, apres coup, fait entrer les rendez-vous de Google dans la
        liste et en retire les doublons. Si on passait ici la fonction elle-
        meme, on figerait la version d'AVANT ce remplacement : le moteur
        Google appellerait l'ancienne, et les doublons reviendraient. Avec
        l'enveloppe, tout le monde appelle toujours la version en cours.

     2. On appelle AP.gbridge.brancher() et LUI SEUL. C'est lui qui repasse le
        meme pont au moteur (AP.gsync.bind) : un seul pont, une seule verite.
        Deux ponts differents seraient deux occasions de diverger.

     Sans googleClientId et sans liaison, ce bloc ne declenche rien du tout.
     ========================================================================== -->
<script>
if (window.AP && AP.gbridge && typeof AP.gbridge.brancher === 'function') {
  try {
    AP.gbridge.brancher({
      store: store, state: state, lsSet: lsSet,
      buildTasks: function () { return window.buildTasks(); },
      render:     function () { return window.render(); },
      toast: toast,
      TASKS: function () { return TASKS; },
      SUBS: SUBS,
      rebuildBoards: function () {
        mergeSubs();
        buildBoardsDOM();
        applyI18n();
        applyPanels();
        render();
      }
    });
  } catch (e) {
    /* Le tableau de bord doit demarrer meme si la couche Google echoue. */
    try { console.warn('[pont Google] ' + (e && e.message)); } catch (e2) {}
  }
}
/* Le meme pont, pour Microsoft — apres celui de Google, pour la meme raison
   que app/microsoft/mbridge.js se charge apres app/google/gbridge.js : quand
   les deux sont branches, l'enveloppe de Microsoft doit envelopper celle de
   Google, jamais l'inverse (voir ce fichier, PARTIE 5). */
if (window.AP && AP.mbridge && typeof AP.mbridge.brancher === 'function') {
  try {
    AP.mbridge.brancher({
      store: store, state: state, lsSet: lsSet,
      buildTasks: function () { return window.buildTasks(); },
      render:     function () { return window.render(); },
      toast: toast,
      TASKS: function () { return TASKS; },
      SUBS: SUBS,
      rebuildBoards: function () {
        mergeSubs();
        buildBoardsDOM();
        applyI18n();
        applyPanels();
        render();
      }
    });
  } catch (e) {
    /* Le tableau de bord doit demarrer meme si la couche Microsoft echoue. */
    try { console.warn('[pont Microsoft] ' + (e && e.message)); } catch (e2) {}
  }
}
</script>
