<!-- ==========================================================================
     AGENDA PRO — app/auth/auth-ui.html
     LE MORCEAU DE PAGE DE LA BRIQUE COMPTES.
     --------------------------------------------------------------------------
     DEUX FACONS DE S'EN SERVIR, au choix :

     (A) RECOMMANDE — copiez tout ce fichier (sans ce commentaire si vous
         voulez) et collez-le dans index.html juste avant </body>.
         Avantage : ca marche meme quand la page est ouverte directement
         depuis le disque (adresse « file:// »), ou le navigateur interdit de
         lire un fichier voisin.

     (B) Ne rien coller du tout : auth.js va tenter de telecharger ce fichier
         et de l'inserer lui-meme. Cela ne fonctionne que si la page est
         servie par un vrai serveur web (https://…).

     Dans les deux cas auth.js reconnait le bloc a son identifiant
     « apAuthRoot » et ne l'ajoute pas deux fois.

     POURQUOI « data-apt » ET PAS « data-t » ?
     Parce que l'application d'origine possede deja sa propre fonction de
     traduction qui balaie tous les elements marques data-t. Si on utilisait
     le meme nom, elle effacerait nos textes (elle ne connait pas nos cles).
     La brique COMPTES a donc son propre marqueur : data-apt pour le texte,
     data-apt-ph pour le texte grise d'un champ de saisie.

     Les textes sont volontairement VIDES ici : auth.js les remplit en arabe
     ou en francais selon la langue de la page. Rien a traduire a la main.
     ========================================================================== -->

<div id="apAuthRoot">

  <!-- ====================================================================
       1. LA PASTILLE D'ETAT
       auth.js la deplace automatiquement dans la barre du haut (.tools),
       a cote des boutons existants. Si la barre n'existe pas, elle reste
       flottante en haut de l'ecran : jamais d'ecran blanc.
       ==================================================================== -->
  <div class="ap-badge" id="apBadge" hidden>
    <button type="button" class="tbtn ap-badge-btn" id="apBadgeBtn">
      <span class="ap-dot" id="apDot"></span>
      <span class="ap-badge-lbl" id="apBadgeLbl"></span>
      <span class="ap-role" id="apRoleLbl" hidden></span>
      <span class="ap-caret">▾</span>
    </button>

    <div class="ap-menu" id="apMenu" hidden>
      <!-- Visible quand personne n'est connecte -->
      <button type="button" class="ap-mi" data-ap-act="open-auth"  data-ap-when="out"><span>🔑</span><span data-apt="signIn"></span></button>
      <button type="button" class="ap-mi" data-ap-act="retry"      data-ap-when="down"><span>🔄</span><span data-apt="retry"></span></button>

      <!-- Visible quand on est connecte -->
      <div class="ap-mi-head" data-ap-when="in"><span id="apMenuMail"></span></div>
      <button type="button" class="ap-mi" data-ap-act="account"    data-ap-when="in"><span>👤</span><span data-apt="myAccount"></span></button>
      <button type="button" class="ap-mi" data-ap-act="export"     data-ap-when="in"><span>⬇️</span><span data-apt="exportMine"></span></button>
      <div class="ap-sep" data-ap-when="in"></div>
      <button type="button" class="ap-mi" data-ap-act="signout"    data-ap-when="in"><span>🚪</span><span data-apt="signOut"></span></button>
      <button type="button" class="ap-mi" data-ap-act="signoutall" data-ap-when="in"><span>📵</span><span data-apt="signOutAll"></span></button>
      <div class="ap-sep" data-ap-when="in"></div>
      <button type="button" class="ap-mi danger" data-ap-act="delete" data-ap-when="in"><span>🗑️</span><span data-apt="deleteAccount"></span></button>
    </div>
  </div>


  <!-- ====================================================================
       2. CONNEXION / INSCRIPTION / DEFI 2FA
       Une seule fenetre, trois etapes : on n'empile pas trois fenetres
       l'une sur l'autre, c'est illisible sur un telephone.
       ==================================================================== -->
  <div class="modal ap-modal" id="apmAuth">
    <div class="modal-in">
      <div class="modal-h">
        <h3 data-apt="signInTitle"></h3>
        <button type="button" class="mb" data-ap-close="apmAuth">✕</button>
      </div>

      <div class="modal-b">
        <!-- Onglets connexion / inscription -->
        <div class="ap-tabs" id="apTabs">
          <button type="button" class="ap-tab on" data-ap-tab="in"><span data-apt="tabSignIn"></span></button>
          <button type="button" class="ap-tab"    data-ap-tab="up"><span data-apt="tabSignUp"></span></button>
        </div>

        <!-- Bouton Google : place EN HAUT parce que c'est le chemin le plus
             court, et qu'il evite un mot de passe de plus a retenir. -->
        <button type="button" class="ap-google" id="apGoogleBtn">
          <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.8l7.8 6c1.9-5.6 7.2-9.8 13.6-9.8z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.2-.4-4.7H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.3z"/>
            <path fill="#FBBC05" d="M10.4 28.2a14.5 14.5 0 010-8.4l-7.8-6a23.9 23.9 0 000 20.4l7.8-6z"/>
            <path fill="#34A853" d="M24 47.5c6.2 0 11.5-2 15.4-5.6l-7.5-5.8c-2.1 1.4-4.8 2.3-7.9 2.3-6.4 0-11.7-4.2-13.6-9.8l-7.8 6C6.5 42.1 14.6 47.5 24 47.5z"/>
          </svg>
          <span data-apt="withGoogle"></span>
        </button>

        <div class="ap-or"><span data-apt="or"></span></div>

        <!-- Champ nom : uniquement a l'inscription -->
        <div class="fld" id="apFldName" hidden>
          <label data-apt="fullName"></label>
          <input type="text" id="apName" autocomplete="name" data-apt-ph="fullNamePh">
        </div>

        <div class="fld">
          <label data-apt="email"></label>
          <input type="email" id="apEmail" autocomplete="email" inputmode="email" dir="ltr" data-apt-ph="emailPh">
        </div>

        <div class="fld">
          <label data-apt="password"></label>
          <div class="ap-pwd">
            <input type="password" id="apPwd" autocomplete="current-password" dir="ltr">
            <button type="button" class="ap-eye" data-ap-eye="apPwd">👁</button>
          </div>
          <div class="ap-hint" id="apPwdHint" hidden data-apt="pwdRule"></div>
        </div>

        <!-- Etape 2FA : cachee tant que le serveur ne la reclame pas -->
        <div class="fld" id="apFldTotp" hidden>
          <label data-apt="totpCode"></label>
          <input type="text" id="apTotp" inputmode="numeric" autocomplete="one-time-code"
                 maxlength="6" dir="ltr" class="ap-code" placeholder="000000">
          <div class="note-line" data-apt="totpHelp"></div>
        </div>

        <div class="ap-msg" id="apAuthMsg" hidden></div>

        <button type="button" class="ap-link" id="apForgotBtn" data-apt="forgot"></button>
      </div>

      <div class="modal-f">
        <button type="button" class="mb" data-ap-close="apmAuth" data-apt="cancel"></button>
        <button type="button" class="mb pri" id="apAuthGo" data-apt="signIn"></button>
      </div>
    </div>
  </div>


  <!-- ====================================================================
       3. DEMANDE DE LIEN DE REINITIALISATION
       ==================================================================== -->
  <div class="modal ap-modal" id="apmReset">
    <div class="modal-in">
      <div class="modal-h">
        <h3 data-apt="resetTitle"></h3>
        <button type="button" class="mb" data-ap-close="apmReset">✕</button>
      </div>
      <div class="modal-b">
        <div class="note-line" data-apt="resetHelp"></div>
        <div class="fld">
          <label data-apt="email"></label>
          <input type="email" id="apResetMail" autocomplete="email" inputmode="email" dir="ltr">
        </div>
        <div class="ap-msg" id="apResetMsg" hidden></div>
      </div>
      <div class="modal-f">
        <button type="button" class="mb" data-ap-close="apmReset" data-apt="cancel"></button>
        <button type="button" class="mb pri" id="apResetGo" data-apt="sendLink"></button>
      </div>
    </div>
  </div>


  <!-- ====================================================================
       4. RETOUR DU LIEN : CHOIX DU NOUVEAU MOT DE PASSE
       Cette fenetre s'ouvre TOUTE SEULE quand l'utilisateur revient par le
       lien recu dans sa boite. Il n'a rien a chercher.
       ==================================================================== -->
  <div class="modal ap-modal" id="apmNewPwd">
    <div class="modal-in">
      <div class="modal-h">
        <h3 data-apt="newPwdTitle"></h3>
      </div>
      <div class="modal-b">
        <div class="note-line" data-apt="newPwdHelp"></div>
        <div class="fld">
          <label data-apt="newPwd"></label>
          <div class="ap-pwd">
            <input type="password" id="apNewPwd" autocomplete="new-password" dir="ltr">
            <button type="button" class="ap-eye" data-ap-eye="apNewPwd">👁</button>
          </div>
          <div class="ap-hint" data-apt="pwdRule"></div>
        </div>
        <div class="fld">
          <label data-apt="newPwd2"></label>
          <input type="password" id="apNewPwd2" autocomplete="new-password" dir="ltr">
        </div>
        <div class="ap-msg" id="apNewPwdMsg" hidden></div>
      </div>
      <div class="modal-f">
        <button type="button" class="mb" data-ap-close="apmNewPwd" data-apt="later"></button>
        <button type="button" class="mb pri" id="apNewPwdGo" data-apt="save"></button>
      </div>
    </div>
  </div>


  <!-- ====================================================================
       5. MON COMPTE : identite, securite (2FA), appareils, export
       ==================================================================== -->
  <div class="modal ap-modal" id="apmAccount">
    <div class="modal-in wide">
      <div class="modal-h">
        <h3 data-apt="myAccount"></h3>
        <button type="button" class="mb" data-ap-close="apmAccount">✕</button>
      </div>

      <div class="modal-b">

        <!-- Identite -->
        <div class="ap-card">
          <div class="ap-card-h"><span>👤</span><b data-apt="identity"></b></div>
          <div class="ap-kv"><span data-apt="email"></span><b id="apAccMail" dir="ltr"></b></div>
          <div class="ap-kv"><span data-apt="org"></span><b id="apAccOrg"></b></div>
          <div class="ap-kv"><span data-apt="role"></span><b id="apAccRole"></b></div>
          <div class="ap-kv"><span data-apt="since"></span><b id="apAccSince" dir="ltr"></b></div>

          <div class="row2">
            <div class="fld">
              <label data-apt="fullName"></label>
              <input type="text" id="apAccName" autocomplete="name">
            </div>
            <div class="fld">
              <label data-apt="phone"></label>
              <input type="tel" id="apAccPhone" dir="ltr" placeholder="+213…">
            </div>
          </div>
          <div class="ap-actions">
            <button type="button" class="mb" id="apAccSave" data-apt="save"></button>
            <span class="ap-msg inline" id="apAccMsg" hidden></span>
          </div>
        </div>

        <!-- Securite : 2FA -->
        <div class="ap-card">
          <div class="ap-card-h"><span>🔐</span><b data-apt="security"></b></div>
          <div class="note-line" data-apt="mfaWhy"></div>

          <div class="ap-kv"><span data-apt="mfaState"></span><b id="apMfaState"></b></div>

          <!-- Enrolement : le QR code n'apparait qu'apres un clic -->
          <div id="apMfaEnroll" hidden>
            <div class="ap-qr">
              <img id="apMfaQr" alt="QR">
            </div>
            <div class="ap-secret">
              <span data-apt="mfaSecret"></span>
              <code id="apMfaSecret" dir="ltr"></code>
            </div>
            <div class="fld">
              <label data-apt="totpCode"></label>
              <input type="text" id="apMfaCode" inputmode="numeric" maxlength="6" dir="ltr" class="ap-code" placeholder="000000">
            </div>
            <div class="ap-actions">
              <button type="button" class="mb" id="apMfaCancel" data-apt="cancel"></button>
              <button type="button" class="mb pri" id="apMfaConfirm" data-apt="mfaConfirm"></button>
            </div>
          </div>

          <div class="ap-actions" id="apMfaButtons">
            <button type="button" class="mb pri" id="apMfaStart" data-apt="mfaEnable"></button>
            <button type="button" class="mb danger" id="apMfaOff" hidden data-apt="mfaDisable"></button>
          </div>
          <div class="ap-msg" id="apMfaMsg" hidden></div>
          <div class="note-line warn" data-apt="mfaNoBackup"></div>
        </div>

        <!-- Mot de passe -->
        <div class="ap-card">
          <div class="ap-card-h"><span>🔑</span><b data-apt="pwdTitle"></b></div>
          <div class="row2">
            <div class="fld">
              <label data-apt="newPwd"></label>
              <div class="ap-pwd">
                <input type="password" id="apChgPwd" autocomplete="new-password" dir="ltr">
                <button type="button" class="ap-eye" data-ap-eye="apChgPwd">👁</button>
              </div>
            </div>
            <div class="fld">
              <label data-apt="newPwd2"></label>
              <input type="password" id="apChgPwd2" autocomplete="new-password" dir="ltr">
            </div>
          </div>
          <div class="ap-actions">
            <button type="button" class="mb" id="apChgPwdGo" data-apt="save"></button>
            <span class="ap-msg inline" id="apChgPwdMsg" hidden></span>
          </div>
        </div>

        <!-- Appareils et sessions -->
        <div class="ap-card">
          <div class="ap-card-h"><span>💻</span><b data-apt="devices"></b></div>
          <div id="apDevList" class="ap-devlist"></div>
          <div class="ap-actions">
            <button type="button" class="mb danger" id="apRevokeAll" data-apt="signOutAll"></button>
          </div>
          <div class="note-line" data-apt="revokeHelp"></div>
        </div>

        <!-- Export RGPD -->
        <div class="ap-card">
          <div class="ap-card-h"><span>⬇️</span><b data-apt="exportTitle"></b></div>
          <div class="note-line" data-apt="exportHelp"></div>
          <div class="ap-actions">
            <button type="button" class="mb" id="apExpJson">JSON</button>
            <button type="button" class="mb" id="apExpCsv">CSV</button>
            <span class="ap-msg inline" id="apExpMsg" hidden></span>
          </div>
        </div>

        <!-- Suppression -->
        <div class="ap-card danger">
          <div class="ap-card-h"><span>🗑️</span><b data-apt="deleteAccount"></b></div>
          <div class="note-line bad" data-apt="deleteWarn"></div>
          <div class="ap-actions">
            <button type="button" class="mb danger" id="apDelOpen" data-apt="deleteOpen"></button>
          </div>
        </div>

      </div>

      <div class="modal-f">
        <button type="button" class="mb" data-ap-close="apmAccount" data-apt="close"></button>
      </div>
    </div>
  </div>


  <!-- ====================================================================
       6. SUPPRESSION DEFINITIVE — ecran de confirmation
       On demande de RETAPER son adresse : c'est le seul geste qu'on ne fait
       pas par reflexe. Un simple « Etes-vous sur ? » se clique sans lire.
       ==================================================================== -->
  <div class="modal ap-modal" id="apmDelete">
    <div class="modal-in">
      <div class="modal-h">
        <h3 data-apt="deleteTitle"></h3>
        <button type="button" class="mb" data-ap-close="apmDelete">✕</button>
      </div>
      <div class="modal-b">
        <div class="note-line bad" data-apt="deleteList"></div>

        <div class="fld">
          <label data-apt="deleteRetype"></label>
          <input type="email" id="apDelMail" dir="ltr" autocomplete="off" spellcheck="false">
        </div>

        <div class="fld" id="apDelPwdFld">
          <label data-apt="confirmPwd"></label>
          <div class="ap-pwd">
            <input type="password" id="apDelPwd" autocomplete="current-password" dir="ltr">
            <button type="button" class="ap-eye" data-ap-eye="apDelPwd">👁</button>
          </div>
          <div class="ap-hint" data-apt="confirmPwdHelp"></div>
        </div>

        <div class="fld" id="apDelTotpFld" hidden>
          <label data-apt="totpCode"></label>
          <input type="text" id="apDelTotp" inputmode="numeric" maxlength="6" dir="ltr" class="ap-code" placeholder="000000">
        </div>

        <label class="ap-check">
          <input type="checkbox" id="apDelOk">
          <span data-apt="deleteUnderstand"></span>
        </label>

        <div class="ap-msg" id="apDelMsg" hidden></div>
      </div>
      <div class="modal-f">
        <button type="button" class="mb" data-ap-close="apmDelete" data-apt="cancel"></button>
        <button type="button" class="mb danger" id="apDelGo" disabled data-apt="deleteForever"></button>
      </div>
    </div>
  </div>

</div>
